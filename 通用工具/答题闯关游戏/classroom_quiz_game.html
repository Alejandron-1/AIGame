<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学数学答题闯关游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #FF6B6B;
            --secondary-color: #4ECDC4;
            --accent-color: #FFE66D;
            --bg-color: #FFF5F5;
            --text-color: #2C3E50;
            --correct-color: #2ECC71;
            --wrong-color: #E74C3C;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --border-radius: 20px;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-image 0.5s ease;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            z-index: -1;
        }

        .game-container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* 左侧导航栏 */
        .sidebar {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .nav-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .nav-btn.settings {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .score-board {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            border-radius: 15px;
            text-align: center;
            color: white;
        }

        .score-board h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .level-info {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        /* 中间题目区域 */
        .main-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .question-card {
            background: white;
            padding: 60px 80px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,230,109,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .question-text {
            font-size: 72px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
            letter-spacing: 10px;
        }

        .answer-display {
            font-size: 56px;
            font-weight: bold;
            color: var(--primary-color);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 15px;
            border: 4px dashed #dee2e6;
            position: relative;
            z-index: 1;
            transition: all 0.3s;
        }

        .answer-display.has-input {
            border-color: var(--secondary-color);
            background: #e8f8f5;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-top: 30px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            border-radius: 5px;
        }

        /* 右侧数字键盘 */
        .keypad-area {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .keypad-area h3 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 20px;
            font-size: 22px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .key-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 15px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .key-btn.number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .key-btn.action {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 24px;
        }

        .key-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.1);
        }

        .key-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .key-btn.correct {
            background: var(--correct-color) !important;
            animation: pulse-green 0.5s;
        }

        .key-btn.wrong {
            background: var(--wrong-color) !important;
            animation: shake 0.5s;
        }

        @keyframes pulse-green {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .control-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .control-btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn {
            background: var(--correct-color);
            color: white;
            grid-column: span 2;
        }

        .clear-btn {
            background: #95a5a6;
            color: white;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--accent-color);
        }

        .modal-header h2 {
            color: var(--primary-color);
            font-size: 28px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 32px;
            cursor: pointer;
            color: #95a5a6;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--wrong-color);
        }

        /* 设置页面样式 */
        .settings-section {
            margin-bottom: 30px;
        }

        .settings-section h3 {
            color: var(--text-color);
            margin-bottom: 15px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-list {
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 10px;
        }

        .question-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .question-item:hover {
            background: #e3f2fd;
            transform: translateX(5px);
        }

        .question-item.selected {
            border-color: var(--correct-color);
            background: #e8f5e9;
        }

        .question-item input {
            width: 60px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .add-question-form {
            display: grid;
            grid-template-columns: 1fr 1fr 80px 60px;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
        }

        .add-question-form input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .add-btn {
            background: var(--correct-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s;
        }

        .add-btn:hover {
            transform: scale(1.1);
        }

        .delete-question {
            background: var(--wrong-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        /* 图库样式 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .gallery-item {
            aspect-ratio: 1;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            border: 4px solid transparent;
            transition: all 0.3s;
            position: relative;
            background: #f0f0f0;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .gallery-item.selected {
            border-color: var(--correct-color);
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.3);
        }

        .gallery-item.selected::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--correct-color);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .upload-area {
            border: 3px dashed #ccc;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--secondary-color);
            background: #e8f8f5;
        }

        .upload-area input {
            display: none;
        }

        /* 提示弹窗 */
        .feedback-modal .modal-content {
            text-align: center;
            padding: 60px;
            background: transparent;
            box-shadow: none;
            max-width: 500px;
        }

        .feedback-image {
            width: 300px;
            height: 300px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: bounce 0.6s;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
        }

        @keyframes bounce {
            0%, 100% { transform: scale(0); }
            50% { transform: scale(1.2); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .feedback-text {
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .feedback-text.correct {
            color: #2ECC71;
        }

        .feedback-text.wrong {
            color: #E74C3C;
        }

        .score-popup {
            position: fixed;
            font-size: 36px;
            font-weight: bold;
            color: #FFD700;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 999;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .game-container {
                grid-template-columns: 200px 1fr 250px;
            }
            .question-text {
                font-size: 56px;
            }
        }

        @media (max-width: 968px) {
            .game-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .sidebar, .keypad-area {
                position: relative;
                top: 0;
            }
            .question-text {
                font-size: 48px;
            }
            .keypad {
                max-width: 400px;
                margin: 0 auto;
            }
        }

        /* 庆祝动画 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall 3s linear forwards;
            z-index: 998;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #ecf0f1;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-size: 18px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <h2>🎮 数学闯关</h2>
            <button class="nav-btn" onclick="game.startGame()">🎯 开始游戏</button>
            <button class="nav-btn settings" onclick="game.openSettings()">⚙️ 题目设置</button>
            <button class="nav-btn settings" onclick="game.openBackgroundSettings()">🎨 背景设置</button>
            
            <div class="score-board">
                <h3>⭐ 当前得分</h3>
                <div class="score" id="score">0</div>
                <div class="level-info">
                    <div>关卡: <span id="level">1</span></div>
                    <div>连对: <span id="streak">0</span></div>
                </div>
            </div>
        </aside>

        <!-- 中间题目区域 -->
        <main class="main-area">
            <div class="question-card" id="questionCard">
                <div class="question-text" id="questionText">准备开始</div>
                <div class="answer-display" id="answerDisplay">点击开始游戏</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
        </main>

        <!-- 右侧数字键盘 -->
        <aside class="keypad-area">
            <h3>🔢 数字键盘</h3>
            <div class="keypad" id="keypad">
                <button class="key-btn number" onclick="game.inputNumber(1)">1</button>
                <button class="key-btn number" onclick="game.inputNumber(2)">2</button>
                <button class="key-btn number" onclick="game.inputNumber(3)">3</button>
                <button class="key-btn number" onclick="game.inputNumber(4)">4</button>
                <button class="key-btn number" onclick="game.inputNumber(5)">5</button>
                <button class="key-btn number" onclick="game.inputNumber(6)">6</button>
                <button class="key-btn number" onclick="game.inputNumber(7)">7</button>
                <button class="key-btn number" onclick="game.inputNumber(8)">8</button>
                <button class="key-btn number" onclick="game.inputNumber(9)">9</button>
                <button class="key-btn action" onclick="game.inputNumber(0)">0</button>
                <button class="key-btn action" onclick="game.clearAnswer()">C</button>
                <button class="key-btn action" onclick="game.deleteNumber()">⌫</button>
            </div>
            
            <div class="control-btns">
                <button class="control-btn clear-btn" onclick="game.clearAnswer()">清空</button>
                <button class="control-btn delete-btn" onclick="game.deleteNumber()">删除</button>
                <button class="control-btn submit-btn" onclick="game.submitAnswer()">✓ 确认答案</button>
            </div>
        </aside>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ 题目设置</h2>
                <button class="close-btn" onclick="game.closeModal('settingsModal')">&times;</button>
            </div>
            
            <div class="settings-section">
                <h3>📝 题库管理</h3>
                <div class="question-list" id="questionList">
                    <!-- 动态生成题目列表 -->
                </div>
                
                <div class="add-question-form">
                    <input type="number" id="num1" placeholder="数字1" min="1" max="100">
                    <input type="number" id="num2" placeholder="数字2" min="1" max="100">
                    <select id="operator" style="padding: 12px; border-radius: 10px; border: 2px solid #ddd; font-size: 18px;">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="×">×</option>
                        <option value="÷">÷</option>
                    </select>
                    <input type="number" id="answer" placeholder="答案">
                    <button class="add-btn" onclick="game.addQuestion()" title="添加题目">+</button>
                </div>
            </div>
            
            <div class="settings-section">
                <h3>🎯 已选题目 (<span id="selectedCount">0</span>题)</h3>
                <div id="selectedQuestions" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;">
                    <span style="color: #7f8c8d;">请在上方选择题目</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 背景设置弹窗 -->
    <div class="modal-overlay" id="backgroundModal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h2>🎨 背景设置</h2>
                <button class="close-btn" onclick="game.closeModal('backgroundModal')">&times;</button>
            </div>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="game.switchTab('bg')">游戏背景</button>
                <button class="tab-btn" onclick="game.switchTab('feedback')">提示图片</button>
            </div>
            
            <div id="bgTab" class="tab-content active">
                <div class="settings-section">
                    <h3>🖼️ 选择游戏背景</h3>
                    <div class="gallery-grid" id="bgGallery">
                        <!-- 动态生成背景图库 -->
                    </div>
                    <div class="upload-area" onclick="document.getElementById('bgUpload').click()">
                        <input type="file" id="bgUpload" accept="image/*" onchange="game.handleImageUpload(event, 'bg')">
                        <div style="font-size: 48px; margin-bottom: 10px;">📤</div>
                        <div>点击上传自定义背景图片</div>
                        <div style="font-size: 14px; color: #7f8c8d; margin-top: 5px;">支持 JPG、PNG 格式</div>
                    </div>
                </div>
            </div>
            
            <div id="feedbackTab" class="tab-content">
                <div class="settings-section">
                    <h3>✨ 正确提示图片</h3>
                    <div class="gallery-grid" id="correctGallery">
                        <!-- 动态生成正确提示图库 -->
                    </div>
                    <div class="upload-area" onclick="document.getElementById('correctUpload').click()">
                        <input type="file" id="correctUpload" accept="image/*" onchange="game.handleImageUpload(event, 'correct')">
                        <div style="font-size: 48px; margin-bottom: 10px;">🎉</div>
                        <div>上传正确提示图片</div>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h3>💔 错误提示图片</h3>
                    <div class="gallery-grid" id="wrongGallery">
                        <!-- 动态生成错误提示图库 -->
                    </div>
                    <div class="upload-area" onclick="document.getElementById('wrongUpload').click()">
                        <input type="file" id="wrongUpload" accept="image/*" onchange="game.handleImageUpload(event, 'wrong')">
                        <div style="font-size: 48px; margin-bottom: 10px;">📝</div>
                        <div>上传错误提示图片</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 反馈弹窗 -->
    <div class="modal-overlay feedback-modal" id="feedbackModal" onclick="game.closeFeedback()">
        <div class="modal-content" style="background: transparent; box-shadow: none;">
            <img src="" alt="反馈" class="feedback-image" id="feedbackImage">
            <div class="feedback-text" id="feedbackText"></div>
            <div style="color: white; margin-top: 20px; font-size: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">点击任意处继续</div>
        </div>
    </div>

    <script>
        class MathGame {
            constructor() {
                this.score = 0;
                this.level = 1;
                this.streak = 0;
                this.currentAnswer = '';
                this.currentQuestion = null;
                this.questions = [];
                this.selectedQuestions = [];
                this.currentQuestionIndex = 0;
                
                // 默认图库
                this.defaultImages = {
                    bg: [
                        'https://images.unsplash.com/photo-1503455637927-730bce8583c0?w=800&q=80',
                        'https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=800&q=80',
                        'https://images.unsplash.com/photo-1493711662062-fa541f7f3d24?w=800&q=80',
                        'https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=800&q=80'
                    ],
                    correct: [
                        'https://images.unsplash.com/photo-1530124566582-a618bc2615dc?w=400&q=80',
                        'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400&q=80',
                        'https://images.unsplash.com/photo-1468183654773-6e95f0c56e2e?w=400&q=80'
                    ],
                    wrong: [
                        'https://images.unsplash.com/photo-1516646085441-e1719bbc49cc?w=400&q=80',
                        'https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=400&q=80'
                    ]
                };
                
                this.images = {
                    bg: [],
                    correct: [],
                    wrong: []
                };
                
                this.selectedImages = {
                    bg: '',
                    correct: '',
                    wrong: ''
                };
                
                this.init();
            }
            
            init() {
                this.loadFromStorage();
                this.initDefaultQuestions();
                this.renderGalleries();
                this.updateDisplay();
                
                // 键盘事件监听
                document.addEventListener('keydown', (e) => {
                    if (e.key >= '0' && e.key <= '9') {
                        this.inputNumber(e.key);
                    } else if (e.key === 'Enter') {
                        this.submitAnswer();
                    } else if (e.key === 'Backspace') {
                        this.deleteNumber();
                    } else if (e.key === 'Escape') {
                        this.clearAnswer();
                    }
                });
            }
            
            initDefaultQuestions() {
                if (this.questions.length === 0) {
                    this.questions = [
                        { id: 1, num1: 3, num2: 5, operator: '+', answer: 8 },
                        { id: 2, num1: 10, num2: 4, operator: '-', answer: 6 },
                        { id: 3, num1: 6, num2: 7, operator: '×', answer: 42 },
                        { id: 4, num1: 20, num2: 4, operator: '÷', answer: 5 },
                        { id: 5, num1: 15, num2: 8, operator: '+', answer: 23 },
                        { id: 6, num1: 50, num2: 25, operator: '-', answer: 25 }
                    ];
                    this.saveToStorage();
                }
                if (this.selectedQuestions.length === 0) {
                    this.selectedQuestions = [...this.questions];
                }
            }
            
            loadFromStorage() {
                try {
                    const data = localStorage.getItem('mathGameData');
                    if (data) {
                        const parsed = JSON.parse(data);
                        this.questions = parsed.questions || [];
                        this.selectedQuestions = parsed.selectedQuestions || [];
                        this.images = parsed.images || { bg: [], correct: [], wrong: [] };
                        this.selectedImages = parsed.selectedImages || { bg: '', correct: '', wrong: '' };
                        
                        // 应用保存的背景
                        if (this.selectedImages.bg) {
                            document.body.style.backgroundImage = `url(${this.selectedImages.bg})`;
                        }
                    }
                } catch (e) {
                    console.error('加载数据失败:', e);
                }
            }
            
            saveToStorage() {
                try {
                    const data = {
                        questions: this.questions,
                        selectedQuestions: this.selectedQuestions,
                        images: this.images,
                        selectedImages: this.selectedImages
                    };
                    localStorage.setItem('mathGameData', JSON.stringify(data));
                } catch (e) {
                    console.error('保存数据失败:', e);
                    alert('保存失败，可能是存储空间不足');
                }
            }
            
            startGame() {
                if (this.selectedQuestions.length === 0) {
                    alert('请先选择题目！点击"题目设置"添加题目。');
                    this.openSettings();
                    return;
                }
                this.currentQuestionIndex = 0;
                this.score = 0;
                this.level = 1;
                this.streak = 0;
                this.shuffleQuestions();
                this.nextQuestion();
                this.updateDisplay();
            }
            
            shuffleQuestions() {
                this.selectedQuestions = [...this.selectedQuestions].sort(() => Math.random() - 0.5);
            }
            
            nextQuestion() {
                if (this.currentQuestionIndex >= this.selectedQuestions.length) {
                    this.currentQuestionIndex = 0;
                    this.level++;
                    this.shuffleQuestions();
                }
                this.currentQuestion = this.selectedQuestions[this.currentQuestionIndex];
                this.currentAnswer = '';
                this.updateQuestionDisplay();
                document.getElementById('answerDisplay').classList.remove('has-input');
            }
            
            updateQuestionDisplay() {
                const q = this.currentQuestion;
                document.getElementById('questionText').textContent = 
                    `${q.num1} ${q.operator} ${q.num2} = ?`;
                document.getElementById('answerDisplay').textContent = '请输入答案';
                document.getElementById('progressFill').style.width = 
                    `${(this.currentQuestionIndex / this.selectedQuestions.length) * 100}%`;
            }
            
            inputNumber(num) {
                if (this.currentAnswer.length < 3) {
                    this.currentAnswer += num;
                    this.updateAnswerDisplay();
                }
            }
            
            deleteNumber() {
                this.currentAnswer = this.currentAnswer.slice(0, -1);
                this.updateAnswerDisplay();
            }
            
            clearAnswer() {
                this.currentAnswer = '';
                this.updateAnswerDisplay();
            }
            
            updateAnswerDisplay() {
                const display = document.getElementById('answerDisplay');
                if (this.currentAnswer === '') {
                    display.textContent = '请输入答案';
                    display.classList.remove('has-input');
                } else {
                    display.textContent = this.currentAnswer;
                    display.classList.add('has-input');
                }
            }
            
            submitAnswer() {
                if (!this.currentQuestion || this.currentAnswer === '') return;
                
                const userAnswer = parseInt(this.currentAnswer);
                const isCorrect = userAnswer === this.currentQuestion.answer;
                
                if (isCorrect) {
                    this.handleCorrect();
                } else {
                    this.handleWrong();
                }
            }
            
            handleCorrect() {
                // 计算得分
                const points = 10 * this.level;
                this.score += points;
                this.streak++;
                
                // 显示得分动画
                this.showScorePopup(points);
                
                // 创建彩带效果
                this.createConfetti();
                
                // 显示正确反馈
                this.showFeedback(true);
                
                // 更新显示
                this.updateDisplay();
                
                // 下一题
                setTimeout(() => {
                    this.currentQuestionIndex++;
                    this.nextQuestion();
                }, 1500);
            }
            
            handleWrong() {
                this.streak = 0;
                this.showFeedback(false);
                this.updateDisplay();
                
                // 震动效果
                document.getElementById('questionCard').style.animation = 'shake 0.5s';
                setTimeout(() => {
                    document.getElementById('questionCard').style.animation = '';
                }, 500);
            }
            
            showFeedback(isCorrect) {
                const modal = document.getElementById('feedbackModal');
                const img = document.getElementById('feedbackImage');
                const text = document.getElementById('feedbackText');
                
                // 选择图片
                let imageUrl;
                if (isCorrect && this.selectedImages.correct) {
                    imageUrl = this.selectedImages.correct;
                } else if (!isCorrect && this.selectedImages.wrong) {
                    imageUrl = this.selectedImages.wrong;
                } else {
                    // 默认图片
                    imageUrl = isCorrect ? 
                        'https://api.dicebear.com/7.x/fun-emoji/svg?seed=happy&backgroundColor=b6e3f4' :
                        'https://api.dicebear.com/7.x/fun-emoji/svg?seed=sad&backgroundColor=ffdfbf';
                }
                
                img.src = imageUrl;
                text.textContent = isCorrect ? '太棒了！答对了！🎉' : '再想想哦！💪';
                text.className = 'feedback-text ' + (isCorrect ? 'correct' : 'wrong');
                
                modal.classList.add('active');
            }
            
            closeFeedback() {
                document.getElementById('feedbackModal').classList.remove('active');
            }
            
            showScorePopup(points) {
                const popup = document.createElement('div');
                popup.className = 'score-popup';
                popup.textContent = `+${points}`;
                popup.style.left = `${window.innerWidth / 2}px`;
                popup.style.top = `${window.innerHeight / 2}px`;
                document.body.appendChild(popup);
                
                setTimeout(() => popup.remove(), 1000);
            }
            
            createConfetti() {
                const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#fd79a8'];
                for (let i = 0; i < 30; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }
            }
            
            updateDisplay() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
                document.getElementById('streak').textContent = this.streak;
            }
            
            // 设置相关方法
            openSettings() {
                this.renderQuestionList();
                document.getElementById('settingsModal').classList.add('active');
            }
            
            openBackgroundSettings() {
                document.getElementById('backgroundModal').classList.add('active');
                this.renderGalleries();
            }
            
            closeModal(modalId) {
                document.getElementById(modalId).classList.remove('active');
            }
            
            renderQuestionList() {
                const list = document.getElementById('questionList');
                list.innerHTML = '';
                
                if (this.questions.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div>暂无题目，请添加</div>';
                    return;
                }
                
                this.questions.forEach(q => {
                    const item = document.createElement('div');
                    item.className = 'question-item';
                    if (this.selectedQuestions.find(sq => sq.id === q.id)) {
                        item.classList.add('selected');
                    }
                    
                    item.innerHTML = `
                        <span style="font-size: 18px; font-weight: bold;">
                            ${q.num1} ${q.operator} ${q.num2} = ${q.answer}
                        </span>
                        <div>
                            <button class="delete-question" onclick="event.stopPropagation(); game.deleteQuestion(${q.id})">删除</button>
                        </div>
                    `;
                    
                    item.onclick = () => this.toggleQuestionSelection(q);
                    list.appendChild(item);
                });
                
                this.updateSelectedCount();
            }
            
            toggleQuestionSelection(question) {
                const index = this.selectedQuestions.findIndex(q => q.id === question.id);
                if (index > -1) {
                    this.selectedQuestions.splice(index, 1);
                } else {
                    this.selectedQuestions.push(question);
                }
                this.renderQuestionList();
                this.saveToStorage();
            }
            
            addQuestion() {
                const num1 = parseInt(document.getElementById('num1').value);
                const num2 = parseInt(document.getElementById('num2').value);
                const operator = document.getElementById('operator').value;
                const answer = parseInt(document.getElementById('answer').value);
                
                if (isNaN(num1) || isNaN(num2) || isNaN(answer)) {
                    alert('请填写完整的题目信息');
                    return;
                }
                
                // 验证答案
                let correctAnswer;
                switch(operator) {
                    case '+': correctAnswer = num1 + num2; break;
                    case '-': correctAnswer = num1 - num2; break;
                    case '×': correctAnswer = num1 * num2; break;
                    case '÷': correctAnswer = num1 / num2; break;
                }
                
                if (answer !== correctAnswer) {
                    if (!confirm('答案似乎不正确，确定要添加吗？')) return;
                }
                
                const newQuestion = {
                    id: Date.now(),
                    num1, num2, operator, answer
                };
                
                this.questions.push(newQuestion);
                this.selectedQuestions.push(newQuestion);
                this.saveToStorage();
                
                // 清空输入
                document.getElementById('num1').value = '';
                document.getElementById('num2').value = '';
                document.getElementById('answer').value = '';
                
                this.renderQuestionList();
            }
            
            deleteQuestion(id) {
                if (confirm('确定要删除这道题吗？')) {
                    this.questions = this.questions.filter(q => q.id !== id);
                    this.selectedQuestions = this.selectedQuestions.filter(q => q.id !== id);
                    this.saveToStorage();
                    this.renderQuestionList();
                }
            }
            
            updateSelectedCount() {
                document.getElementById('selectedCount').textContent = this.selectedQuestions.length;
                const container = document.getElementById('selectedQuestions');
                
                if (this.selectedQuestions.length === 0) {
                    container.innerHTML = '<span style="color: #7f8c8d;">请在上方选择题目</span>';
                    return;
                }
                
                container.innerHTML = this.selectedQuestions.map(q => `
                    <span style="background: #e8f5e9; padding: 5px 12px; border-radius: 20px; font-size: 14px; border: 2px solid #4caf50;">
                        ${q.num1}${q.operator}${q.num2}
                    </span>
                `).join('');
            }
            
            // 背景和图库管理
            switchTab(tab) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                
                if (tab === 'bg') {
                    document.querySelectorAll('.tab-btn')[0].classList.add('active');
                    document.getElementById('bgTab').classList.add('active');
                } else {
                    document.querySelectorAll('.tab-btn')[1].classList.add('active');
                    document.getElementById('feedbackTab').classList.add('active');
                }
            }
            
            renderGalleries() {
                this.renderGallery('bgGallery', 'bg', this.images.bg);
                this.renderGallery('correctGallery', 'correct', this.images.correct);
                this.renderGallery('wrongGallery', 'wrong', this.images.wrong);
            }
            
            renderGallery(containerId, type, images) {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                
                // 合并默认图片和自定义图片
                const allImages = [...this.defaultImages[type], ...images];
                
                allImages.forEach((url, index) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    if (this.selectedImages[type] === url) {
                        item.classList.add('selected');
                    }
                    
                    const img = document.createElement('img');
                    img.src = url;
                    img.onerror = () => {
                        // 图片加载失败时使用占位图
                        img.src = `https://via.placeholder.com/150?text=${type}`;
                    };
                    
                    item.appendChild(img);
                    item.onclick = () => this.selectImage(type, url);
                    container.appendChild(item);
                });
            }
            
            selectImage(type, url) {
                this.selectedImages[type] = url;
                this.saveToStorage();
                
                if (type === 'bg') {
                    document.body.style.backgroundImage = `url(${url})`;
                }
                
                this.renderGalleries();
            }
            
            handleImageUpload(event, type) {
                const file = event.target.files[0];
                if (!file) return;
                
                if (!file.type.startsWith('image/')) {
                    alert('请上传图片文件');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    if (!this.images[type].includes(dataUrl)) {
                        this.images[type].push(dataUrl);
                        this.selectImage(type, dataUrl);
                        this.saveToStorage();
                    }
                };
                reader.readAsDataURL(file);
            }
        }
        
        // 初始化游戏
        const game = new MathGame();
    </script>
</body>
</html>
