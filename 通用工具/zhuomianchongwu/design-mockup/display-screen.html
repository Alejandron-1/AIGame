<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂展示屏原型 · 萌宠课堂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; }

  :root {
    --sky-top:    #b8e4f9;
    --sky-mid:    #d8eeff;
    --sky-bot:    #e8f7e8;
    --green-hi:   #8dd35f;
    --green-lo:   #5ab245;
    --sun-y:      #ffd54f;
    --sun-glow:   rgba(255,213,79,0.35);
    --cloud-w:    rgba(255,255,255,0.95);
    --coral:      #ff7b7b;
    --coral-d:    #e63946;
    --mint:       #52c97a;
    --lavender:   #a78bfa;
    --gold:       #f4a923;
    --white-panel:rgba(255,255,255,0.82);
    --ink:        #2d3748;
    --ink-2:      #718096;
    --pill:       999px;
    --r:          20px;
    --r-lg:       28px;
    --font-fun:   'ZCOOL KuaiLe', cursive;
  }

  body {
    background: linear-gradient(180deg,
      var(--sky-top) 0%,
      var(--sky-mid) 45%,
      var(--sky-bot) 70%,
      #c8f0b0 100%);
    position: relative;
  }

  /* ── 星星粒子 ── */
  .sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .sp { position: absolute; border-radius: 50%; animation: sp-fly linear infinite; }
  @keyframes sp-fly {
    from { transform: translateY(110vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.7; }
    to   { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  /* ── 云朵 ── */
  .cloud { position: absolute; background: var(--cloud-w); border-radius: var(--pill); pointer-events: none; }
  .cloud::before, .cloud::after {
    content: ''; position: absolute; background: var(--cloud-w); border-radius: 50%;
  }
  .c1 { width: 200px; height: 60px; top: 8%; left: 4%;
        animation: cloud-drift 22s ease-in-out infinite; }
  .c1::before { width: 80px; height: 80px; bottom: 20px; left: 20px; }
  .c1::after  { width: 60px; height: 60px; bottom: 20px; left: 80px; }
  .c2 { width: 160px; height: 50px; top: 12%; right: 6%;
        animation: cloud-drift 18s ease-in-out infinite reverse; }
  .c2::before { width: 70px; height: 70px; bottom: 16px; left: 15px; }
  .c2::after  { width: 55px; height: 55px; bottom: 16px; left: 65px; }
  .c3 { width: 220px; height: 65px; top: 4%; left: 38%;
        animation: cloud-drift 26s ease-in-out infinite 2s; }
  .c3::before { width: 90px; height: 90px; bottom: 22px; left: 22px; }
  .c3::after  { width: 65px; height: 65px; bottom: 22px; left: 90px; }
  @keyframes cloud-drift {
    0%,100% { transform: translateX(0); }
    50%      { transform: translateX(50px); }
  }

  /* ── 太阳 ── */
  .sun {
    position: absolute; top: 28px; right: 80px; z-index: 2;
    width: 88px; height: 88px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff9c4, var(--sun-y) 60%, #f4a923);
    box-shadow: 0 0 0 20px var(--sun-glow), 0 0 0 40px rgba(255,213,79,0.15);
    animation: sun-pulse 5s ease-in-out infinite;
  }
  .sun-ray { position: absolute; inset: -24px; border-radius: 50%; border: 2px dashed rgba(255,213,79,0.4);
             animation: ray-spin 20s linear infinite; }
  @keyframes sun-pulse {
    0%,100% { box-shadow: 0 0 0 20px var(--sun-glow), 0 0 0 40px rgba(255,213,79,0.15); }
    50%      { box-shadow: 0 0 0 28px var(--sun-glow), 0 0 0 56px rgba(255,213,79,0.2); }
  }
  @keyframes ray-spin { to { transform: rotate(360deg); } }

  /* ── 草地 ── */
  .ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 130px;
    background: linear-gradient(180deg, var(--green-hi) 0%, var(--green-lo) 100%);
    border-radius: 50% 50% 0 0 / 50px 50px 0 0;
    z-index: 2;
  }
  .ground::before {
    content: ''; position: absolute; top: -12px; left: 0; right: 0; height: 24px;
    background: repeating-radial-gradient(circle at 5% 100%, #52a844 0 6px, transparent 7px) 0/120px 24px,
                repeating-radial-gradient(circle at 55% 100%, #52a844 0 5px, transparent 6px) 60px/120px 24px;
  }
  /* 草地小花 */
  .flower { position: absolute; font-size: 18px; animation: flower-sway 3s ease-in-out infinite; }
  @keyframes flower-sway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

  /* ── 顶栏 ── */
  .topbar {
    position: relative; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 32px;
    background: var(--white-panel);
    backdrop-filter: blur(16px);
    border-bottom: 2px solid rgba(255,123,123,0.18);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .logo-badge {
    background: var(--coral); color: #fff;
    font-family: var(--font-fun); font-size: 15px;
    padding: 4px 14px; border-radius: var(--pill);
  }
  .class-tag {
    font-family: var(--font-fun); font-size: 20px; color: var(--ink);
  }
  .topbar-center { flex: 1; text-align: center; }
  .student-name-big {
    font-family: var(--font-fun); font-size: 30px; color: var(--coral-d);
    text-shadow: 2px 2px 0 rgba(230,57,70,0.12);
  }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .sync-dot { display: flex; align-items: center; gap: 6px; font-size: 13px;
              color: var(--mint); font-weight: 600; }
  .sync-dot::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--mint);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* ── 主舞台 ── */
  .stage { position: relative; z-index: 10; flex: 1; display: flex;
           align-items: center; justify-content: center; padding-bottom: 30px; }

  /* ── 宠物区 ── */
  .pet-zone {
    display: flex; flex-direction: column; align-items: center; gap: 0;
    animation: float-up-down 3s ease-in-out infinite;
    filter: drop-shadow(0 24px 48px rgba(45,55,72,0.22));
  }
  @keyframes float-up-down {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-20px); }
  }
  .pet-frame {
    width: 360px; height: 360px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  /* 宠物光圈 */
  .pet-halo {
    position: absolute; inset: -10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,213,79,0.25) 0%, transparent 70%);
    animation: halo-pulse 3s ease-in-out infinite;
  }
  @keyframes halo-pulse {
    0%,100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.1); opacity: 1; }
  }
  .pet-emoji { font-size: 220px; line-height: 1; position: relative; z-index: 1;
               filter: drop-shadow(0 12px 24px rgba(45,55,72,0.2)); }

  /* 等级牌 */
  .pet-nameplate {
    background: #fff; border-radius: var(--pill);
    padding: 10px 28px; margin-top: 8px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 8px 28px rgba(45,55,72,0.12);
  }
  .lv-badge {
    background: var(--gold); color: #fff;
    font-family: var(--font-fun); font-size: 17px;
    padding: 4px 14px; border-radius: var(--pill);
  }
  .pet-lv-name { font-family: var(--font-fun); font-size: 20px; color: var(--ink); }

  /* ── 分数面板 ── */
  .score-panel {
    position: absolute; bottom: 148px; left: 50%; transform: translateX(-50%);
    z-index: 15;
    background: var(--white-panel); backdrop-filter: blur(12px);
    border-radius: var(--r-lg); padding: 14px 36px;
    box-shadow: 0 8px 32px rgba(45,55,72,0.1);
    border: 2px solid rgba(255,123,123,0.15);
    display: flex; align-items: center; gap: 28px;
    white-space: nowrap;
  }
  .score-number {
    font-family: var(--font-fun); font-size: 56px; color: var(--coral-d);
    line-height: 1; animation: score-bounce 0.4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes score-bounce {
    from { transform: scale(0.6); } to { transform: scale(1); }
  }
  .score-unit { font-size: 18px; color: var(--ink-2); font-weight: 700; align-self: flex-end; margin-bottom: 6px; }
  .prog-wrap { display: flex; flex-direction: column; gap: 5px; min-width: 220px; }
  .prog-bar-bg {
    height: 20px; border-radius: var(--pill);
    background: rgba(200,200,200,0.3);
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
  }
  .prog-bar-fill {
    height: 100%; border-radius: var(--pill);
    background: linear-gradient(90deg, #52c97a 0%, #38a169 100%);
    width: 64%;
    position: relative; overflow: hidden;
  }
  .prog-bar-fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.5) 50%, transparent 100%);
    animation: shimmer 2.2s ease-in-out infinite;
  }
  @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
  .prog-label { font-size: 13px; color: var(--ink-2); font-weight: 600; text-align: center; }

  /* ── 浮动加分 ── */
  .float-score {
    position: absolute; font-family: var(--font-fun); font-size: 42px;
    color: var(--coral-d); pointer-events: none; z-index: 50;
    text-shadow: 0 2px 8px rgba(230,57,70,0.3);
    animation: score-float 1.6s ease-out forwards;
  }
  @keyframes score-float {
    0%   { transform: translateY(0) scale(0.5); opacity: 1; }
    40%  { transform: translateY(-50px) scale(1.3); opacity: 1; }
    100% { transform: translateY(-140px) scale(0.9); opacity: 0; }
  }

  /* ── 底部全班预览 ── */
  .bottom-strip {
    position: relative; z-index: 20;
    background: var(--white-panel); backdrop-filter: blur(10px);
    border-top: 1.5px solid rgba(255,123,123,0.12);
    padding: 10px 20px;
    display: flex; gap: 12px; justify-content: center; overflow-x: auto;
    flex-shrink: 0;
  }
  .bottom-strip::-webkit-scrollbar { height: 0; }
  .mini-pet {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; flex-shrink: 0;
    transition: transform 0.2s; padding: 4px 8px; border-radius: var(--r);
  }
  .mini-pet:hover { transform: translateY(-5px); }
  .mini-pet.active { background: rgba(255,123,123,0.1); }
  .mini-avatar {
    width: 52px; height: 52px; border-radius: 14px;
    background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 2.5px solid transparent;
  }
  .mini-pet.active .mini-avatar { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,123,123,0.3); }
  .mini-name { font-size: 11px; color: var(--ink-2); font-weight: 600; }
  .mini-lv { font-size: 10px; color: var(--gold); font-weight: 700;
             background: rgba(244,169,35,0.15); padding: 1px 8px; border-radius: var(--pill); }

  /* ── 升级特效弹窗 ── */
  .levelup-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20,20,40,0.75);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
  }
  .levelup-card {
    background: #fff; border-radius: 32px;
    padding: 40px 56px; text-align: center;
    position: relative; overflow: visible;
    box-shadow: 0 32px 80px rgba(0,0,0,0.3);
    animation: card-pop 0.6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes card-pop {
    from { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    to   { transform: scale(1) rotate(0); opacity: 1; }
  }
  .lv-banner {
    display: inline-block; font-family: var(--font-fun);
    font-size: 22px; letter-spacing: 8px;
    background: linear-gradient(135deg, var(--gold), var(--coral));
    color: #fff; padding: 10px 36px; border-radius: var(--pill);
    margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(244,169,35,0.4);
    animation: wiggle 1s ease-in-out infinite;
  }
  @keyframes wiggle { 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
  .lv-pet-big { font-size: 160px; line-height: 1; margin: 8px 0;
                filter: drop-shadow(0 8px 20px rgba(244,169,35,0.4));
                animation: pet-spin 0.8s 0.3s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes pet-spin {
    from { transform: scale(0) rotate(-180deg); } to { transform: scale(1) rotate(0); }
  }
  .lv-num { font-family: var(--font-fun); font-size: 80px; color: var(--gold);
            text-shadow: 0 4px 16px rgba(244,169,35,0.5);
            animation: num-pop 0.5s 0.5s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes num-pop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .lv-name-text { font-family: var(--font-fun); font-size: 32px; color: var(--ink); margin-top: 4px; }
  /* 粒子 */
  .confetti-dot { position: absolute; width: 10px; height: 10px; border-radius: 50%;
                  animation: confetti-fly 1.2s ease-out forwards; }
  @keyframes confetti-fly {
    from { transform: translate(0,0) scale(1.2); opacity: 1; }
    to   { opacity: 0; }
  }

  /* ── 布局 ── */
  #root { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
  .stage-area { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root">
  <!-- 背景层 -->
  <div class="sparkles" id="sparkles"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="sun"><div class="sun-ray"></div></div>
  <div class="ground">
    <div class="flower" style="left:8%;bottom:30px;animation-delay:0s">🌸</div>
    <div class="flower" style="left:22%;bottom:20px;animation-delay:0.4s">🌼</div>
    <div class="flower" style="left:70%;bottom:28px;animation-delay:0.8s">🌺</div>
    <div class="flower" style="left:88%;bottom:18px;animation-delay:1.2s">🌸</div>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-badge">萌宠课堂</span>
      <span class="class-tag">三年（2）班</span>
    </div>
    <div class="topbar-center">
      <span class="student-name-big" id="stu-name">小明</span>
    </div>
    <div class="topbar-right">
      <span class="sync-dot">实时同步</span>
    </div>
  </header>

  <!-- 主舞台 -->
  <div class="stage-area" id="stage">
    <div class="pet-zone" id="pet-zone">
      <div class="pet-frame">
        <div class="pet-halo"></div>
        <div class="pet-emoji" id="pet-emoji">🐉</div>
      </div>
      <div class="pet-nameplate">
        <span class="lv-badge" id="lv-badge">LV.7</span>
        <span class="pet-lv-name" id="pet-lv-name">觉醒火神</span>
      </div>
    </div>

    <!-- 分数面板 -->
    <div class="score-panel">
      <span class="score-number" id="score-num">128</span>
      <span class="score-unit">分</span>
      <div class="prog-wrap">
        <div class="prog-bar-bg">
          <div class="prog-bar-fill" id="prog-fill" style="width:56%"></div>
        </div>
        <span class="prog-label" id="prog-label">距下一级：13 / 45</span>
      </div>
    </div>

    <!-- 浮动加分示例 -->
    <div class="float-score" style="left:42%;top:38%;animation-delay:0.2s">+5</div>
    <div class="float-score" style="left:55%;top:45%;animation-delay:0.8s">+3</div>
  </div>

  <!-- 底部全班 -->
  <footer class="bottom-strip" id="bottom-strip">
    <!-- JS 渲染 -->
  </footer>
</div>

<!-- 升级弹窗（示例展示） -->
<div class="levelup-overlay" id="levelup-overlay" style="display:none">
  <div class="levelup-card" id="levelup-card">
    <div id="confetti-container"></div>
    <div class="lv-banner">LEVEL  UP !</div>
    <div class="lv-pet-big">🔥</div>
    <div class="lv-num" id="lv-num">LV.8</div>
    <div class="lv-name-text" id="lv-name-text">小明 → 进阶火神！</div>
  </div>
</div>

<script>
(function(){
  /* ── 星星粒子 ── */
  const sl = document.getElementById('sparkles');
  const colors = ['#ff8fab','#ffd166','#7fd8ae','#8ecae6','#c8b6ff','#ffb347'];
  for(let i=0;i<22;i++){
    const s = document.createElement('div');
    s.className = 'sp';
    const sz = 5 + Math.random()*9;
    s.style.cssText = `left:${Math.random()*100}%;width:${sz}px;height:${sz}px;
      background:${colors[i%colors.length]};
      animation-delay:${Math.random()*8}s;
      animation-duration:${5+Math.random()*6}s;
      opacity:0;`;
    sl.appendChild(s);
  }

  /* ── 学生数据 ── */
  const students = [
    {id:1,name:'小明',score:128,emoji:'🐉',lv:7,lvName:'觉醒火神'},
    {id:2,name:'小红',score:56,emoji:'🦊',lv:4,lvName:'炽热焰火'},
    {id:3,name:'李华',score:22,emoji:'🐱',lv:3,lvName:'进化焰火'},
    {id:4,name:'赵磊',score:87,emoji:'🦁',lv:5,lvName:'觉醒火神'},
    {id:5,name:'王芳',score:160,emoji:'🦋',lv:8,lvName:'进阶火神'},
    {id:6,name:'陈静',score:35,emoji:'🐢',lv:4,lvName:'炽热焰火'},
    {id:7,name:'刘阳',score:220,emoji:'🐲',lv:10,lvName:'烈火战神'},
    {id:8,name:'周雨',score:12,emoji:'🐣',lv:2,lvName:'探索火花'},
  ];

  let currentId = 1;

  /* ── 渲染底部 ── */
  function renderBottom(){
    const strip = document.getElementById('bottom-strip');
    strip.innerHTML = '';
    students.forEach(s=>{
      const d = document.createElement('div');
      d.className = 'mini-pet' + (s.id===currentId?' active':'');
      d.innerHTML = `<div class="mini-avatar">${s.emoji}</div>
        <div class="mini-name">${s.name}</div>
        <div class="mini-lv">LV.${s.lv}</div>`;
      d.onclick = ()=>{ currentId=s.id; renderStudent(s); renderBottom(); };
      strip.appendChild(d);
    });
  }

  /* ── 渲染当前学生 ── */
  const thresholds = [0,5,12,22,35,55,80,115,160,220,300];
  function renderStudent(s){
    document.getElementById('stu-name').textContent = s.name;
    document.getElementById('pet-emoji').textContent = s.emoji;
    document.getElementById('lv-badge').textContent = 'LV.'+s.lv;
    document.getElementById('pet-lv-name').textContent = s.lvName;
    document.getElementById('score-num').textContent = s.score;
    const cur = thresholds[s.lv]||0;
    const nxt = s.lv>=10?null:thresholds[s.lv+1];
    const pct = nxt?Math.round((s.score-cur)/(nxt-cur)*100):100;
    document.getElementById('prog-fill').style.width = pct+'%';
    document.getElementById('prog-label').textContent = nxt
      ?`距下一级：${s.score-cur} / ${nxt-cur}`
      :'已满级！ ♛';
  }

  /* ── 演示：点击分数区触发升级弹窗 ── */
  document.querySelector('.score-panel').style.cursor = 'pointer';
  document.querySelector('.score-panel').title = '点击演示升级特效';
  document.querySelector('.score-panel').onclick = showLevelup;

  function showLevelup(){
    const overlay = document.getElementById('levelup-overlay');
    overlay.style.display = 'flex';
    /* 粒子 */
    const cc = document.getElementById('confetti-container');
    cc.innerHTML='';
    const cs=['#ff8fab','#ffd166','#52c97a','#8ecae6','#a78bfa','#ff6b6b'];
    for(let i=0;i<40;i++){
      const p=document.createElement('div'); p.className='confetti-dot';
      const ang=Math.PI*2*i/40, dist=100+Math.random()*200;
      const x=Math.cos(ang)*dist, y=Math.sin(ang)*dist;
      p.style.cssText=`background:${cs[i%cs.length]};
        left:50%;top:50%;
        transform:translate(-50%,-50%);`;
      p.animate([
        {transform:`translate(-50%,-50%) scale(1.3)`,opacity:1},
        {transform:`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(0)`,opacity:0}
      ],{duration:900+Math.random()*600,easing:'ease-out',fill:'forwards'});
      cc.appendChild(p);
    }
    setTimeout(()=>overlay.style.display='none',3500);
  }

  /* ── 初始化 ── */
  renderStudent(students[0]);
  renderBottom();

  /* ── 自动轮换演示 ── */
  let demoIdx = 0;
  setInterval(()=>{
    demoIdx = (demoIdx+1)%students.length;
    currentId = students[demoIdx].id;
    renderStudent(students[demoIdx]);
    renderBottom();
  }, 4000);
})();
</script>
