<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萌宠课堂 · 管理后台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;font-family:'Noto Sans SC',sans-serif;overflow:hidden;}

  :root{
    --sidebar-bg:#1e1b4b;--sidebar-w:220px;
    --coral:#ff7b7b;--coral-d:#e63946;
    --gold:#f4a923;--mint:#52c97a;--sky:#5bc0de;
    --lavender:#a78bfa;--pink:#f472b6;
    --ink:#2d3748;--ink2:#718096;--ink3:#a0aec0;
    --bg:#f4f6fb;--card:#fff;
    --r:12px;--r-lg:18px;--pill:999px;
    --font-fun:'ZCOOL KuaiLe',cursive;
    --shadow:0 4px 20px rgba(45,55,72,0.07);
    --shadow-card:0 8px 28px rgba(45,55,72,0.1);
  }

  body{display:flex;background:var(--bg);}

  /* ══ 侧边栏 ══ */
  .sidebar{
    width:var(--sidebar-w);height:100vh;flex-shrink:0;
    background:var(--sidebar-bg);
    display:flex;flex-direction:column;
    padding:0 0 24px;
    position:relative;overflow:hidden;
    box-shadow:4px 0 24px rgba(30,27,75,0.3);
  }
  /* 侧边栏装饰光 */
  .sidebar::before{
    content:'';position:absolute;top:-40px;right:-40px;
    width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(167,139,250,0.2) 0%,transparent 70%);
    pointer-events:none;
  }
  .sidebar::after{
    content:'';position:absolute;bottom:-60px;left:-30px;
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,123,123,0.12) 0%,transparent 70%);
    pointer-events:none;
  }

  .sidebar-logo{
    padding:28px 20px 20px;
    display:flex;align-items:center;gap:12px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    margin-bottom:8px;
  }
  .logo-icon{font-size:28px;line-height:1;}
  .logo-text{font-family:var(--font-fun);font-size:20px;color:#fff;letter-spacing:1px;}
  .logo-ver{font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px;}

  .nav-section-label{
    padding:16px 20px 8px;
    font-size:11px;color:rgba(255,255,255,0.35);
    letter-spacing:2px;text-transform:uppercase;
  }
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 20px;margin:2px 10px;
    border-radius:var(--r);cursor:pointer;
    color:rgba(255,255,255,0.6);font-size:14px;font-weight:500;
    transition:all 0.2s;position:relative;
  }
  .nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
  .nav-item.active{background:linear-gradient(135deg,rgba(255,123,123,0.25),rgba(167,139,250,0.2));
                   color:#fff;}
  .nav-item.active::before{
    content:'';position:absolute;left:0;top:20%;bottom:20%;
    width:3px;border-radius:var(--pill);background:var(--coral);
  }
  .nav-icon{font-size:18px;width:22px;text-align:center;}
  .nav-badge{
    margin-left:auto;background:var(--coral);color:#fff;
    font-size:10px;padding:1px 7px;border-radius:var(--pill);font-weight:700;
  }

  .sidebar-footer{
    margin-top:auto;padding:16px 20px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .user-row{display:flex;align-items:center;gap:10px;}
  .user-avatar{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg,var(--coral),var(--lavender));
    display:flex;align-items:center;justify-content:center;
    font-size:16px;flex-shrink:0;
  }
  .user-info{flex:1;min-width:0;}
  .user-name{font-size:13px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-role{font-size:11px;color:rgba(255,255,255,0.4);}
  .btn-logout{
    background:rgba(255,255,255,0.08);border:none;color:rgba(255,255,255,0.5);
    padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;
    transition:all 0.2s;
  }
  .btn-logout:hover{background:rgba(255,123,123,0.2);color:var(--coral);}

  /* ══ 主内容区 ══ */
  .main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column;min-width:0;}

  /* 顶部导航栏 */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:rgba(244,246,251,0.92);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(45,55,72,0.06);
    padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  .topbar-title{font-family:var(--font-fun);font-size:22px;color:var(--ink);}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .btn-display{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,var(--coral),var(--lavender));
    color:#fff;border:none;border-radius:var(--r);
    padding:9px 20px;font-family:var(--font-fun);font-size:15px;
    cursor:pointer;box-shadow:0 4px 16px rgba(230,57,70,0.25);
    transition:all 0.2s;
  }
  .btn-display:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(230,57,70,0.35);}
  .topbar-notif{
    position:relative;width:36px;height:36px;border-radius:var(--r);
    background:var(--card);border:1px solid rgba(45,55,72,0.08);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:18px;transition:all 0.2s;
  }
  .topbar-notif:hover{background:rgba(255,123,123,0.06);}
  .notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;
             border-radius:50%;background:var(--coral);border:2px solid var(--bg);}

  /* ══ 内容区 ══ */
  .content{padding:24px 28px;flex:1;}

  /* 统计卡片 */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .stat-card{
    background:var(--card);border-radius:var(--r-lg);padding:20px 22px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;
    border:1px solid rgba(45,55,72,0.05);
    transition:all 0.25s;cursor:default;position:relative;overflow:hidden;
  }
  .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-card);}
  .stat-card::before{
    content:'';position:absolute;top:-20px;right:-20px;
    width:80px;height:80px;border-radius:50%;opacity:0.08;
  }
  .stat-card.c1::before{background:var(--coral);}
  .stat-card.c2::before{background:var(--gold);}
  .stat-card.c3::before{background:var(--mint);}
  .stat-card.c4::before{background:var(--lavender);}
  .stat-icon{font-size:24px;margin-bottom:4px;}
  .stat-num{font-size:32px;font-weight:700;color:var(--ink);line-height:1;}
  .stat-label{font-size:12px;color:var(--ink2);font-weight:500;}
  .stat-change{
    display:inline-flex;align-items:center;gap:3px;
    font-size:11px;font-weight:700;margin-top:4px;
    padding:2px 8px;border-radius:var(--pill);
  }
  .up  {background:rgba(82,201,122,0.12);color:var(--mint);}
  .down{background:rgba(230,57,70,0.08);color:var(--coral-d);}

  /* ══ 两栏布局 ══ */
  .two-col{display:grid;grid-template-columns:1fr 360px;gap:20px;margin-bottom:20px;}

  /* ── 学生列表 ── */
  .card-box{background:var(--card);border-radius:var(--r-lg);padding:20px;
            box-shadow:var(--shadow);border:1px solid rgba(45,55,72,0.05);}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .card-title{font-family:var(--font-fun);font-size:18px;color:var(--ink);}
  .card-action{font-size:13px;color:var(--coral-d);cursor:pointer;font-weight:500;
               background:rgba(230,57,70,0.07);padding:5px 14px;border-radius:var(--pill);
               border:none;transition:all 0.2s;}
  .card-action:hover{background:rgba(230,57,70,0.14);}

  /* 搜索栏 */
  .search-bar{
    display:flex;align-items:center;gap:10px;
    background:#f8f9fc;border:1.5px solid rgba(45,55,72,0.08);
    border-radius:var(--r);padding:8px 14px;margin-bottom:14px;
    transition:all 0.2s;
  }
  .search-bar:focus-within{border-color:var(--coral);background:#fff;}
  .search-icon{font-size:14px;color:var(--ink3);}
  .search-input{border:none;background:transparent;outline:none;font-size:14px;
                color:var(--ink);width:100%;font-family:inherit;}
  .search-input::placeholder{color:var(--ink3);}

  /* 学生表格 */
  .stu-table{width:100%;border-collapse:collapse;}
  .stu-table th{font-size:12px;color:var(--ink3);font-weight:500;
                padding:8px 10px;border-bottom:1px solid rgba(45,55,72,0.06);
                text-align:left;letter-spacing:0.5px;}
  .stu-table td{padding:10px 10px;border-bottom:1px solid rgba(45,55,72,0.04);
                font-size:14px;color:var(--ink);vertical-align:middle;}
  .stu-table tr:last-child td{border-bottom:none;}
  .stu-table tr:hover td{background:rgba(255,123,123,0.03);}
  .stu-check{width:16px;height:16px;accent-color:var(--coral);cursor:pointer;}
  .stu-avatar{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,#fce4ec,#e8eaf6);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .stu-name-cell{display:flex;align-items:center;gap:10px;}
  .stu-name-text{font-weight:500;}
  .stu-class-tag{font-size:11px;color:var(--ink3);
                 background:rgba(45,55,72,0.05);padding:1px 8px;border-radius:var(--pill);}
  .lv-pill{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 10px;border-radius:var(--pill);font-size:12px;font-weight:700;
  }
  .lv-hi{background:rgba(244,169,35,0.15);color:var(--gold);}
  .lv-mid{background:rgba(82,201,122,0.12);color:var(--mint);}
  .lv-lo{background:rgba(91,192,222,0.15);color:var(--sky);}

  /* 进度条（迷你） */
  .mini-prog{height:6px;border-radius:var(--pill);background:rgba(45,55,72,0.07);overflow:hidden;}
  .mini-prog-fill{height:100%;border-radius:var(--pill);}
  .fill-gold{background:linear-gradient(90deg,var(--gold),#f4a923aa);}
  .fill-mint{background:linear-gradient(90deg,var(--mint),#52c97aaa);}
  .fill-sky {background:linear-gradient(90deg,var(--sky),#5bc0deaa);}

  .action-btns{display:flex;gap:6px;}
  .btn-sm{
    padding:4px 12px;border-radius:8px;border:none;font-size:12px;
    cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.2s;
  }
  .btn-score{background:rgba(82,201,122,0.12);color:var(--mint);}
  .btn-score:hover{background:rgba(82,201,122,0.25);}
  .btn-view{background:rgba(91,192,222,0.12);color:var(--sky);}
  .btn-view:hover{background:rgba(91,192,222,0.25);}

  /* ── 右侧面板 ── */
  .right-panels{display:flex;flex-direction:column;gap:16px;}

  /* 快速加分 */
  .quick-score-card{
    background:linear-gradient(135deg,#fff5f5 0%,#ffedf6 100%);
    border:1.5px solid rgba(255,123,123,0.2);
    border-radius:var(--r-lg);padding:20px;
  }
  .qs-title{font-family:var(--font-fun);font-size:16px;color:var(--coral-d);margin-bottom:14px;}
  .qs-select{
    width:100%;padding:10px 12px;border:1.5px solid rgba(255,123,123,0.2);
    border-radius:var(--r);background:#fff;font-size:13px;font-family:inherit;
    color:var(--ink);outline:none;margin-bottom:10px;cursor:pointer;
  }
  .qs-select:focus{border-color:var(--coral);}
  .score-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .score-btn{
    padding:12px 0;border:none;border-radius:var(--r);
    font-family:var(--font-fun);font-size:20px;cursor:pointer;
    transition:all 0.2s;position:relative;overflow:hidden;
  }
  .score-btn::after{
    content:'';position:absolute;inset:0;background:rgba(255,255,255,0.3);
    transform:scale(0);border-radius:50%;transition:transform 0.3s;
  }
  .score-btn:active::after{transform:scale(3);}
  .sb1{background:linear-gradient(135deg,#fce4ec,#f8bbd9);color:var(--coral-d);}
  .sb3{background:linear-gradient(135deg,#fff9c4,#ffee58cc);color:#b7891a;}
  .sb5{background:linear-gradient(135deg,#e8f5e9,#a5d6a7cc);color:#2e7d32;}
  .score-btn:hover{transform:translateY(-2px);filter:brightness(1.05);}
  .qs-reason{
    width:100%;padding:9px 12px;border:1.5px solid rgba(255,123,123,0.2);
    border-radius:var(--r);font-size:13px;font-family:inherit;color:var(--ink);
    background:#fff;outline:none;resize:none;
  }
  .qs-reason:focus{border-color:var(--coral);}
  /* 行为标签 */
  .behavior-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .b-tag{
    padding:4px 12px;border-radius:var(--pill);font-size:12px;font-weight:500;
    cursor:pointer;border:1px solid transparent;transition:all 0.2s;
    background:rgba(45,55,72,0.05);color:var(--ink2);
  }
  .b-tag:hover,.b-tag.sel{background:rgba(255,123,123,0.12);color:var(--coral-d);border-color:rgba(255,123,123,0.3);}

  /* 排行榜 */
  .rank-list{display:flex;flex-direction:column;gap:8px;}
  .rank-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:var(--r);
    background:rgba(45,55,72,0.02);border:1px solid rgba(45,55,72,0.04);
    transition:all 0.2s;cursor:pointer;
  }
  .rank-item:hover{background:rgba(255,123,123,0.04);}
  .rank-no{
    width:24px;height:24px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;
  }
  .r1{background:rgba(244,169,35,0.2);color:var(--gold);}
  .r2{background:rgba(45,55,72,0.1);color:var(--ink2);}
  .r3{background:rgba(244,169,35,0.1);color:#b7891a;}
  .rN{background:rgba(45,55,72,0.05);color:var(--ink3);}
  .rank-pet{font-size:20px;}
  .rank-info{flex:1;min-width:0;}
  .rank-name{font-size:13px;font-weight:500;color:var(--ink);}
  .rank-score{font-size:11px;color:var(--ink3);}
  .rank-lv{font-family:var(--font-fun);font-size:14px;color:var(--gold);font-weight:700;}

  /* ── 通知 Toast ── */
  .toast-wrap{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:#fff;border-radius:var(--r);padding:12px 18px;
    box-shadow:var(--shadow-card);border-left:4px solid var(--mint);
    display:flex;align-items:center;gap:10px;
    font-size:14px;color:var(--ink);
    animation:toast-in 0.4s cubic-bezier(.34,1.56,.64,1) both,
               toast-out 0.3s 2.5s ease both;
    min-width:220px;
  }
  @keyframes toast-in{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes toast-out{from{opacity:1}to{opacity:0;transform:translateX(120%)}}
  .toast-icon{font-size:20px;}
  .toast-text{flex:1;}
  .toast-name{font-weight:700;color:var(--coral-d);}

  /* 响应式 */
  @media(max-width:1200px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
    .right-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  }
</style>
</head>
<body>

<!-- 侧边栏 -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <span class="logo-icon">🔥</span>
    <div>
      <div class="logo-text">萌宠课堂</div>
      <div class="logo-ver">管理后台 v2.0</div>
    </div>
  </div>

  <span class="nav-section-label">核心功能</span>
  <div class="nav-item active" onclick="switchNav(this)">
    <span class="nav-icon">📊</span>数据总览
  </div>
  <div class="nav-item" onclick="switchNav(this)">
    <span class="nav-icon">👩‍🎓</span>学生管理
    <span class="nav-badge">32</span>
  </div>
  <div class="nav-item" onclick="switchNav(this)">
    <span class="nav-icon">🏫</span>班级管理
  </div>
  <div class="nav-item" onclick="switchNav(this)">
    <span class="nav-icon">📝</span>加分记录
  </div>
  <div class="nav-item" onclick="switchNav(this)">
    <span class="nav-icon">❓</span>题库管理
  </div>

  <span class="nav-section-label">设置</span>
  <div class="nav-item" onclick="switchNav(this)">
    <span class="nav-icon">🎨</span>主题皮肤
  </div>
  <div class="nav-item" onclick="switchNav(this)">
    <span class="nav-icon">👩‍🏫</span>教师账户
  </div>
  <div class="nav-item" onclick="switchNav(this)">
    <span class="nav-icon">💾</span>数据备份
  </div>

  <div class="sidebar-footer">
    <div class="user-row">
      <div class="user-avatar">👑</div>
      <div class="user-info">
        <div class="user-name">admin</div>
        <div class="user-role">超级管理员</div>
      </div>
      <button class="btn-logout" title="退出">↩</button>
    </div>
  </div>
</aside>

<!-- 主内容 -->
<div class="main">
  <!-- 顶部栏 -->
  <header class="topbar">
    <span class="topbar-title">📊 数据总览</span>
    <div class="topbar-right">
      <button class="btn-display" onclick="showToast('🖥', '正在打开课堂展示屏…', 'sky')">
        🖥 打开展示屏
      </button>
      <div class="topbar-notif" onclick="showToast('🔔','暂无新消息','mint')">
        🔔<div class="notif-dot"></div>
      </div>
    </div>
  </header>

  <!-- 内容 -->
  <div class="content">

    <!-- 统计卡片 -->
    <div class="stat-grid">
      <div class="stat-card c1">
        <div class="stat-icon">👩‍🎓</div>
        <div class="stat-num" id="cnt-stu">32</div>
        <div class="stat-label">全校学生</div>
        <span class="stat-change up">↑ 本周 +3</span>
      </div>
      <div class="stat-card c2">
        <div class="stat-icon">🏫</div>
        <div class="stat-num">4</div>
        <div class="stat-label">班级数</div>
        <span class="stat-change up">↑ 本学期</span>
      </div>
      <div class="stat-card c3">
        <div class="stat-icon">⭐</div>
        <div class="stat-num" id="cnt-score">1,248</div>
        <div class="stat-label">今日加分次数</div>
        <span class="stat-change up">↑ 比昨日 +18%</span>
      </div>
      <div class="stat-card c4">
        <div class="stat-icon">🏆</div>
        <div class="stat-num">7</div>
        <div class="stat-label">今日升级</div>
        <span class="stat-change up">↑ 恭喜他们！</span>
      </div>
    </div>

    <!-- 两栏布局 -->
    <div class="two-col">

      <!-- 学生列表 -->
      <div class="card-box">
        <div class="card-header">
          <span class="card-title">📋 学生列表</span>
          <button class="card-action" onclick="showToast('✅','批量操作就绪','mint')">+ 添加学生</button>
        </div>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input class="search-input" placeholder="搜索学生姓名、班级…" id="search-input"
                 oninput="filterStudents(this.value)" />
        </div>
        <table class="stu-table" id="stu-table">
          <thead>
            <tr>
              <th style="width:28px"><input type="checkbox" class="stu-check" onchange="toggleAll(this)"></th>
              <th>学生</th>
              <th>班级</th>
              <th>等级</th>
              <th style="min-width:100px">进度</th>
              <th>分数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="stu-tbody"></tbody>
        </table>
      </div>

      <!-- 右侧面板 -->
      <div class="right-panels">
        <!-- 快速加分 -->
        <div class="quick-score-card">
          <div class="qs-title">⚡ 快速加分</div>
          <select class="qs-select" id="qs-select">
            <option value="">— 选择学生 —</option>
          </select>
          <div class="score-btns">
            <button class="score-btn sb1" onclick="doScore(1)">+1</button>
            <button class="score-btn sb3" onclick="doScore(3)">+3</button>
            <button class="score-btn sb5" onclick="doScore(5)">+5</button>
          </div>
          <div class="behavior-tags" id="b-tags">
            <span class="b-tag" onclick="toggleTag(this)">👋 举手回答</span>
            <span class="b-tag" onclick="toggleTag(this)">📚 认真听讲</span>
            <span class="b-tag" onclick="toggleTag(this)">🤝 帮助同学</span>
            <span class="b-tag" onclick="toggleTag(this)">📝 交了作业</span>
            <span class="b-tag" onclick="toggleTag(this)">🌟 表现优秀</span>
            <span class="b-tag" onclick="toggleTag(this)">🏆 答题正确</span>
          </div>
          <textarea class="qs-reason" rows="2" placeholder="或自定义原因…" id="qs-reason"></textarea>
        </div>

        <!-- 排行榜 -->
        <div class="card-box" style="flex:1">
          <div class="card-header">
            <span class="card-title">🏆 积分排行</span>
            <span style="font-size:12px;color:var(--ink3)">本学期</span>
          </div>
          <div class="rank-list" id="rank-list"></div>
        </div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /main -->

<!-- Toast 容器 -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
(function(){
  const students = [
    {id:1,name:'刘阳',cls:'三（2）班',score:220,lv:10,emoji:'🐲'},
    {id:2,name:'王芳',cls:'三（2）班',score:160,lv:8,emoji:'🦋'},
    {id:3,name:'小明',cls:'三（2）班',score:128,lv:7,emoji:'🐉'},
    {id:4,name:'赵磊',cls:'三（1）班',score:87,lv:5,emoji:'🦁'},
    {id:5,name:'小红',cls:'三（1）班',score:56,lv:4,emoji:'🦊'},
    {id:6,name:'陈静',cls:'三（3）班',score:35,lv:4,emoji:'🐢'},
    {id:7,name:'李华',cls:'三（3）班',score:22,lv:3,emoji:'🐱'},
    {id:8,name:'周雨',cls:'三（4）班',score:12,lv:2,emoji:'🐣'},
  ];
  const thresholds=[0,5,12,22,35,55,80,115,160,220,300];

  /* ── 渲染学生表格 ── */
  function lvClass(lv){ return lv>=7?'hi':lv>=4?'mid':'lo'; }
  function lvColor(lv){ return lv>=7?'gold':lv>=4?'mint':'sky'; }

  function renderTable(list){
    const tb = document.getElementById('stu-tbody');
    tb.innerHTML='';
    list.forEach((s,i)=>{
      const cur=thresholds[s.lv]||0;
      const nxt=s.lv>=10?null:thresholds[s.lv+1];
      const pct=nxt?Math.round((s.score-cur)/(nxt-cur)*100):100;
      const lvc=lvColor(s.lv);
      const row=document.createElement('tr');
      row.innerHTML=`
        <td><input type="checkbox" class="stu-check"></td>
        <td>
          <div class="stu-name-cell">
            <div class="stu-avatar">${s.emoji}</div>
            <span class="stu-name-text">${s.name}</span>
          </div>
        </td>
        <td><span class="stu-class-tag">${s.cls}</span></td>
        <td><span class="lv-pill lv-${lvc}">LV.${s.lv}</span></td>
        <td>
          <div class="mini-prog">
            <div class="mini-prog-fill fill-${lvc}" style="width:${pct}%"></div>
          </div>
        </td>
        <td><strong>${s.score}</strong><span style="font-size:11px;color:var(--ink3)"> 分</span></td>
        <td>
          <div class="action-btns">
            <button class="btn-sm btn-score" onclick="quickScore(${s.id},'${s.name}')">加分</button>
            <button class="btn-sm btn-view" onclick="showToast('👀','查看 ${s.name} 的详情','sky')">查看</button>
          </div>
        </td>`;
      tb.appendChild(row);
    });
  }

  /* ── 排行榜 ── */
  function renderRank(){
    const rl=document.getElementById('rank-list');
    rl.innerHTML='';
    const sorted=[...students].sort((a,b)=>b.score-a.score).slice(0,5);
    sorted.forEach((s,i)=>{
      const noClass=i===0?'r1':i===1?'r2':i===2?'r3':'rN';
      const noText=i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
      const div=document.createElement('div'); div.className='rank-item';
      div.innerHTML=`
        <div class="rank-no ${noClass}">${noText}</div>
        <div class="rank-pet">${s.emoji}</div>
        <div class="rank-info">
          <div class="rank-name">${s.name} <span style="font-size:11px;color:var(--ink3)">${s.cls}</span></div>
          <div class="rank-score">${s.score} 分</div>
        </div>
        <div class="rank-lv">LV.${s.lv}</div>`;
      div.onclick=()=>showToast('📊',`${s.name}：${s.score}分，LV.${s.lv}`,'gold');
      rl.appendChild(div);
    });
  }

  /* ── 快速加分 select ── */
  function fillSelect(){
    const sel=document.getElementById('qs-select');
    students.forEach(s=>{
      const o=document.createElement('option');
      o.value=s.id; o.textContent=`${s.name} (${s.cls}) LV.${s.lv}`;
      sel.appendChild(o);
    });
  }

  /* ── 加分逻辑 ── */
  window.doScore=function(pts){
    const sel=document.getElementById('qs-select');
    const sid=parseInt(sel.value);
    if(!sid){showToast('⚠️','请先选择学生','coral');return;}
    const stu=students.find(s=>s.id===sid);
    if(!stu)return;
    const oldLv=stu.lv;
    stu.score+=pts;
    // 重算等级
    let lv=1;
    for(let i=1;i<=10;i++){if(stu.score>=thresholds[i])lv=i;}
    stu.lv=lv;
    if(lv>oldLv){
      showToast('🎉',`${stu.name} 升级了！LV.${lv} ✨`,'gold');
    } else {
      showToast('⭐',`${stu.name} +${pts}分，当前 ${stu.score} 分`,'mint');
    }
    renderTable(students);
    renderRank();
  };

  window.quickScore=function(id,name){
    const sel=document.getElementById('qs-select');
    sel.value=id;
    showToast('⚡',`已选中 ${name}，请点击分数按钮`,'sky');
    sel.scrollIntoView({behavior:'smooth',block:'nearest'});
  };

  /* ── 搜索过滤 ── */
  window.filterStudents=function(q){
    const kw=q.toLowerCase();
    const filtered=students.filter(s=>s.name.includes(q)||s.cls.includes(kw));
    renderTable(filtered);
  };

  /* ── 全选 ── */
  window.toggleAll=function(cb){
    document.querySelectorAll('.stu-check').forEach(c=>c.checked=cb.checked);
  };

  /* ── 行为标签 ── */
  window.toggleTag=function(el){
    el.classList.toggle('sel');
    const sel=[...document.querySelectorAll('.b-tag.sel')].map(t=>t.textContent.trim());
    document.getElementById('qs-reason').value=sel.join(' · ');
  };

  /* ── 侧边栏导航 ── */
  window.switchNav=function(el){
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    el.classList.add('active');
    const labels={'📊 数据总览':'数据总览','👩‍🎓 学生管理':'学生管理',
      '🏫 班级管理':'班级管理','📝 加分记录':'加分记录','❓ 题库管理':'题库管理',
      '🎨 主题皮肤':'主题皮肤','👩‍🏫 教师账户':'教师账户','💾 数据备份':'数据备份'};
    const txt=el.textContent.replace(/\d+$/,'').trim();
    for(const [k,v] of Object.entries(labels)){
      if(txt.includes(k.slice(3))){
        document.querySelector('.topbar-title').textContent=k;
        break;
      }
    }
  };

  /* ── Toast 通知 ── */
  window.showToast=function(icon,msg,type='mint'){
    const colors={'mint':'var(--mint)','gold':'var(--gold)','sky':'var(--sky)',
                  'coral':'var(--coral-d)','lavender':'var(--lavender)'};
    const wrap=document.getElementById('toast-wrap');
    const t=document.createElement('div');
    t.className='toast';
    t.style.borderLeftColor=colors[type]||colors.mint;
    t.innerHTML=`<span class="toast-icon">${icon}</span>
      <span class="toast-text">${msg}</span>`;
    wrap.appendChild(t);
    setTimeout(()=>t.remove(),3000);
  };

  /* ── 动态更新数字 ── */
  function animateNum(el,target){
    let cur=0;const step=Math.ceil(target/40);
    const timer=setInterval(()=>{
      cur=Math.min(cur+step,target);
      el.textContent=cur.toLocaleString();
      if(cur>=target)clearInterval(timer);
    },30);
  }

  /* ── 初始化 ── */
  renderTable(students);
  renderRank();
  fillSelect();
  setTimeout(()=>animateNum(document.getElementById('cnt-stu'),32),300);
  setTimeout(()=>animateNum(document.getElementById('cnt-score'),1248),500);
  setTimeout(()=>showToast('🎉','刘阳 升级到 LV.10！烈火战神！','gold'),1200);
  setTimeout(()=>showToast('⭐','王芳 获得 +5 分（表现优秀）','mint'),2400);
})();
</script>
</body>
</html>
