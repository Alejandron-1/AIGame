<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大数星球探索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 标题区域 */
        .header {
            text-align: center;
            padding: 30px 20px 20px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #fff;
            font-size: 48px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 0 40px rgba(100,200,255,0.3);
            margin-bottom: 20px;
            letter-spacing: 8px;
        }

        /* 模式切换按钮 */
        .mode-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-btn.read {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .mode-btn.write {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .mode-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255,255,255,0.3);
        }

        .mode-btn.active {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255,255,255,0.6);
        }

        .hint-text {
            color: #a0c4ff;
            font-size: 16px;
            margin-top: 10px;
            opacity: 0.9;
        }

        /* 游戏区域 */
        .game-area {
            position: relative;
            width: 100%;
            height: calc(100vh - 200px);
            overflow: hidden;
        }

        /* 弹珠/星球样式 */
        .planet {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 -5px 15px rgba(0,0,0,0.2);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            user-select: none;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .planet:hover {
            transform: scale(1.1);
            z-index: 100;
        }

        .planet::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 30%;
            height: 20%;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            filter: blur(2px);
        }

        /* 星球颜色类 */
        .planet-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .planet-purple { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .planet-green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .planet-orange { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .planet-red { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%); }
        .planet-yellow { background: linear-gradient(135deg, #feca57 0%, #ff9ff3 100%); }
        .planet-cyan { background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%); }
        .planet-pink { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }

        /* 右下角按钮 */
        .action-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 22px;
            font-weight: bold;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        }

        .action-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.create {
            background: linear-gradient(135deg, #fd79a8 0%, #fdcb6e 100%);
        }

        .action-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .btn-icon {
            font-size: 36px;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            color: white;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-number {
            font-size: 72px;
            font-weight: bold;
            margin: 30px 0;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
            letter-spacing: 10px;
            font-family: 'Courier New', monospace;
        }

        .modal-chinese {
            font-size: 28px;
            margin-bottom: 30px;
            opacity: 0.95;
            line-height: 1.6;
        }

        .close-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        /* 创建星球弹窗 */
        .create-modal .modal-content {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .input-group {
            margin: 30px 0;
        }

        .number-input {
            width: 100%;
            padding: 20px;
            font-size: 36px;
            text-align: center;
            border: none;
            border-radius: 15px;
            background: rgba(255,255,255,0.9);
            color: #333;
            letter-spacing: 8px;
            font-weight: bold;
            outline: none;
        }

        .number-input::placeholder {
            color: #999;
            font-size: 24px;
        }

        .create-submit {
            padding: 15px 50px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #f5576c;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .create-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .error-msg {
            color: #ffeaa7;
            font-size: 16px;
            margin-top: 10px;
            height: 20px;
        }

        /* 选中动画 */
        .selecting {
            animation: selectingAnim 1s ease;
        }

        @keyframes selectingAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); box-shadow: 0 0 50px rgba(255,255,255,0.8); }
            100% { transform: scale(1); }
        }

        /* 新星球飞入动画 */
        @keyframes flyIn {
            0% { 
                transform: scale(0) translate(100vw, 100vh);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) translate(-50px, -50px);
            }
            100% { 
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }
        }

        .new-planet {
            animation: flyIn 0.8s ease-out;
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <!-- 标题区域 -->
    <div class="header">
        <h1>大数星球探索</h1>
        <div class="mode-buttons">
            <button class="mode-btn read active" onclick="switchMode('read')">
                <span>🔊</span> 读一读
            </button>
            <button class="mode-btn write" onclick="switchMode('write')">
                <span>✏️</span> 写一写
            </button>
        </div>
        <div class="hint-text" id="hintText">点击右下角的探索按钮，随机发现一个大数星球！</div>
    </div>

    <!-- 游戏区域 -->
    <div class="game-area" id="gameArea"></div>

    <!-- 右下角按钮 -->
    <button class="action-btn" id="actionBtn" onclick="handleAction()">
        <span class="btn-icon">🚀</span>
        <span id="btnText">探索星球</span>
    </button>

    <!-- 读一读弹窗 -->
    <div class="modal" id="readModal">
        <div class="modal-content">
            <h2 style="font-size: 28px; margin-bottom: 10px;">🌟 发现大数星球！</h2>
            <div class="modal-number" id="modalNumber">12345</div>
            <div class="modal-chinese" id="modalChinese">一万二千三百四十五</div>
            <button class="close-btn" onclick="closeModal()">知道了</button>
        </div>
    </div>

    <!-- 创建星球弹窗 -->
    <div class="modal create-modal" id="createModal">
        <div class="modal-content">
            <h2 style="font-size: 28px; margin-bottom: 10px;">✨ 创建新星球</h2>
            <p style="opacity: 0.9; margin-bottom: 20px;">输入一个五位数，创建属于你的数字星球！</p>
            <div class="input-group">
                <input type="number" class="number-input" id="numberInput" 
                       placeholder="输入五位数" min="10000" max="99999"
                       oninput="validateInput(this)">
                <div class="error-msg" id="errorMsg"></div>
            </div>
            <button class="create-submit" onclick="createPlanet()">创建星球</button>
            <button class="close-btn" onclick="closeModal()" style="margin-left: 10px; background: transparent;">取消</button>
        </div>
    </div>

    <script>
        // 全局变量
        let currentMode = 'read';
        let planets = [];
        const colors = ['planet-blue', 'planet-purple', 'planet-green', 'planet-orange', 
                       'planet-red', 'planet-yellow', 'planet-cyan', 'planet-pink'];
        
        // 初始化星空背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 生成随机五位数
        function generateRandomNumber() {
            return Math.floor(Math.random() * 90000) + 10000;
        }

        // 数字转中文
        function numberToChinese(num) {
            const digits = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
            const units = ['', '十', '百', '千', '万'];
            
            let str = num.toString();
            let result = '';
            
            for (let i = 0; i < str.length; i++) {
                let n = parseInt(str[i]);
                let unit = units[str.length - 1 - i];
                
                if (n === 0) {
                    if (result.length > 0 && result[result.length - 1] !== '零' && i !== str.length - 1) {
                        result += '零';
                    }
                } else {
                    result += digits[n] + unit;
                }
            }
            
            // 清理末尾的零
            result = result.replace(/零+$/, '');
            
            // 特殊处理"一万"开头
            if (str.length === 5 && str[0] === '1') {
                result = result.replace(/^一/, '');
            }
            
            return result || '零';
        }

        // 创建星球
        function createPlanetElement(number, x, y, isNew = false) {
            const planet = document.createElement('div');
            const colorClass = colors[Math.floor(Math.random() * colors.length)];
            const size = Math.random() * 30 + 90; // 90-120px
            
            planet.className = `planet ${colorClass} ${isNew ? 'new-planet' : ''}`;
            planet.style.width = size + 'px';
            planet.style.height = size + 'px';
            planet.style.left = x + 'px';
            planet.style.top = y + 'px';
            planet.textContent = number;
            planet.dataset.number = number;
            
            if (!isNew) {
                planet.onclick = () => showPlanet(number);
            }
            
            return planet;
        }

        // 初始化游戏区域
        function initGame() {
            const gameArea = document.getElementById('gameArea');
            const width = gameArea.offsetWidth;
            const height = gameArea.offsetHeight;
            
            // 生成初始星球
            for (let i = 0; i < 15; i++) {
                const number = generateRandomNumber();
                const x = Math.random() * (width - 120) + 20;
                const y = Math.random() * (height - 120) + 20;
                
                const planet = createPlanetElement(number, x, y);
                gameArea.appendChild(planet);
                planets.push({element: planet, x, y, vx: 0, vy: 0});
            }
        }

        // 切换模式
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.mode-btn.${mode}`).classList.add('active');
            
            const btn = document.getElementById('actionBtn');
            const btnText = document.getElementById('btnText');
            const hintText = document.getElementById('hintText');
            
            if (mode === 'read') {
                btn.className = 'action-btn';
                btnText.textContent = '探索星球';
                hintText.textContent = '点击右下角的探索按钮，随机发现一个大数星球！';
            } else {
                btn.className = 'action-btn create';
                btnText.textContent = '创建星球';
                hintText.textContent = '点击右下角的创建按钮，输入五位数创建新星球！';
            }
        }

        // 处理按钮点击
        function handleAction() {
            if (currentMode === 'read') {
                explorePlanet();
            } else {
                document.getElementById('createModal').classList.add('active');
                document.getElementById('numberInput').value = '';
                document.getElementById('numberInput').focus();
                document.getElementById('errorMsg').textContent = '';
            }
        }

        // 探索星球（随机选择一个）
        function explorePlanet() {
            if (planets.length === 0) return;
            
            // 随机选择一个星球
            const randomIndex = Math.floor(Math.random() * planets.length);
            const target = planets[randomIndex];
            
            // 添加选中动画
            target.element.classList.add('selecting');
            target.element.style.zIndex = 1000;
            
            // 滚动到视图（如果需要）
            target.element.scrollIntoView({behavior: 'smooth', block: 'center', inline: 'center'});
            
            setTimeout(() => {
                target.element.classList.remove('selecting');
                target.element.style.zIndex = '';
                showPlanet(target.element.dataset.number);
            }, 1000);
        }

        // 显示星球详情
        function showPlanet(number) {
            const num = parseInt(number);
            document.getElementById('modalNumber').textContent = num;
            document.getElementById('modalChinese').textContent = numberToChinese(num);
            document.getElementById('readModal').classList.add('active');
        }

        // 验证输入
        function validateInput(input) {
            const errorMsg = document.getElementById('errorMsg');
            const value = input.value;
            
            if (value.length > 5) {
                input.value = value.slice(0, 5);
            }
            
            if (value && (parseInt(value) < 10000 || parseInt(value) > 99999)) {
                errorMsg.textContent = '请输入10000-99999之间的五位数';
            } else {
                errorMsg.textContent = '';
            }
        }

        // 创建新星球
        function createPlanet() {
            const input = document.getElementById('numberInput');
            const number = parseInt(input.value);
            
            if (isNaN(number) || number < 10000 || number > 99999) {
                document.getElementById('errorMsg').textContent = '请输入有效的五位数（10000-99999）';
                return;
            }
            
            const gameArea = document.getElementById('gameArea');
            const width = gameArea.offsetWidth;
            const height = gameArea.offsetHeight;
            
            // 从右下角飞入的动画起始位置
            const startX = width - 100;
            const startY = height - 100;
            
            // 随机目标位置
            const targetX = Math.random() * (width - 120) + 20;
            const targetY = Math.random() * (height - 120) + 20;
            
            const planet = createPlanetElement(number, targetX, targetY, true);
            planet.style.left = startX + 'px';
            planet.style.top = startY + 'px';
            
            gameArea.appendChild(planet);
            
            // 触发动画
            setTimeout(() => {
                planet.style.transition = 'all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                planet.style.left = targetX + 'px';
                planet.style.top = targetY + 'px';
            }, 50);
            
            // 动画结束后恢复正常状态
            setTimeout(() => {
                planet.classList.remove('new-planet');
                planet.style.transition = 'transform 0.3s ease';
                planet.onclick = () => showPlanet(number);
            }, 850);
            
            planets.push({element: planet, x: targetX, y: targetY, vx: 0, vy: 0});
            
            closeModal();
        }

        // 关闭弹窗
        function closeModal() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.remove('active');
            });
        }

        // 点击弹窗外部关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        });

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && document.getElementById('createModal').classList.contains('active')) {
                createPlanet();
            }
        });

        // 初始化
        window.onload = () => {
            createStars();
            initGame();
        };

        // 窗口大小改变时重新布局
        window.onresize = () => {
            const gameArea = document.getElementById('gameArea');
            const width = gameArea.offsetWidth;
            const height = gameArea.offsetHeight;
            
            planets.forEach(p => {
                p.x = Math.min(p.x, width - 120);
                p.y = Math.min(p.y, height - 120);
                p.element.style.left = p.x + 'px';
                p.element.style.top = p.y + 'px';
            });
        };
    </script>
</body>
</html>
