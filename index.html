<head>
<meta charset="UTF-8">

<title>小学数学游戏目录 - 按年级分类</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(180deg, #FFFDF6 0%, #FFF3DC 100%);
        min-height: 100vh;
        padding: 30px 20px 60px;
        user-select: none;
        -webkit-user-select: none;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .hero { text-align: center; color: #5A4632; margin-bottom: 30px; }
    .hero h1 { font-size: 38px; letter-spacing: 4px; }
    .hero p { margin-top: 10px; font-size: 15px; color: #A08B6C; font-weight: bold; }

    /* ===== 第一屏：年级导航 ===== */
    #gradeView { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; }
    .gcard {
        position: relative; background: #FFFFFF; border-radius: 28px; cursor: pointer;
        border: 4px solid var(--c); box-shadow: 0 10px 0 rgba(90,70,50,.08);
        padding: 24px 24px 20px; transition: transform .15s, box-shadow .15s; overflow: hidden;
    }
    .gcard:hover { transform: translateY(-6px); box-shadow: 0 16px 30px rgba(90,70,50,.18); }
    .gcard .ghead { display: flex; align-items: center; gap: 14px; }
    .gcard .gava {
        width: 64px; height: 64px; border-radius: 20px; background: var(--c); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; font-weight: bold; flex-shrink: 0;
    }
    .gcard .gt { font-size: 26px; font-weight: bold; color: #5A4632; }
    .gcard .gn { font-size: 14px; color: var(--c); font-weight: bold; margin-top: 4px; }
    .minis { display: flex; margin-top: 18px; padding-left: 4px; }
    .minis .m {
        width: 92px; height: 56px; border-radius: 12px; border: 3px solid #FFF;
        background: linear-gradient(135deg,#F6E7C8,#F2DFB9) center/cover no-repeat;
        box-shadow: 0 3px 8px rgba(90,70,50,.18); margin-left: -14px;
    }
    .minis .m:first-child { margin-left: 0; }
    .minis .m.more {
        display: flex; align-items: center; justify-content: center;
        color: #A08B6C; font-size: 13px; font-weight: bold;
    }
    .gcard .go { position: absolute; right: 20px; bottom: 18px; color: var(--c);
        font-size: 30px; font-weight: bold; opacity: .35; }
    .gcard:hover .go { opacity: 1; }

    /* ===== 第二屏：年级内游戏卡片 ===== */
    #gameView { display: none; }
    #backBtn {
        display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
        border: 3px solid #F2DFB9; background: #fff; color: #A08B6C;
        font-size: 18px; font-weight: bold; padding: 10px 24px; border-radius: 999px;
        margin-bottom: 18px; font-family: inherit;
    }
    #backBtn:hover { color: #5A4632; border-color: #E8D5B5; }
    #gvTitle { font-size: 30px; font-weight: bold; color: #5A4632; margin-bottom: 20px; letter-spacing: 2px; }
    #gvTitle b { color: var(--c, #E8623C); }
    #gameGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 20px; }
    .card {
        background: #FFFFFF; border-radius: 20px; overflow: hidden; text-decoration: none;
        display: block; color: inherit; border: 3px solid #F2DFB9;
        transition: transform .15s, box-shadow .15s, border-color .15s;
        box-shadow: 0 6px 18px rgba(90,70,50,.10);
    }
    .card:hover { transform: translateY(-5px); border-color: var(--c); box-shadow: 0 12px 26px rgba(90,70,50,.20); }
    .thumb {
        height: 196px; position: relative;
        background: linear-gradient(135deg,#FDF3E0 0%,#F6E7C8 100%) center/cover no-repeat;
    }
    .thumb .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center top; }
    .thumb .fa { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 64px; }
    .chip {
        position: absolute; top: 10px; right: 10px; font-size: 12px; font-weight: bold;
        padding: 3px 10px; border-radius: 999px; color: #fff; background: #4CAF50; opacity: .92;
    }
    .chip.wip { background: #F2A93B; }
    .chip.tool { background: #3E8CBF; }
    .cbody { padding: 12px 16px 14px; }
    .cname { font-size: 17.5px; font-weight: bold; color: #5A4632; }
    .cdesc { font-size: 13px; color: #A08B6C; margin-top: 5px; line-height: 1.55; }
    footer { text-align: center; color: #C9B89A; font-size: 13px; margin-top: 34px; font-weight: bold; }

/* ================= 渲染 ================= */
function $(id){ return document.getElementById(id); }

function miniThumb(g){
  if(!g.s) return '<div class="m more">'+g.n.charAt(0)+'</div>';
  return '<div class="m" style="background-image:url(\'thumbs/'+g.s+'.png\')"></div>';
}

function renderGrades(){
  var html='';
  GRADES.forEach(function(g){
    var picks=g.games.filter(function(x){return x.s;}).slice(0,3);
    var minis='';
    picks.forEach(function(x){ minis+=miniThumb(x); });
    var moreN=g.games.length-picks.length;
    if(moreN>0) minis+='<div class="m more">+'+moreN+'</div>';
    html+='<div class="gcard" style="--c:'+g.c+'" data-g="'+g.id+'">'+
      '<div class="ghead"><div class="gava">'+g.short+'</div>'+
      '<div><div class="gt">'+g.name+'</div><div class="gn">'+g.games.length+' 个 · '+g.tag+'</div></div></div>'+
      '<div class="minis">'+minis+'</div>'+
      '<div class="go">›</div></div>';
  });
  $('gradeView').innerHTML=html;
  Array.from(document.querySelectorAll('.gcard')).forEach(function(el){
    el.addEventListener('click', function(){ location.hash=el.getAttribute('data-g'); });
  });
}

function renderGames(gid){
  var g=null;
  GRADES.forEach(function(x){ if(x.id===gid) g=x; });
  if(!g){ showGrades(); return; }
  document.getElementById('gameView').style.setProperty('--c', g.c);
  $('gvTitle').innerHTML='<b>'+g.name+'</b>　'+g.games.length+' 个游戏 · 点卡片直接打开';
  var html='';
  g.games.forEach(function(x){
    var chip=x.b?'<span class="chip '+(x.bc||'')+'">'+x.b+'</span>':'';
    var face=x.s
      ? '<div class="bgimg" style="background-image:url(\'thumbs/'+x.s+'.png\')"></div>'+(x.fa?'<div class="fa">'+x.fa+'</div>':'')
      : '<div class="fa">'+(x.fa||'🎮')+'</div>';
    html+='<a class="card" style="--c:'+g.c+'" href="'+x.f+'">'+
      '<div class="thumb">'+face+chip+'</div>'+
      '<div class="cbody"><div class="cname">'+x.n+'</div><div class="cdesc">'+x.d+'</div></div></a>';
  });
  $('gameGrid').innerHTML=html;
  $('gradeView').style.display='none';
  $('gameView').style.display='block';
  window.scrollTo(0,0);
}

function showGrades(){
  $('gameView').style.display='none';
  $('gradeView').style.display='grid';
  window.scrollTo(0,0);
}

function route(){
  var h=location.hash.replace('#','');
  if(h) renderGames(h); else showGrades();
}

$('backBtn').addEventListener('click', function(){ location.hash=''; showGrades(); });
window.addEventListener('hashchange', route);
renderGrades();
route();
</script>
</body>
</html>
