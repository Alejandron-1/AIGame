<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 AI宠物乐园 · 展示端</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: linear-gradient(180deg, var(--bgTop, #a8edea), var(--bgBottom, #fed6e3));
    min-height: 100vh; color: #2d3436; user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
}
/* ===== 顶栏 ===== */
.top { display: flex; align-items: center; gap: 14px; padding: 12px 22px; }
.top h1 { font-size: clamp(22px, 2.6vw, 34px); font-weight: 900; color: var(--accent, #e84393);
    text-shadow: 2px 2px 0 #fff; letter-spacing: 2px; }
.top .cls { background: rgba(255,255,255,.75); border-radius: 16px; padding: 6px 16px; font-weight: 800; }
.ctrls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.cbtn { background: #fff; border-radius: 12px; padding: 8px 14px; font-size: 15px; font-weight: 800;
    box-shadow: 0 3px 0 rgba(0,0,0,.1); border: none; cursor: pointer; }
.cbtn:active { transform: scale(.94); }
.cbtn.on { background: #2d3436; color: #fff; }
#vol { width: 90px; }

/* ===== 宠物农场 ===== */
#farm { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 16px; padding: 6px 22px 30px; }
.card { background: var(--card, #fff); border-radius: 22px; padding: 14px 12px 12px; text-align: center;
    box-shadow: 0 6px 0 rgba(0,0,0,.08); position: relative; transition: transform .15s; cursor: pointer; }
.card:hover { transform: translateY(-4px); }
.card .pet { width: 108px; height: 108px; margin: 0 auto; }
.card .pet img, .card .pet svg { width: 100%; height: 100%; }
.card .pet.eat { animation: eat .5s; }
@keyframes eat { 30% { transform: scale(1.18) rotate(-4deg); } 70% { transform: scale(.94) rotate(3deg); } }
.card .nm { font-size: 19px; font-weight: 900; margin-top: 6px; }
.card .lv { font-size: 13.5px; font-weight: 800; color: var(--accent, #e84393); margin: 2px 0 4px; }
.bar { height: 12px; background: rgba(0,0,0,.1); border-radius: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd200, #ff9f43);
    border-radius: 8px; transition: width .5s; }
.card .mood { position: absolute; top: 8px; right: 10px; font-size: 24px; }
.card .stageName { font-size: 12px; color: #95a5a6; margin-top: 4px; font-weight: 700; }
.card .speak { position: absolute; left: 50%; top: -12px; transform: translate(-50%, -100%);
    background: #fff; border: 2px solid var(--accent, #e84393); color: #2d3436; border-radius: 14px;
    padding: 6px 12px; font-size: 14px; font-weight: 800; white-space: nowrap; opacity: 0; transition: all .3s; z-index: 5; }
.card .speak.show { opacity: 1; }
.card.gold { animation: gold .9s; }
@keyframes gold { 30% { box-shadow: 0 0 0 6px #ffd200, 0 0 30px #ffd200; transform: scale(1.05); } }

/* 食物飞行动画 */
.flyfood { position: fixed; z-index: 80; font-size: 40px; pointer-events: none; }
@keyframes flyArc { 0% { transform: translate(0,0) scale(.6); opacity: 0; }
    15% { opacity: 1; } 60% { transform: translate(calc(var(--dx)*.55), calc(var(--dy)*.55 - 140px)) scale(1.25); }
    100% { transform: translate(var(--dx), var(--dy)) scale(.9); opacity: .9; } }
.expfloat { position: fixed; z-index: 80; font-weight: 900; font-size: 26px; pointer-events: none;
    animation: expUp 1.1s forwards; }
@keyframes expUp { 0% { opacity: 0; translate: 0 12px; } 25% { opacity: 1; } 100% { opacity: 0; translate: 0 -46px; } }

/* ===== 进化全屏仪式 ===== */
#evoLayer { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(10, 12, 30, .88); }
#evoLayer.show { display: flex; }
#evoLayer .rays { position: absolute; inset: 0; background:
    conic-gradient(from 0deg, transparent 0 14deg, rgba(255,255,255,.1) 14deg 22deg, transparent 22deg 36deg);
    animation: spin 7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#evoLayer .big { width: min(40vh, 320px); height: min(40vh, 320px); animation: evoPop 1.1s cubic-bezier(.2,1.5,.4,1); position: relative; z-index: 2; }
#evoLayer .big img, #evoLayer .big svg { width: 100%; height: 100%; }
@keyframes evoPop { 0% { transform: scale(.1) rotate(-20deg); opacity: 0; }
    60% { transform: scale(1.2) rotate(4deg); opacity: 1; } }
#evoLayer .who { font-size: clamp(26px, 4vw, 44px); font-weight: 900; color: #ffd200; margin-top: 16px;
    letter-spacing: 3px; text-shadow: 0 3px 12px rgba(0,0,0,.5); z-index: 2; }
#evoLayer .sub { font-size: clamp(16px, 2vw, 24px); color: #fff; margin-top: 8px; z-index: 2; }

/* 升级横幅 */
#lvBanner { position: fixed; left: 50%; top: 16%; transform: translateX(-50%) scale(0); z-index: 85;
    background: linear-gradient(180deg, #ffe259, #ffa751); color: #5b4300; border-radius: 40px;
    padding: 16px 52px; font-size: clamp(24px, 3vw, 40px); font-weight: 900; letter-spacing: 3px;
    box-shadow: 0 12px 40px rgba(0,0,0,.3); transition: transform .3s cubic-bezier(.2,1.5,.4,1); }
#lvBanner.show { transform: translateX(-50%) scale(1); }

/* ===== 提示 ===== */
#toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: rgba(44,62,80,.92);
    color: #fff; padding: 11px 24px; border-radius: 24px; font-size: 15px; z-index: 95; opacity: 0; transition: all .25s; pointer-events: none; }
#toast.show { opacity: 1; }
#errbox { position: fixed; inset: 0; z-index: 99; display: none; align-items: center; justify-content: center;
    background: #2d3436; color: #fff; text-align: center; font-size: 20px; line-height: 2; }
body.focus .fx-off { display: none !important; }
body.focus .card .mood { display: none; }
</style>
</head>
<body>
<div class="top">
    <h1>🐱 AI宠物乐园</h1>
    <div class="cls" id="clsName">—</div>
    <div class="ctrls">
        <span style="font-size:20px">🎵</span>
        <input type="range" id="vol" min="0" max="100" value="30">
        <button class="cbtn" id="muteBtn">🔊</button>
        <button class="cbtn" id="focusBtn">🎯 专注</button>
        <button class="cbtn" id="fsBtn">⛶ 全屏</button>
    </div>
</div>
<div id="farm"></div>

<div id="evoLayer"><div class="rays"></div><div class="big" id="evoPet"></div>
    <div class="who" id="evoWho"></div><div class="sub" id="evoSub"></div></div>
<div id="lvBanner"></div>
<div id="toast"></div>
<div id="errbox">🐱 服务未启动<br>请在教室电脑双击 ai宠物 目录里的 <b>启动.bat</b><br>然后刷新本页面</div>

<audio id="bgm" loop></audio>

<script src="/pets.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const STAGE_NAMES = ['宠物蛋', '幼年体', '成熟体', '进化体'];

/* ================= 状态 ================= */
let S = null;              // 最近一次 /api/state
let prevMap = {};          // sid -> {exp, stage, level} 用于差分动画
let shownEvents = new Set();
let focusMode = localStorage.getItem('pet_focus') === '1';
let muted = localStorage.getItem('pet_mute') === '1';
let bgmVol = +(localStorage.getItem('pet_vol') || 30);

/* ================= 音效（Web Audio 合成） ================= */
let actx = null;
function beep(f, d = .12, t = 'sine', v = .15) {
    if (muted || focusMode) return;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(v, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d);
        o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
    } catch (e) {}
}
const sPop = () => { beep(500, .07, 'triangle'); setTimeout(() => beep(880, .1, 'triangle'), 70); };
const sLv = () => { beep(660, .12); setTimeout(() => beep(880, .12), 100); setTimeout(() => beep(1174, .2), 200); };
const sEvo = () => [392, 523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, .24, 'triangle', .18), i * 150));
let toastT = 0;
function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ================= BGM ================= */
const bgm = $('bgm');
let bgmStarted = false;
function applyBGM(theme) {
    const tr = theme && theme.bgm && theme.bgm.track;
    const src = tr ? '/themes/' + encodeURIComponent(S.themeName) + '/' + tr : '';
    if (src && bgm.getAttribute('src') !== src) bgm.setAttribute('src', src);
    const base = (theme && theme.bgm && theme.bgm.volume != null) ? theme.bgm.volume : .3;
    bgm.volume = focusMode ? 0 : (muted ? 0 : base * ($('vol').value / 30));
}
function tryStartBGM() {
    if (bgmStarted || !bgm.getAttribute('src')) return;
    bgm.play().then(() => { bgmStarted = true; }).catch(() => {});
}
document.addEventListener('pointerdown', () => { tryStartBGM(); if (actx) actx.resume(); }, { once: false });
$('vol').value = bgmVol;
$('vol').oninput = e => { bgmVol = +e.target.value; localStorage.setItem('pet_vol', bgmVol); applyBGM(S && S.theme); };
if (muted) $('muteBtn').textContent = '🔇';
$('muteBtn').onclick = () => { muted = !muted; localStorage.setItem('pet_mute', muted ? '1' : '0');
    $('muteBtn').textContent = muted ? '🔇' : '🔊'; applyBGM(S && S.theme); if (!muted) { tryStartBGM(); sClick(); } };
function sClick() { beep(700, .05, 'triangle'); }

/* ================= 专注模式 / 全屏 ================= */
function applyFocus() {
    document.body.classList.toggle('focus', focusMode);
    $('focusBtn').classList.toggle('on', focusMode);
    applyBGM(S && S.theme);
}
$('focusBtn').onclick = () => { focusMode = !focusMode; localStorage.setItem('pet_focus', focusMode ? '1' : '0');
    applyFocus(); toast(focusMode ? '专注模式：已静音、关闭特效' : '已退出专注模式'); };
$('fsBtn').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };

/* ================= 拉取状态与渲染 ================= */
async function poll() {
    try {
        const r = await fetch('/api/state');
        if (r.status === 400) { $('errbox').style.display = 'flex'; return; }
        const j = await r.json();
        if (!j.ok) { $('errbox').style.display = 'flex'; return; }
        $('errbox').style.display = 'none';
        render(j);
    } catch (e) { $('errbox').style.display = 'flex'; }
}
function render(j) {
    const themeChanged = !S || S.themeName !== j.themeName ||
        JSON.stringify(S.theme) !== JSON.stringify(j.theme);
    const theme = j.theme || {};
    document.documentElement.style.setProperty('--bgTop', (theme.palette || {}).bgTop || '#a8edea');
    document.documentElement.style.setProperty('--bgBottom', (theme.palette || {}).bgBottom || '#fed6e3');
    document.documentElement.style.setProperty('--card', (theme.palette || {}).card || '#fff');
    document.documentElement.style.setProperty('--accent', (theme.palette || {}).accent || '#e84393');
    $('clsName').textContent = j.className;
    applyBGM(theme);
    applyFocus();

    /* 排序 */
    const stu = j.students.slice();
    if (j.config.sort === 'name') stu.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
    else if (j.config.sort === 'level') stu.sort((a, b) => b.level - a.level || b.totalExp - a.totalExp);
    else if (j.config.sort === 'shuffle') {
        let seed = [...(j.className || 'x')].reduce((s, c) => s + c.charCodeAt(0), 0) + new Date().toDateString();
        stu.sort((a, b) => ((hash(a.id + seed) % 1000) - (hash(b.id + seed) % 1000)));
    }
    renderGrid(j, stu, themeChanged);
    S = j;
    playEvents(j.recentEvents || []);
}
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }

function renderGrid(j, stu, themeChanged) {
    const farm = $('farm');
    const keepEls = {};
    /* 复用已有卡片节点，减少重绘 */
    [...farm.children].forEach(el => { keepEls[el.dataset.sid] = el; farm.removeChild(el); });
    stu.forEach(s => {
        let card = keepEls[s.id];
        if (!card || themeChanged) {
            card = document.createElement('div');
            card.className = 'card';
            card.dataset.sid = s.id;
            card.innerHTML = `<div class="speak"></div><div class="mood"></div>
                <div class="pet"></div><div class="nm"></div><div class="lv"></div>
                <div class="bar"><i></i></div><div class="stageName"></div>`;
        }
        drawCard(card, s, j);
        farm.appendChild(card);
    });
}
function drawCard(card, s, j) {
    const theme = j.theme || {};
    const petDef = (theme.pets || []).find(p => p.id === s.petId) || { id: s.petId, name: '', stages: ['', '', '', ''] };
    /* 蛋期裂纹：距破壳进度的 0~3 道 */
    const rules = theme.rules || { stageExp: [30, 100, 250] };
    const cracks = s.stage === 0 ? Math.min(3, Math.floor(s.totalExp / (rules.stageExp[0] || 30) * 4)) : 0;
    const petBox = card.querySelector('.pet');
    if (card._stageKey !== s.stage + ':' + cracks + ':' + JSON.stringify(petDef.stages)) {
        petBox.innerHTML = renderPet(theme, petDef, s.stage, { cracks });
        card._stageKey = s.stage + ':' + cracks + ':' + JSON.stringify(petDef.stages);
    }
    card.querySelector('.nm').textContent = (s.nickname || s.name) + '的' + (petDef.name || '宠物');
    card.querySelector('.lv').textContent = `Lv.${s.level}${s.stage === 3 ? ' · ' + (petDef.title || '巅峰') : ''}`;
    card.querySelector('.bar i').style.width = Math.min(100, s.progress * 100) + '%';
    card.querySelector('.mood').textContent = s.effMood >= 80 ? '🤩' : s.effMood >= 50 ? '😊' : s.effMood >= 25 ? '😢' : '😪';
    card.querySelector('.stageName').textContent = STAGE_NAMES[s.stage] + (s.totalExp ? ` · ${s.totalExp} EXP` : '');
}

/* ================= 事件动画（投喂/升级/进化） ================= */
function playEvents(events) {
    events.forEach(ev => {
        const key = ev.ts + '|' + ev.sid;
        if (shownEvents.has(key)) return;
        shownEvents.add(key);
        const card = document.querySelector(`.card[data-sid="${ev.sid}"]`);
        if (!card) return;
        /* 食物飞行动画 */
        if (!document.body.classList.contains('focus')) {
            const foods = (S.theme && S.theme.foods) || [];
            const food = foods.find(f => f.name === ev.food);
            const icon = (food && food.icon) || '🍎';
            const cr = card.getBoundingClientRect();
            const f = document.createElement('div');
            f.className = 'flyfood'; f.textContent = icon;
            f.style.left = (cr.left - 60) + 'px'; f.style.top = (cr.top + 30) + 'px';
            f.style.setProperty('--dx', '60px'); f.style.setProperty('--dy', '0px');
            f.style.animation = 'flyArc .8s ease-out forwards';
            document.body.appendChild(f); setTimeout(() => f.remove(), 900);
            const pet = card.querySelector('.pet');
            pet.classList.remove('eat'); void pet.offsetWidth; pet.classList.add('eat');
        }
        sPop();
        /* 宠物说话 */
        const corpus = (S.theme && S.theme.corpus) || [];
        const sp = card.querySelector('.speak');
        if (sp && !document.body.classList.contains('focus')) {
            sp.textContent = (ev.crit ? '暴击！' : '') + (corpus.length ? corpus[Math.floor(Math.random() * corpus.length)] : '谢谢！');
            sp.classList.add('show');
            setTimeout(() => sp.classList.remove('show'), 2600);
        }
        /* 升级 / 进化 */
        if (ev.evolve) { setTimeout(() => evolveShow(card, ev), 650); }
        else if (ev.levelup) {
            const b = $('lvBanner');
            b.textContent = `⬆️ ${ev.name} 升到 Lv.${ev.level} 啦！`;
            b.classList.add('show'); sLv();
            card.classList.remove('gold'); void card.offsetWidth; card.classList.add('gold');
            setTimeout(() => b.classList.remove('show'), 2200);
        }
        const ef = document.createElement('div');
        ef.className = 'expfloat'; ef.style.left = (card.getBoundingClientRect().left + 70) + 'px';
        ef.style.top = (card.getBoundingClientRect().top + 20) + 'px';
        ef.style.color = ev.crit ? '#e17055' : '#00b894';
        ef.textContent = (ev.crit ? '暴击 ' : '') + '+' + ev.exp;
        document.body.appendChild(ef); setTimeout(() => ef.remove(), 1200);
    });
    if (shownEvents.size > 400) shownEvents = new Set([...shownEvents].slice(-200));
}
function evolveShow(card, ev) {
    const j = S;
    const theme = j.theme || {};
    const s = j.students.find(x => x.id === ev.sid);
    const petDef = (theme.pets || []).find(p => p.id === (s ? s.petId : '')) || { id: 'duck', name: '宠物', stages: ['', '', '', ''] };
    $('evoPet').innerHTML = renderPet(theme, petDef, ev.stage, {});
    $('evoWho').textContent = (s ? (s.nickname || s.name) : '') + ' 的' + (petDef.name || '宠物') + ' 进化啦！';
    $('evoSub').textContent = '✨ ' + STAGE_NAMES[ev.stage] + ' · ' + (petDef.title || '') + ' ✨';
    const layer = $('evoLayer');
    layer.classList.add('show'); sEvo();
    confetti(80);
    setTimeout(() => layer.classList.remove('show'), 3400);
}
function confetti(n) {
    const cs = ['#ff6b6b', '#ffa502', '#ffd32a', '#2ed573', '#1e90ff', '#a55eea', '#ff7f50'];
    for (let i = 0; i < n; i++) { const c = document.createElement('i'); c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw'; c.style.background = cs[i % cs.length];
        c.style.animationDelay = Math.random() * .8 + 's'; c.style.animationDuration = 2 + Math.random() * 1.5 + 's';
        c.style.position = 'fixed'; c.style.top = '-16px'; c.style.width = '11px'; c.style.height = '16px';
        c.style.borderRadius = '3px'; c.style.zIndex = 96; c.style.pointerEvents = 'none';
        c.style.animation = `cfall ${2 + Math.random() * 1.5}s linear forwards`;
        document.body.appendChild(c); setTimeout(() => c.remove(), 4200); }
}
const st = document.createElement('style');
st.textContent = '@keyframes cfall { to { transform: translateY(108vh) rotate(720deg); } }';
document.head.appendChild(st);

/* ================= 启动轮询 ================= */
poll();
setInterval(poll, 2000);
applyFocus();
</script>
</body>
</html>
