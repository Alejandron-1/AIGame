<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>比多少 · 四人争霸赛</title>
<style>
  /* ============ 基础：全屏自适应，无滚动条（同《比大小》1920×1080 舞台） ============ */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#FFF7E8;
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI Emoji","Segoe UI Symbol",sans-serif; user-select:none;
    -webkit-user-select:none; touch-action:manipulation; }
  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:center center; overflow:hidden;
    background:linear-gradient(180deg,#FFFDF6 0%,#FFF3DC 100%); }

  /* ============ 顶栏：标题 + 轮次/题号 ============ */
  #topbar { position:absolute; left:0; top:22px; width:100%; display:flex;
    align-items:center; justify-content:center; gap:30px; }
  #title { font-size:54px; font-weight:bold; color:#5A4632; letter-spacing:6px; }
  .pill { font-size:28px; font-weight:bold; color:#A08B6C; background:#FFFFFF;
    border-radius:30px; padding:8px 26px; border:3px solid #F2DFB9; }
  #tools { position:absolute; right:34px; top:26px; display:flex; gap:12px; z-index:6; }
  .toolBtn { border:3px solid #F2DFB9; background:#FFFFFF; color:#A08B6C;
    font-size:22px; font-weight:bold; padding:8px 20px; border-radius:30px; cursor:pointer;
    font-family:inherit; }
  .toolBtn:active { transform:translateY(2px); }

  /* ============ 题目大框：上下两行图形（课本练习同款） ============ */
  #qbox { position:absolute; left:210px; top:112px; width:1500px; height:450px;
    background:#FFFFFF; border:6px solid #5A4632; border-radius:32px;
    box-shadow:0 10px 0 #EAD9A8; display:flex; flex-direction:column;
    justify-content:center; gap:16px; padding:20px 44px; }
  .qrow { height:186px; display:flex; flex-wrap:wrap; align-content:center;
    justify-content:center; gap:14px 30px; }
  .qobj { line-height:0; animation:pop .35s backwards; }
  .qobj svg { display:block; }
  @keyframes pop { from{transform:scale(0);} to{transform:scale(1);} }
  .rowNum { position:absolute; right:30px; font-size:44px; font-weight:bold;
    color:#5A4632; visibility:hidden; }
  #numTop { top:100px; }
  #numBot { bottom:100px; }
  .rowNum.show { visibility:visible; animation:pop .35s; }

  /* ============ 式子行：☆ 比 ○ （　） ============ */
  #qline { position:absolute; left:0; top:576px; width:100%; height:64px;
    display:flex; align-items:center; justify-content:center; gap:20px;
    font-size:54px; font-weight:bold; color:#5A4632; }
  #qline .qliIcon { line-height:0; }
  #qline #ansSlot { font-size:58px; font-weight:bold; color:#C9B89A; min-width:120px;
    text-align:center; }
  #qline #ansSlot.ok { color:#4CAF50; animation:pop .4s; }

  /* 计时条 */
  #timerBar { position:absolute; left:460px; top:648px; width:1000px; height:16px;
    background:#F2E4C8; border:3px solid #F2DFB9; border-radius:99px; overflow:hidden; }
  #timerFill { height:100%; width:100%; border-radius:99px;
    background:linear-gradient(90deg,#8FD486,#F2C94C); }
  #timerFill.hurry { background:linear-gradient(90deg,#FFB199,#FF6B6B); }

  /* ============ 四个选手区 ============ */
  #zones { position:absolute; left:120px; top:690px; width:1680px; height:378px;
    display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:24px; }
  .zone { position:relative; background:#FFFFFF; border:6px solid var(--c);
    border-radius:36px; padding:14px 16px; display:flex; flex-direction:column;
    gap:10px; transition:opacity .25s; }
  .zone.dim { opacity:.55; }
  .zhead { display:flex; align-items:center; justify-content:center; gap:10px; height:56px; }
  .zhead .ava { width:46px; height:46px; border-radius:14px; background:var(--c);
    color:#fff; font-size:26px; font-weight:bold; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; }
  .zhead .nm { font-size:30px; font-weight:bold; color:var(--c); }
  .zhead .sc { margin-left:auto; background:var(--c); color:#fff; border-radius:999px;
    padding:2px 22px; font-size:32px; font-weight:bold; min-width:72px; text-align:center; }
  .sc.pop { animation:pop .4s; }
  .gain { position:absolute; right:22px; top:60px; font-size:38px; font-weight:bold;
    color:#4CAF50; animation:floatUp .9s forwards; pointer-events:none; z-index:3; }
  @keyframes floatUp { from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-44px);} }
  .opts { display:flex; flex-direction:column; gap:10px; flex:1; }
  .opt { position:relative; flex:1; border:none; border-radius:24px; cursor:pointer;
    font-size:42px; font-weight:bold; color:#fff; font-family:inherit;
    box-shadow:0 8px 0 rgba(0,0,0,.18); transition:transform .08s; }
  .opt:active { transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.18); }
  .opt.same { background:#5CB85C; box-shadow:0 8px 0 #449944; }
  .opt.more { background:#FF9F43; box-shadow:0 8px 0 #D97F2B; }
  .opt.less { background:#5AB0E2; box-shadow:0 8px 0 #3E8CBF; }
  .opt .key { position:absolute; right:16px; top:50%; transform:translateY(-50%);
    font-size:22px; font-weight:bold; background:rgba(255,255,255,.28);
    border-radius:10px; padding:2px 10px; }
  .opt.good { background:#4CAF50 !important; box-shadow:0 8px 0 #3D8B40 !important; animation:pop .35s; }
  .opt.wrong { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-12px);}
    50%{transform:translateX(12px);} 75%{transform:translateX(-8px);} }

  /* ============ 轻提示 ============ */
  #toast { position:absolute; left:50%; top:640px; transform:translateX(-50%); z-index:8;
    background:#A08B6C; color:#fff; font-size:28px; font-weight:bold;
    padding:9px 40px; border-radius:32px; visibility:hidden; white-space:nowrap; }

  /* ============ 遮罩层：开始 / 倒计时 / 结算 ============ */
  #overlay { position:absolute; inset:0; background:rgba(255,247,232,.97); z-index:20;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:24px; }
  #ovTitle { font-size:64px; font-weight:bold; color:#5A4632; letter-spacing:6px; }
  #ovBig { font-size:210px; font-weight:bold; color:#F2A93B; line-height:1; min-height:210px; }
  #ovBig.zoom { animation:zoom .5s; }
  @keyframes zoom { from{transform:scale(1.7);} to{transform:scale(1);} }
  #rank { display:flex; gap:24px; }
  .rk { width:300px; background:#FFFFFF; border:6px solid var(--c); border-radius:36px;
    padding:18px 10px; text-align:center; }
  .rk .medal { width:56px; height:56px; border-radius:50%; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:bold; color:#fff; }
  .medal.m1 { background:#F2C94C; box-shadow:0 4px 0 #D9A93B; }
  .medal.m2 { background:#B9C1D2; box-shadow:0 4px 0 #96A0B5; }
  .medal.m3 { background:#E8A06A; box-shadow:0 4px 0 #C97F4A; }
  .medal.m4 { background:#D5CBB8; box-shadow:0 4px 0 #B0A68F; }
  .rk .nm { font-size:28px; font-weight:bold; color:var(--c); margin:6px 0; }
  .rk .pts { font-size:42px; font-weight:bold; color:#5A4632; }
  .rk .st { font-size:22px; font-weight:bold; color:#D9913B; min-height:30px; }
  #ovSub { font-size:28px; font-weight:bold; color:#A08B6C; text-align:center; line-height:1.8; }
  #btnStart { border:none; cursor:pointer; width:420px; height:110px; border-radius:40px;
    font-size:44px; font-weight:bold; color:#fff; background:#FF9F43;
    box-shadow:0 10px 0 #D97F2B; transition:transform .1s; font-family:inherit; }
  #btnStart:active { transform:translateY(6px); box-shadow:0 4px 0 rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <div id="title">比 多 少</div>
    <div class="pill" id="roundTag">第 1 轮</div>
    <div class="pill" id="qTag">第 1 题 / 共 3 题</div>
  </div>
  <div id="tools">
    <button class="toolBtn" id="btnSound">声音：开</button>
    <button class="toolBtn" id="btnFull">全屏</button>
  </div>

  <div id="qbox">
    <div class="qrow" id="rowTop"></div>
    <div class="qrow" id="rowBot"></div>
    <div class="rowNum" id="numTop">5 个</div>
    <div class="rowNum" id="numBot">3 个</div>
  </div>

  <div id="qline"></div>

  <div id="timerBar"><div id="timerFill"></div></div>

  <div id="zones"></div>

  <div id="toast"></div>

  <div id="overlay">
    <div id="ovTitle">比 多 少 · 四人争霸赛</div>
    <div id="ovBig" style="display:none"></div>
    <div id="rank" style="display:none"></div>
    <div id="ovSub">四个色区各守一名选手 · 倒计时结束开始抢答<br>
      先看清下面的式子问的是<b style="color:#5A4632">哪种图形比哪种图形</b>，再数一数、比一比<br>
      最先答对 <b style="color:#4CAF50">+2 分</b>　其他答对 <b style="color:#4CAF50">+1 分</b>　答错本题禁手<br>
      答案只有三个：<b style="color:#5CB85C">一样多</b>　<b style="color:#FF9F43">多</b>　<b style="color:#5AB0E2">少</b></div>
    <button id="btnStart">开始比赛</button>
  </div>
</div>

<script>
'use strict';
/* ================================================================
 * 比多少 · 四人争霸赛（V2.1 · 课本练习布局 + 《比大小》画风）
 * 题面：一个大框里上下两行图形（星星/圆形/正方形/爱心/三角形），
 *       框下出式子"☆ 比 ○（　）"，跟课本"看图比多少"完全一致
 *       （式子里谁在前是随机的，孩子要先找到对应的那一行再比较）
 * 玩法：四人键盘抢答：最先答对 +2 分，其他答对 +1 分，答错本题禁手
 *       每轮 3 题，比分累计，轮末结算排名，无限续轮
 * 教师快捷键（隐藏）：空格=亮答案（提前结束本题）  R=换一题  Esc=返回目录
 *      遮罩界面按 空格/回车 = 点"开始/下一轮"
 * ================================================================ */

/* ---------------- CONFIG：改这里调难度 ---------------- */
var CONFIG = {
  MIN: 1,          // 每行数量下限
  MAX_ROUND0: 5,   // 第 1 轮数量上限
  MAX_ROUND1: 6,   // 第 2 轮数量上限
  MAX_ROUND2: 9,   // 第 3 轮起数量上限
  Q_TIME: 12,      // 每题抢答秒数
  FEEDBACK_MS: 2000, // 亮答案后停留毫秒
  TTS_RATE: 0.85
};

/* 图形池（配色同课本练习插图），可自由增删 */
var SHAPES = {
  star  : { name:'星星',   fill:'#a8c4e8', svg:'M50 6 L61 38 L95 38 L67 58 L78 92 L50 71 L22 92 L33 58 L5 38 L39 38 Z' },
  circle: { name:'圆形',   fill:'#8f8fe8', svg:'M50 8 A42 42 0 1 1 49.9 8 Z' },
  square: { name:'正方形', fill:'#8dc63f', svg:'M14 14 H86 V86 H14 Z' },
  heart : { name:'爱心',   fill:'#e84545', svg:'M50 88 C20 62 8 44 8 30 C8 16 20 8 31 8 C40 8 47 13 50 21 C53 13 60 8 69 8 C80 8 92 16 92 30 C92 44 80 62 50 88 Z' },
  tri   : { name:'三角形', fill:'#f5e042', svg:'M50 8 L94 88 H6 Z' }
};
var SHAPE_KEYS = ['star','circle','square','heart','tri'];

var ANAME = { same:'一样多', more:'多', less:'少' };

var PLAYERS = [
  { nm:'1号 小猴', no:'1', c:'#E8623C', kh:'A S D', keys:{KeyA:'same',KeyS:'more',KeyD:'less'} },
  { nm:'2号 小兔', no:'2', c:'#3E8CBF', kh:'J K L', keys:{KeyJ:'same',KeyK:'more',KeyL:'less'} },
  { nm:'3号 小熊', no:'3', c:'#58A85C', kh:'1 2 3', keys:{Digit1:'same',Digit2:'more',Digit3:'less'} },
  { nm:'4号 小猫', no:'4', c:'#9B6BD8', kh:'7 8 9', keys:{Digit7:'same',Digit8:'more',Digit9:'less'} }
];

/* ---------------- 状态 ---------------- */
var S = {
  state:'idle',          // idle countdown question feedback roundEnd
  round:0, qIdx:0,
  roundQs:[], curQ:null,
  first:null,            // 最先答对的选手下标
  answered:[false,false,false,false],
  scores:[0,0,0,0], stars:[0,0,0,0],
  gen:0                  // 代数戳：换题后作废旧的定时器
};
var tRemain=0, tTimer=null, lastTick=-1, soundOn=true;

/* ---------------- 工具 ---------------- */
function $(id){ return document.getElementById(id); }
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function maxCount(){ return S.round===0?CONFIG.MAX_ROUND0:(S.round===1?CONFIG.MAX_ROUND1:CONFIG.MAX_ROUND2); }

/* ---------------- 音效（Web Audio 合成，静默降级） ---------------- */
var AC=null;
function tone(freq,dur,delay,vol,type){
  if(!soundOn) return;
  try{
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); }
    if(!AC) return;
    if(AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.18, AC.currentTime+(delay||0));
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+(delay||0)+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(AC.currentTime+(delay||0));
    o.stop(AC.currentTime+(delay||0)+dur+0.05);
  }catch(e){}
}
function sndDing(){ tone(880,0.14,0,0.18,'triangle'); tone(1175,0.18,0.09,0.15,'triangle'); }
function sndGood(){ tone(523,0.14,0,0.2,'triangle'); tone(659,0.14,0.12,0.2,'triangle'); tone(784,0.24,0.24,0.2,'triangle'); }
function sndBad(){ tone(196,0.22,0,0.16,'square'); }
function sndTick(){ tone(1200,0.05,0,0.08,'sine'); }
function sndWin(){ [523,659,784,1046].forEach(function(f,i){ tone(f,0.22,i*0.13,0.16,'sine'); }); }

/* ---------------- 语音（zh-CN，静默降级） ---------------- */
function speak(txt){
  if(!soundOn) return;
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(txt);
    u.lang='zh-CN'; u.rate=CONFIG.TTS_RATE;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- 图标（SVG 图形，配色同课本插图） ---------------- */
function icon(key,px){
  var s=SHAPES[key];
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 100 100">'+
    '<path d="'+s.svg+'" fill="'+s.fill+'" stroke="#2b3850" stroke-width="4" stroke-linejoin="round"/></svg>';
}

/* ---------------- 出题 ---------------- */
function pickCount(){ return ri(CONFIG.MIN, maxCount()); }
function makeQ(){
  var i=ri(0,SHAPE_KEYS.length-1), j=ri(0,SHAPE_KEYS.length-2);
  if(j>=i) j++;
  var a=pickCount(), b=pickCount();
  if(a===b && Math.random()<0.5) b=(a % maxCount())+1;   // 适度降低相同率
  return { ka:SHAPE_KEYS[i], kb:SHAPE_KEYS[j], a:a, b:b,
    aTop:Math.random()<0.5,                 // 式子里排前面的图形，随机在上行或下行
    ans: a>b?'more':(a<b?'less':'same') };
}
function makeRound(){
  var qs=[];
  for(var i=0;i<3;i++){
    var q=makeQ(), tries=0;
    if(i===2 && qs.length===2 && qs[0].ans===qs[1].ans && qs[1].ans===q.ans){
      while(q.ans===qs[0].ans && tries<20){ q=makeQ(); tries++; }  // 避免一轮三题答案全同
    }
    qs.push(q);
  }
  return qs;
}

/* ---------------- 渲染：大框两行图形（数量不同大小不同，自动换行不溢出） ---------------- */
function shapeSize(n){ return n<=4 ? 170 : (n<=6 ? 140 : (n<=8 ? 115 : 100)); }
function renderRow(rowId, key, n){
  var g=$(rowId); g.innerHTML='';
  var size=shapeSize(n);
  for(var k=0;k<n;k++){
    var d=document.createElement('div');
    d.className='qobj';
    d.innerHTML=icon(key,size);
    d.style.animationDelay=(k*0.06)+'s';
    g.appendChild(d);
  }
}
function renderQuestion(){
  var q=S.curQ;
  renderRow('rowTop', q.aTop?q.ka:q.kb, q.aTop?q.a:q.b);
  renderRow('rowBot', q.aTop?q.kb:q.ka, q.aTop?q.b:q.a);
  $('qline').innerHTML=
    '<span class="qliIcon">'+icon(q.ka,64)+'</span>'+
    '<span>比</span>'+
    '<span class="qliIcon">'+icon(q.kb,64)+'</span>'+
    '<span>（</span><span id="ansSlot">？</span><span>）</span>';
  $('numTop').textContent=(q.aTop?q.a:q.b)+' 个';
  $('numBot').textContent=(q.aTop?q.b:q.a)+' 个';
  $('numTop').className='rowNum'; $('numBot').className='rowNum';
}

/* ---------------- 构建四个选手区 ---------------- */
function buildZones(){
  var wrap=$('zones'); wrap.innerHTML='';
  PLAYERS.forEach(function(p,i){
    var z=document.createElement('div');
    z.className='zone'; z.id='zone'+i; z.style.setProperty('--c',p.c);
    z.innerHTML=
      '<div class="zhead"><span class="ava">'+p.no+'</span><span class="nm">'+p.nm+'</span>'+
      '<span class="sc" id="sc'+i+'">0</span></div>'+
      '<div class="opts">'+
        '<button class="opt same"><span>一样多</span><span class="key">'+p.kh.charAt(0)+'</span></button>'+
        '<button class="opt more"><span>多</span><span class="key">'+p.kh.charAt(2)+'</span></button>'+
        '<button class="opt less"><span>少</span><span class="key">'+p.kh.charAt(4)+'</span></button>'+
      '</div>';
    (function(idx){
      z.querySelectorAll('.opt').forEach(function(b){
        b.addEventListener('pointerdown', function(ev){
          ev.preventDefault();
          answer(idx, b.classList.contains('same')?'same':(b.classList.contains('more')?'more':'less'));
        });
      });
    })(i);
    wrap.appendChild(z);
  });
}

/* ---------------- 遮罩层 ---------------- */
function showOverlay(title,big,withRank){
  $('overlay').style.display='flex';
  $('ovTitle').textContent=title;
  var b=$('ovBig');
  if(big!==null && big!==undefined){
    b.style.display='block'; b.textContent=big;
    b.classList.remove('zoom'); void b.offsetWidth; b.classList.add('zoom');
    $('ovSub').style.display='none'; $('btnStart').style.display='none';
  } else {
    b.style.display='none';
    $('ovSub').style.display='block'; $('btnStart').style.display='block';
  }
  var rk=$('rank');
  if(withRank){
    rk.style.display='flex'; rk.innerHTML='';
    var order=[0,1,2,3].sort(function(x,y){ return S.scores[y]-S.scores[x] || x-y; });
    order.forEach(function(pi,pos){
      var p=PLAYERS[pi];
      rk.innerHTML+='<div class="rk" style="--c:'+p.c+'">'+
        '<div class="medal m'+(pos+1)+'">'+(pos+1)+'</div>'+
        '<div class="nm">'+p.nm+'</div>'+
        '<div class="pts">'+S.scores[pi]+' 分</div>'+
        '<div class="st">'+(S.stars[pi] ? '最快 ×'+S.stars[pi] : '&nbsp;')+'</div></div>';
    });
  } else rk.style.display='none';
}
function hideOverlay(){ $('overlay').style.display='none'; }

function countdown(cb){
  S.state='countdown';
  showOverlay('第 '+(S.round+1)+' 轮','3',false);
  sndTick();
  var n=3;
  var t=setInterval(function(){
    n--;
    if(n>0){
      var b=$('ovBig'); b.textContent=n;
      b.classList.remove('zoom'); void b.offsetWidth; b.classList.add('zoom');
      sndTick();
    } else { clearInterval(t); hideOverlay(); cb(); }
  },800);
}

function startRound(){
  S.roundQs=makeRound(); S.qIdx=0;
  $('roundTag').textContent='第 '+(S.round+1)+' 轮';
  countdown(nextQuestion);
}

function nextQuestion(){
  S.gen++;
  S.curQ=S.roundQs[S.qIdx];
  S.first=null; S.answered=[false,false,false,false];
  renderQuestion();
  $('qTag').textContent='第 '+(S.qIdx+1)+' 题 / 共 3 题';
  PLAYERS.forEach(function(p,i){
    var z=$('zone'+i); z.classList.remove('dim');
    z.querySelectorAll('.opt').forEach(function(b){ b.classList.remove('good','wrong'); });
  });
  hideToast();
  // 抢答计时
  S.state='question';
  tRemain=CONFIG.Q_TIME; lastTick=-1;
  $('timerFill').style.width='100%'; $('timerFill').classList.remove('hurry');
  clearInterval(tTimer);
  var g=S.gen;
  tTimer=setInterval(function(){
    if(g!==S.gen){ clearInterval(tTimer); return; }
    tRemain-=0.1;
    $('timerFill').style.width=Math.max(0,tRemain/CONFIG.Q_TIME*100)+'%';
    if(tRemain<=4) $('timerFill').classList.add('hurry');
    var s=Math.ceil(tRemain);
    if(s<=3 && s>=1 && s!==lastTick){ lastTick=s; sndTick(); }
    if(tRemain<=0){ clearInterval(tTimer); endQuestion(); }
  },100);
}

/* ---------------- 抢答判定 ---------------- */
function answer(pi,a){
  if(S.state!=='question' || S.answered[pi]) return;
  S.answered[pi]=true;
  var z=$('zone'+pi);
  var btn=z.querySelector('.opt.'+a);
  if(a===S.curQ.ans){
    var gain=(S.first===null)?2:1;
    if(S.first===null) S.first=pi;
    S.scores[pi]+=gain;
    if(gain===2) S.stars[pi]++;
    var sc=$('sc'+pi); sc.textContent=S.scores[pi];
    sc.classList.remove('pop'); void sc.offsetWidth; sc.classList.add('pop');
    btn.classList.add('good');
    floatGain(pi, '+'+gain);
    sndDing();
  }else{
    btn.classList.add('wrong');
    sndBad();
  }
  z.classList.add('dim');
  if(S.answered.every(function(x){return x;})){
    clearInterval(tTimer);
    var g=S.gen;
    setTimeout(function(){ if(g===S.gen) endQuestion(); }, 550);
  }
}

function floatGain(pi,txt){
  var z=$('zone'+pi);
  var d=document.createElement('div');
  d.className='gain'; d.textContent=txt;
  z.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 950);
}

/* ---------------- 亮答案 ---------------- */
function endQuestion(){
  if(S.state!=='question') return;
  S.state='feedback';
  clearInterval(tTimer);
  var q=S.curQ;
  var slot=$('ansSlot');
  slot.textContent=ANAME[q.ans];
  slot.className='ok';
  $('numTop').className='rowNum show'; $('numBot').className='rowNum show';
  sndGood();
  var msg='正确答案：'+ANAME[q.ans];
  if(S.first!==null) msg+='　'+PLAYERS[S.first].nm+' 最先答对 +2';
  else msg+='　这题没人得分';
  showToast(msg);
  speak(SHAPES[q.ka].name+' '+q.a+' 个，'+SHAPES[q.kb].name+' '+q.b+' 个，'+
    (q.ans==='same' ? '它们一样多' : SHAPES[q.ka].name+'比'+SHAPES[q.kb].name+ANAME[q.ans]));
  var g=S.gen;
  setTimeout(function(){
    if(g!==S.gen) return;
    hideToast();
    S.qIdx++;
    if(S.qIdx<3) nextQuestion();
    else endRound();
  }, CONFIG.FEEDBACK_MS);
}

function endRound(){
  S.state='roundEnd';
  sndWin();
  showOverlay('第 '+(S.round+1)+' 轮 结束',null,true);
  $('ovSub').innerHTML='比分累计到下一轮 · 准备好了就继续！';
  $('btnStart').textContent='下一轮 ›';
  S.round++;
}

/* ---------------- 轻提示 ---------------- */
var toastTimer=null;
function showToast(txt){
  var t=$('toast');
  t.textContent=txt; t.style.visibility='visible';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.style.visibility='hidden'; }, 1800);
}
function hideToast(){ $('toast').style.visibility='hidden'; clearTimeout(toastTimer); }

/* ---------------- 1920×1080 自适应缩放 ---------------- */
function fit(){
  try{
    var s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    $('stage').style.transform='translate(-50%,-50%) scale('+s+')';
  }catch(e){}
}

/* ---------------- 初始化 ---------------- */
function init(){
  buildZones();

  $('btnSound').addEventListener('click',function(){
    soundOn=!soundOn;
    this.textContent=soundOn?'声音：开':'声音：关';
  });
  $('btnFull').addEventListener('click',function(){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });
  function startBtnClick(){
    if(S.state==='idle'||S.state==='roundEnd'){ hideOverlay(); startRound(); }
  }
  $('btnStart').addEventListener('click',startBtnClick);

  // 教师快捷键 + 四人抢答键（隐藏功能，不影响学生）
  document.addEventListener('keydown',function(ev){
    try{
      if(ev.repeat) return;
      if(ev.code==='Space'){
        ev.preventDefault();
        if(S.state==='question') endQuestion();               // 亮答案
        else if(S.state==='idle'||S.state==='roundEnd') startBtnClick();
        return;
      }
      if(ev.key==='Enter' && (S.state==='idle'||S.state==='roundEnd')){ startBtnClick(); return; }
      if(ev.key==='r'||ev.key==='R'){
        if(S.state==='question'){ S.roundQs[S.qIdx]=makeQ(); nextQuestion(); }
        return;
      }
      if(ev.key==='Escape'){ try{ window.location.href='../index.html'; }catch(e){} return; }
      if(S.state!=='question') return;
      PLAYERS.forEach(function(p,i){
        var a=p.keys[ev.code];
        if(a) answer(i,a);
      });
    }catch(e){}
  });

  fit();
  if(window.addEventListener) window.addEventListener('resize',fit);
  showOverlay('比 多 少 · 四人争霸赛',null,false);
}

/* 调试口：自动化测试读取/强制当前题（不影响游戏） */
window.__peek=function(){
  return S.curQ?{a:S.curQ.a,b:S.curQ.b,aTop:S.curQ.aTop,ans:S.curQ.ans}:null;
};
window.__state=function(){ return S.state; };
window.__force=function(a,b){
  if(!S.curQ) return null;
  S.curQ.a=a; S.curQ.b=b;
  S.curQ.ans=a>b?'more':(a<b?'less':'same');
  if(S.state==='question'){
    renderQuestion();
  }
  return window.__peek();
};

if(typeof window!=='undefined' && window.document) init();
</script>
