<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>🍭 转盘组数大比拼 · 同数对决版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #fde8c8 0%, #ffe0b5 100%);
      font-family: 'Fredoka', 'Comic Sans MS', '幼圆', 'YouYuan', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }
    .game-container {
      max-width: 750px;
      width: 100%;
      background: rgba(255, 250, 240, 0.9);
      backdrop-filter: blur(25px);
      border-radius: 80px 80px 60px 60px;
      box-shadow: 0 35px 55px rgba(0,0,0,0.15), inset 0 2px 15px rgba(255,255,240,0.8);
      padding: 20px 25px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #ffa94d;
      position: relative;
      z-index: 10;
    }
    h1 {
      font-size: 2.3rem;
      color: #c44f1c;
      text-shadow: 3px 3px 0 #ffd966;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff3cd;
      padding: 4px 25px;
      border-radius: 60px;
      box-shadow: 0 6px 0 #f0b27a;
    }
    h1 span {
      font-size: 1.8rem;
      background: #ff7f3f;
      color: white;
      padding: 4px 20px;
      border-radius: 40px;
      box-shadow: 0 4px 0 #b4450c;
    }
    .mode-bar {
      display: flex;
      gap: 10px;
      margin: 5px 0 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .mode-btn {
      background: #fff2d7;
      border: 3px solid #ffb26b;
      color: #b2471a;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d4903a;
      transition: 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mode-btn.active {
      background: #ff8c42;
      color: white;
      border-color: #d4581a;
      box-shadow: 0 4px 0 #9b3e10;
    }
    .difficulty-select {
      background: #fffae9;
      border-radius: 30px;
      padding: 5px 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #5d3a1a;
    }
    .difficulty-select select {
      font-size: 1rem;
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid #ffb26b;
      background: white;
      font-weight: bold;
      color: #bf4d1a;
    }
    .spin-area {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 5px 0;
    }
    .wheel-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 2.2s cubic-bezier(0.2, 0.85, 0.25, 1);
      box-shadow: 0 0 0 12px #ffb26b, 0 10px 25px rgba(0,0,0,0.25);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }
    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 24px solid transparent;
      border-right: 24px solid transparent;
      border-top: 38px solid #e85d26;
      filter: drop-shadow(0 6px 4px rgba(0,0,0,0.4));
      z-index: 10;
    }
    .pointer.wobble {
      animation: pointerWobble 0.15s infinite alternate ease-in-out;
    }
    @keyframes pointerWobble {
      from { transform: translateX(-50%) rotate(-2deg); }
      to { transform: translateX(-50%) rotate(2deg); }
    }
    .pointer::after {
      content: "";
      position: absolute;
      top: -44px;
      left: -12px;
      width: 24px;
      height: 24px;
      background: radial-gradient(circle, #fff 5%, #ffaa00 80%);
      border-radius: 50%;
      box-shadow: 0 0 10px gold;
    }
    .current-number-box {
      background: #fff5e6;
      border-radius: 50px;
      padding: 8px 24px;
      margin: 5px 0;
      font-size: 2.2rem;
      font-weight: bold;
      color: #b64516;
      border: 4px dashed #ff9f4b;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .turn-indicator {
      background: #ffe1b3;
      border-radius: 50px;
      padding: 6px 22px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #5c3714;
      box-shadow: 0 4px 0 #d4903a;
      border: 2px solid #ffb676;
      margin-bottom: 4px;
      text-align: center;
    }
    .players-row {
      display: flex;
      width: 100%;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .player-card {
      background: #ffecce;
      border-radius: 45px;
      padding: 14px 16px;
      flex: 1 1 190px;
      min-width: 170px;
      box-shadow: 0 10px 16px rgba(0,0,0,0.08);
      border: 3px solid #ff9f6b;
      transition: all 0.2s;
      position: relative;
    }
    .player-card.ai-card {
      background: #f0f8ff;
    }
    .player-card.p1-highlight {
      border: 5px solid #ff8c00;
      box-shadow: 0 0 28px #ff8c00, 0 10px 18px rgba(0,0,0,0.15);
    }
    .player-card.p2-highlight {
      border: 5px solid #00bcd4;
      box-shadow: 0 0 28px #00bcd4, 0 10px 18px rgba(0,0,0,0.15);
    }
    .player-name {
      font-size: 1.6rem;
      font-weight: bold;
      color: #4a2c1a;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff0d4;
      border-radius: 30px;
      padding: 4px 12px;
      position: relative;
    }
    .ai-bubble {
      position: absolute;
      top: -38px;
      right: -10px;
      background: white;
      border-radius: 25px;
      padding: 5px 14px;
      font-size: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border: 2px solid #ffaa5e;
      white-space: nowrap;
      animation: popBubble 0.3s ease-out;
    }
    @keyframes popBubble {
      0% { transform: scale(0); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .slots {
      display: flex;
      gap: 12px;
      margin: 12px 0 6px;
      justify-content: center;
    }
    .digit-slot {
      width: 65px;
      height: 80px;
      background: #fffef7;
      border-radius: 22px;
      border: 4px solid #ffb573;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: bold;
      color: #c45500;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.05);
      user-select: none;
      position: relative;
    }
    .digit-slot.filled {
      background: #ffedd6;
      border-color: #ff8c42;
      cursor: default;
      color: #5d3a1a;
    }
    .digit-slot.clickable {
      border: 5px solid #ff6d2e;
      background: #fff4e5;
      animation: pulse-giggle 0.7s infinite;
      cursor: pointer;
    }
    @keyframes pulse-giggle {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,110,40,0.5); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 14px rgba(255,110,40,0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,110,40,0); }
    }
    .slot-label {
      position: absolute;
      bottom: -22px;
      font-size: 0.8rem;
      color: #7b4d2c;
      font-weight: bold;
    }
    .score-badge {
      display: flex;
      gap: 12px;
      font-weight: bold;
      color: #5a3825;
      font-size: 1.1rem;
      background: #fff2df;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .btn {
      background: #ff984f;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 1.4rem;
      padding: 10px 28px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #c1541a, 0 6px 14px rgba(0,0,0,0.15);
      transition: 0.08s;
      margin: 5px;
      letter-spacing: 2px;
      border: 2px solid #ffc489;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c1541a, 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn:disabled {
      opacity: 0.5;
      transform: translateY(3px);
      box-shadow: 0 3px 0 #c1541a;
      cursor: not-allowed;
    }
    .new-round-btn {
      background: #8b6b4d;
      box-shadow: 0 6px 0 #5e4632;
      border-color: #dbbd9f;
      font-size: 1.2rem;
      padding: 8px 24px;
    }
    .footer-note {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #6b4b30;
      background: #fff3e1;
      padding: 4px 20px;
      border-radius: 30px;
      font-weight: bold;
    }

    .cute-popup-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.25); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; animation: fadeIn 0.3s ease;
    }
    .cute-popup {
      background: #fffef5; border-radius: 80px 80px 60px 60px;
      padding: 35px; max-width: 380px; width:85%; text-align: center;
      box-shadow: 0 30px 45px rgba(0,0,0,0.25), 0 0 0 8px #ffb87a;
      transform: scale(0) rotate(-5deg);
      animation: jumpPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      border: 4px dashed #ffaa5e; position: relative; z-index: 1100;
    }
    @keyframes jumpPop {
      0% { transform: scale(0) rotate(-8deg); opacity:0; }
      50% { transform: scale(1.15) rotate(3deg); opacity:1; }
      70% { transform: scale(0.9) rotate(-1deg); }
      85% { transform: scale(1.05) rotate(0.5deg); }
      100% { transform: scale(1) rotate(0deg); opacity:1; }
    }
    .popup-emoji { font-size: 5rem; }
    .popup-text { font-size: 1.8rem; font-weight:bold; color:#b1511b; }
    .popup-detail { background:#ffe8d4; border-radius:40px; padding:10px; margin:12px 0; }
    .popup-btn { background:#ff8c5a; border:none; color:white; font-weight:bold; font-size:1.3rem; padding:12px 28px; border-radius:50px; cursor:pointer; box-shadow:0 5px 0 #bd4f20; }
    #fireworksCanvas { position:fixed; top:0;left:0; width:100%;height:100%; pointer-events:none; z-index:1050; }
  </style>
</head>
<body>
<div class="game-container">
  <h1>🎡 转盘组数 <span>大比拼</span></h1>
  
  <div class="mode-bar">
    <button class="mode-btn active" id="twoPlayerBtn">👥 双人对战</button>
    <button class="mode-btn" id="aiModeBtn">🤖 挑战电脑</button>
    <div class="difficulty-select" id="difficultyContainer" style="display:none;">
      <span>难度：</span>
      <select id="difficultySelect">
        <option value="easy">😊 简单</option>
        <option value="normal" selected>🤔 普通</option>
        <option value="hard">🧠 困难</option>
      </select>
    </div>
  </div>

  <div class="spin-area">
    <div class="wheel-wrapper" id="wheelWrapper">
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>
    <div class="pointer" id="pointerElement"></div>
  </div>

  <div class="current-number-box">
    <span>🍬</span> <span id="currentDigitText">?</span>
  </div>

  <div class="turn-indicator" id="turnIndicator">转动转盘，双方同时使用数字</div>

  <button class="btn" id="spinButton">🎯 转动转盘</button>

  <div class="players-row">
    <div class="player-card" id="player1Card">
      <div class="player-name">🐼 玩家1</div>
      <div class="slots" id="player1Slots">
        <div class="digit-slot" data-player="0" data-index="0"><span class="slot-label">百位</span></div>
        <div class="digit-slot" data-player="0" data-index="1"><span class="slot-label">十位</span></div>
        <div class="digit-slot" data-player="0" data-index="2"><span class="slot-label">个位</span></div>
      </div>
      <div class="score-badge">🏆 胜: <span id="player1Wins">0</span></div>
    </div>
    <div class="player-card" id="player2Card">
      <div class="player-name" id="player2Name">🐨 玩家2</div>
      <div class="slots" id="player2Slots">
        <div class="digit-slot" data-player="1" data-index="0"><span class="slot-label">百位</span></div>
        <div class="digit-slot" data-player="1" data-index="1"><span class="slot-label">十位</span></div>
        <div class="digit-slot" data-player="1" data-index="2"><span class="slot-label">个位</span></div>
      </div>
      <div class="score-badge">🏆 胜: <span id="player2Wins">0</span></div>
    </div>
  </div>

  <button class="btn new-round-btn" id="newRoundButton">🔄 新的一局</button>
  <div class="footer-note">⭐ 一次转盘，共同数字！大数放百位，数字比较更精彩！</div>
</div>

<script>
  (function() {
    // ---------- 游戏状态 ----------
    const players = [
      { slots: [null, null, null], filledCount: 0, completed: false, wins: 0 },
      { slots: [null, null, null], filledCount: 0, completed: false, wins: 0 }
    ];
    let currentDigit = null;            // 当前转出的数字
    let digitUsedBy = [false, false];  // 当前数字是否已被各玩家使用
    let gameOver = false;
    let spinInProgress = false;
    let rotationAngle = 0;

    let gameMode = 'two'; // 'two' 或 'ai'
    let aiDifficulty = 'normal';

    const digitCenters = [-90, -50, -10, 30, 70, 110, 150, 190, 230];

    const wheelWrapper = document.getElementById('wheelWrapper');
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinButton = document.getElementById('spinButton');
    const currentDigitText = document.getElementById('currentDigitText');
    const turnIndicator = document.getElementById('turnIndicator');
    const pointerEl = document.getElementById('pointerElement');
    const player1Card = document.getElementById('player1Card');
    const player2Card = document.getElementById('player2Card');
    const player2Name = document.getElementById('player2Name');
    const player1WinsSpan = document.getElementById('player1Wins');
    const player2WinsSpan = document.getElementById('player2Wins');
    const newRoundButton = document.getElementById('newRoundButton');
    const allSlots = document.querySelectorAll('.digit-slot');

    const twoPlayerBtn = document.getElementById('twoPlayerBtn');
    const aiModeBtn = document.getElementById('aiModeBtn');
    const difficultyContainer = document.getElementById('difficultyContainer');
    const difficultySelect = document.getElementById('difficultySelect');

    function drawWheel() {
      const width = canvas.width, height = canvas.height;
      const cx = width/2, cy = height/2, r = 140;
      const colors = ['#FF7777','#FFB347','#FFD93D','#6BCB77','#4D96FF','#9B59B6','#FF8C42','#45B7D1','#F7DC6F'];
      ctx.clearRect(0,0,width,height);
      for(let i=0;i<9;i++){
        let start = (digitCenters[i]-20)*Math.PI/180;
        let end = (digitCenters[i]+20)*Math.PI/180;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,start,end);
        ctx.closePath();
        ctx.fillStyle=colors[i];
        ctx.fill();
        ctx.strokeStyle='#FFF5E1';
        ctx.lineWidth=3;
        ctx.stroke();
        let angle = digitCenters[i]*Math.PI/180;
        let tx = cx+Math.cos(angle)*r*0.7;
        let ty = cy+Math.sin(angle)*r*0.7;
        ctx.save();
        ctx.translate(tx,ty);
        ctx.rotate(angle+Math.PI/2);
        ctx.font='bold 26px "Fredoka","Comic Sans MS"';
        ctx.fillStyle='#2E1A0F';
        ctx.shadowColor='#fff';
        ctx.shadowBlur=5;
        ctx.fillText((i+1).toString(),-14,10);
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(cx,cy,28,0,2*Math.PI);
      ctx.fillStyle='#FFF3E0';
      ctx.fill();
      ctx.strokeStyle='#FF8F00';
      ctx.lineWidth=5;
      ctx.stroke();
      ctx.font='bold 20px "Fredoka"';
      ctx.fillStyle='#BF360C';
      ctx.shadowBlur=0;
      ctx.fillText('GO',cx-20,cy+8);
    }
    drawWheel();

    // ---------- AI 决策 ----------
    function aiDecide(slots, digit) {
      const emptyIndices = slots.map((v,i) => v===null ? i : -1).filter(i => i!==-1);
      if (emptyIndices.length === 1) return emptyIndices[0];

      let mistakeChance = 0;
      if (aiDifficulty === 'easy') mistakeChance = 0.35;
      else if (aiDifficulty === 'normal') mistakeChance = 0.12;

      let bestIndex = null;
      if (digit >= 7 && slots[0] === null) {
        bestIndex = 0;
      } else if (digit <= 3 && slots[2] === null) {
        bestIndex = 2;
      } else if (digit <= 3 && slots[1] === null && slots[2] !== null) {
        bestIndex = 1;
      } else if (digit >= 5 && slots[0] === null && emptyIndices.length <= 2) {
        bestIndex = 0;
      } else {
        bestIndex = emptyIndices[0];
      }

      if (Math.random() < mistakeChance && emptyIndices.length > 1) {
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      }
      return bestIndex;
    }

    function aiPlace() {
      if (gameOver || !currentDigit || digitUsedBy[1]) return;
      const chosenIndex = aiDecide(players[1].slots, currentDigit);
      showAiBubble(chosenIndex);
      setTimeout(() => {
        if (gameOver || !currentDigit || digitUsedBy[1]) return;
        placeDigit(1, chosenIndex);
        removeAiBubble();
      }, 600);
    }

    function showAiBubble(chosenIndex) {
      removeAiBubble();
      const labels = ['百位', '十位', '个位'];
      const bubble = document.createElement('div');
      bubble.className = 'ai-bubble';
      bubble.id = 'aiBubble';
      bubble.textContent = `💭 ${labels[chosenIndex]}！`;
      const nameEl = player2Name;
      nameEl.style.position = 'relative';
      nameEl.appendChild(bubble);
    }

    function removeAiBubble() {
      const old = document.getElementById('aiBubble');
      if (old) old.remove();
    }

    // ---------- 核心：放置数字 ----------
    function placeDigit(playerIdx, slotIdx) {
      if (gameOver) return false;
      if (currentDigit === null) return false;
      if (digitUsedBy[playerIdx]) return false;      // 该玩家已使用当前数字
      if (players[playerIdx].completed) return false;
      if (players[playerIdx].slots[slotIdx] !== null) return false;

      // 填入数字
      players[playerIdx].slots[slotIdx] = currentDigit;
      players[playerIdx].filledCount++;
      digitUsedBy[playerIdx] = true;
      
      if (players[playerIdx].filledCount === 3) {
        players[playerIdx].completed = true;
      }

      // 检查双方是否都已使用当前数字
      if (digitUsedBy[0] && digitUsedBy[1]) {
        currentDigit = null;
        digitUsedBy = [false, false];
      }

      // 判断游戏结束
      if (players[0].completed && players[1].completed) {
        gameOver = true;
        showResultPopup();
      }

      updateUI();

      // 如果是AI模式，且玩家1还没用数字，且当前数字仍有效，自动触发AI
      if (gameMode === 'ai' && currentDigit !== null && !digitUsedBy[1] && !gameOver) {
        aiPlace();
      }

      return true;
    }

    // ---------- UI更新 ----------
    function updateUI() {
      // 更新所有格子
      allSlots.forEach(slot => {
        let p = parseInt(slot.dataset.player);
        let idx = parseInt(slot.dataset.index);
        let val = players[p].slots[idx];
        slot.textContent = val !== null ? val : '';
        if(val !== null) {
          slot.classList.add('filled');
          slot.classList.remove('clickable');
        } else {
          slot.classList.remove('filled','clickable');
        }
        if(!slot.querySelector('.slot-label')){
          let lbl = document.createElement('span');
          lbl.className='slot-label';
          lbl.textContent = ['百位','十位','个位'][idx];
          slot.appendChild(lbl);
        }
      });

      currentDigitText.textContent = currentDigit !== null ? currentDigit : '?';

      // 高亮卡片：双方都可以操作，所以同时高亮（或根据未使用状态）
      player1Card.classList.remove('p1-highlight', 'p2-highlight');
      player2Card.classList.remove('p1-highlight', 'p2-highlight');
      if (!gameOver) {
        if (!players[0].completed && currentDigit !== null && !digitUsedBy[0]) {
          player1Card.classList.add('p1-highlight');
        }
        if (!players[1].completed && currentDigit !== null && !digitUsedBy[1]) {
          player2Card.classList.add('p2-highlight');
        }
      }

      // 回合文字
      if (gameOver) {
        turnIndicator.textContent = '🎉 本局结束';
      } else if (currentDigit === null) {
        turnIndicator.textContent = '转动转盘，双方共同使用数字';
      } else {
        const left = digitUsedBy[0] ? '✅' : '❓';
        const right = digitUsedBy[1] ? '✅' : '❓';
        const p1 = '🐼玩家1' + left;
        const p2 = (gameMode === 'ai' ? '🤖电脑' : '🐨玩家2') + right;
        turnIndicator.textContent = `数字${currentDigit}：${p1}  ${p2}`;
      }

      // 转动按钮
      const canSpin = !spinInProgress && !gameOver && currentDigit === null && !(players[0].completed && players[1].completed);
      spinButton.disabled = !canSpin;

      // 可点击格子：只对未完成且未使用当前数字的玩家
      if (currentDigit !== null && !gameOver) {
        [0, 1].forEach(pIdx => {
          if (!players[pIdx].completed && !digitUsedBy[pIdx]) {
            players[pIdx].slots.forEach((v, i) => {
              if (v === null) {
                let slot = document.querySelector(`.digit-slot[data-player="${pIdx}"][data-index="${i}"]`);
                if (slot) slot.classList.add('clickable');
              }
            });
          }
        });
      }

      player1WinsSpan.textContent = players[0].wins;
      player2WinsSpan.textContent = players[1].wins;

      if (gameMode === 'ai') {
        player2Card.classList.add('ai-card');
        player2Name.innerHTML = '🤖 电脑';
      } else {
        player2Card.classList.remove('ai-card');
        player2Name.innerHTML = '🐨 玩家2';
      }
    }

    function getDigitFromAngle(deg) {
      let mod = ((deg%360)+360)%360;
      for(let i=0;i<9;i++){
        let actual = (digitCenters[i]+mod)%360;
        if(actual<0) actual+=360;
        let diff = Math.abs(actual-270);
        if(diff>180) diff=360-diff;
        if(diff<=20) return i+1;
      }
      let best=1, min=Infinity;
      for(let i=0;i<9;i++){
        let actual = (digitCenters[i]+mod)%360;
        if(actual<0) actual+=360;
        let diff = Math.abs(actual-270);
        if(diff>180) diff=360-diff;
        if(diff<min){ min=diff; best=i+1; }
      }
      return best;
    }

    function spinWheel() {
      if (spinInProgress || gameOver || currentDigit !== null || (players[0].completed && players[1].completed)) return;
      
      let target = Math.floor(Math.random()*9)+1;
      let targetCenter = digitCenters[target-1];
      let desired = (270 - targetCenter)%360;
      if(desired<0) desired+=360;
      let offset = (Math.random()-0.5)*18;
      let delta = 7*360 + desired + offset;
      let targetTotal = rotationAngle + delta;

      spinInProgress = true;
      pointerEl.classList.add('wobble');
      updateUI();

      wheelWrapper.style.transition = 'transform 2.2s cubic-bezier(0.2, 0.85, 0.25, 1)';
      wheelWrapper.style.transform = `rotate(${targetTotal}deg)`;
      rotationAngle = targetTotal;

      const onEnd = (e) => {
        if(e.propertyName === 'transform'){
          wheelWrapper.removeEventListener('transitionend', onEnd);
          spinInProgress = false;
          pointerEl.classList.remove('wobble');
          let digit = getDigitFromAngle(rotationAngle);
          currentDigit = digit;
          digitUsedBy = [false, false];
          updateUI();

          // AI模式：如果玩家1已完成或即将完成但没填，AI可能先行动（玩家手动触发）
          if (gameMode === 'ai' && !gameOver) {
            // 如果玩家1已经完成，AI应该自己用数字
            if (players[0].completed && !players[1].completed) {
              aiPlace();
            }
            // 否则等待玩家点击
          }
        }
      };
      wheelWrapper.addEventListener('transitionend', onEnd);
    }

    // ---------- 烟花与弹窗 ----------
    let fireworksCanvas = null, fireworksCtx = null, fireworksAnimationId = null, particles = [];

    function initFireworksCanvas() {
      if (fireworksCanvas) return;
      fireworksCanvas = document.createElement('canvas');
      fireworksCanvas.id = 'fireworksCanvas';
      document.body.appendChild(fireworksCanvas);
      fireworksCanvas.width = window.innerWidth;
      fireworksCanvas.height = window.innerHeight;
      fireworksCtx = fireworksCanvas.getContext('2d');
    }

    function createFireworkBurst(x, y) {
      const count = 40 + Math.floor(Math.random() * 30);
      const colors = ['#FFD700','#FF6B6B','#4D96FF','#FF8C42','#9B59B6','#6BCB77','#FFB347'];
      for (let i=0;i<count;i++) {
        let angle = (Math.PI*2*i)/count + Math.random()*0.5;
        let speed = 2+Math.random()*6;
        particles.push({ x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, alpha:1, color:colors[Math.floor(Math.random()*colors.length)], size:2+Math.random()*4, decay:0.015+Math.random()*0.02 });
      }
    }

    function launchFireworks() {
      initFireworksCanvas();
      const w=window.innerWidth, h=window.innerHeight;
      [100,350,600,850,1100,1400].forEach((delay,i)=>{
        setTimeout(()=>{ if(fireworksCanvas) createFireworkBurst(w*(0.2+0.2*i), h*(0.3+0.15*i)); }, delay);
      });
      function animate() {
        if(!fireworksCtx) return;
        fireworksCtx.clearRect(0,0,fireworksCanvas.width,fireworksCanvas.height);
        for(let i=particles.length-1;i>=0;i--){
          let p=particles[i];
          p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.alpha-=p.decay;
          if(p.alpha<=0) { particles.splice(i,1); continue; }
          fireworksCtx.globalAlpha=p.alpha; fireworksCtx.fillStyle=p.color;
          fireworksCtx.beginPath(); fireworksCtx.arc(p.x,p.y,p.size,0,Math.PI*2); fireworksCtx.fill();
        }
        fireworksAnimationId=requestAnimationFrame(animate);
      }
      animate();
    }

    function removeFireworks() {
      if(fireworksAnimationId) cancelAnimationFrame(fireworksAnimationId);
      if(fireworksCanvas) { document.body.removeChild(fireworksCanvas); fireworksCanvas=fireworksCtx=null; }
      particles=[];
    }

    function showResultPopup() {
      const n1=parseInt(players[0].slots.join(''),10), n2=parseInt(players[1].slots.join(''),10);
      let emoji='', title='', detail='';
      if(n1>n2) { players[0].wins++; emoji='🐼🎉'; title='玩家1 获胜！'; detail=`🐼 ${n1} > ${n2} 🤖`; }
      else if(n2>n1) { players[1].wins++; emoji='🤖🎉'; title=(gameMode==='ai'?'电脑 获胜！':'玩家2 获胜！'); detail=`🤖 ${n2} > ${n1} 🐼`; }
      else { emoji='🤝✨'; title='平局！'; detail=`都是 ${n1}`; }
      updateUI();
      launchFireworks();
      const overlay=document.createElement('div'); overlay.className='cute-popup-overlay';
      overlay.innerHTML=`<div class="cute-popup"><div class="popup-emoji">${emoji}</div><div class="popup-text">${title}</div><div class="popup-detail">${detail}</div><button class="popup-btn" id="closePopupBtn">🎈 继续玩</button></div>`;
      document.body.appendChild(overlay);
      document.getElementById('closePopupBtn').addEventListener('click', ()=>{
        document.body.removeChild(overlay); removeFireworks();
      });
    }

    function newRound() {
      players.forEach(p=>{ p.slots=[null,null,null]; p.filledCount=0; p.completed=false; });
      currentDigit = null;
      digitUsedBy = [false, false];
      gameOver = false;
      spinInProgress = false;
      pointerEl.classList.remove('wobble');
      removeAiBubble();
      wheelWrapper.style.transition='none';
      wheelWrapper.style.transform=`rotate(${rotationAngle}deg)`;
      removeFireworks();
      updateUI();
    }

    function setMode(mode) {
      gameMode = mode;
      if (mode === 'two') {
        twoPlayerBtn.classList.add('active');
        aiModeBtn.classList.remove('active');
        difficultyContainer.style.display = 'none';
        player2Name.innerHTML = '🐨 玩家2';
        player2Card.classList.remove('ai-card');
      } else {
        aiModeBtn.classList.add('active');
        twoPlayerBtn.classList.remove('active');
        difficultyContainer.style.display = 'flex';
        player2Name.innerHTML = '🤖 电脑';
        player2Card.classList.add('ai-card');
      }
      newRound();
    }

    twoPlayerBtn.addEventListener('click', ()=> setMode('two'));
    aiModeBtn.addEventListener('click', ()=> setMode('ai'));
    difficultySelect.addEventListener('change', (e)=> { aiDifficulty = e.target.value; });

    spinButton.addEventListener('click', spinWheel);
    allSlots.forEach(slot => {
      slot.addEventListener('click', function(){
        const pIdx = parseInt(this.dataset.player);
        const sIdx = parseInt(this.dataset.index);
        // AI模式下禁止手动点击电脑格子
        if (gameMode === 'ai' && pIdx === 1) return;
        placeDigit(pIdx, sIdx);
      });
    });
    newRoundButton.addEventListener('click', newRound);

    wheelWrapper.style.transform = 'rotate(0deg)';
    updateUI();
  })();
</script>
</body>
</html>
