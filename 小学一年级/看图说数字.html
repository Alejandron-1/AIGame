<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔢 看图说数字 - 一年级10以内数数练习</title>
<style>
/* ===== 全局 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    /* 浅色护眼课本风（需求文档指定） */
    background: linear-gradient(180deg, #fdf9ef 0%, #f6efdd 100%);
    min-height: 100vh;
    color: #2c3e50;
    user-select: none;
    -webkit-user-select: none;
}
button { font-family: inherit; cursor: pointer; border: none; }
.wrap { max-width: 1150px; margin: 0 auto; padding: 22px 30px 40px; }

/* ===== 顶部：标题 + 重新出题 ===== */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.top h1 { font-size: clamp(28px, 3.4vw, 44px); font-weight: 800; letter-spacing: 3px; }
.top h1 small { font-size: clamp(13px, 1.3vw, 17px); color: #a08b5f; margin-left: 12px; letter-spacing: 1px; font-weight: normal; }
#btnNew {
    padding: 12px 24px; border-radius: 14px; font-size: clamp(15px, 1.5vw, 19px);
    font-weight: bold; color: #fff; background: #e67e22;
    box-shadow: 0 3px 0 #b3591a; transition: all .15s;
}
#btnNew:hover { filter: brightness(1.08); }
#btnNew:active { transform: translateY(2px); box-shadow: none; }

/* ===== 题干提示区 ===== */
.qtip {
    margin: 20px auto 0; text-align: center;
    font-size: clamp(17px, 1.9vw, 24px); font-weight: 700; color: #6b5b3e;
    letter-spacing: 2px;
}

/* ===== 图形展示区 ===== */
.picbox {
    margin: 22px auto 0; min-height: 300px;
    background: #fff; border: 3px solid #f0e3c4; border-radius: 24px;
    box-shadow: 0 6px 20px rgba(160, 130, 70, .12);
    display: flex; align-items: center; justify-content: center;
    padding: 26px;
}
.pics {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(10px, 1.6vw, 22px); max-width: 780px;
}
.pic { width: clamp(78px, 9vw, 118px); flex-shrink: 0; }
.pic svg { display: block; width: 100%; height: auto; }
/* 每行最多5个：第5个后面换行（用透明占位不好做，直接限制容器宽即可，5×(118+22)≈700） */

/* ===== 反馈文字 ===== */
.feedback {
    height: 46px; margin-top: 16px; text-align: center;
    font-size: clamp(21px, 2.3vw, 30px); font-weight: 800; letter-spacing: 3px;
    transition: opacity .3s; opacity: 0;
}
.feedback.show { opacity: 1; }
.feedback.good { color: #1e8449; }
.feedback.good.click { cursor: pointer; animation: breathe 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.04); } }
.feedback.bad { color: #b9770e; }

/* ===== 数字键盘 ===== */
.keypad {
    margin: 14px auto 0; display: flex; flex-wrap: wrap;
    justify-content: center; gap: 14px; max-width: 760px;
}
.key {
    width: clamp(88px, 9.4vw, 116px); height: clamp(64px, 7vw, 86px);
    border-radius: 18px; font-size: clamp(26px, 2.9vw, 40px); font-weight: 800;
    color: #2c3e50; background: #fff;
    border: 3px solid #eadfc4; box-shadow: 0 4px 0 rgba(160, 130, 70, .25);
    transition: all .1s;
}
.key:hover { border-color: #e67e22; background: #fffdf6; }
.key:active:not(:disabled) { transform: scale(.92); box-shadow: none; }
.key:disabled { opacity: .55; cursor: default; }
.key.wide { width: clamp(190px, 20vw, 246px); }   /* 「10」加宽按键 */

/* ===== Toast ===== */
#toast {
    position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%);
    background: rgba(44, 62, 80, .92); color: #fff;
    padding: 12px 24px; border-radius: 12px; font-size: 15.5px; z-index: 60;
    opacity: 0; pointer-events: none; transition: all .25s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }
</style>
</head>
<body>
<div class="wrap">
  <!-- 顶部 -->
  <div class="top">
    <h1>🔢 看图说数字<small>10以内数的认识 · 数形结合</small></h1>
    <button id="btnNew">🔄 重新出题</button>
  </div>

  <!-- 题干提示 -->
  <div class="qtip">数一数下面有多少个图形，点击数字回答</div>

  <!-- 图形展示区 -->
  <div class="picbox"><div class="pics" id="pics"></div></div>

  <!-- 反馈文字（点击可进入下一题） -->
  <div class="feedback" id="feedback"></div>

  <!-- 数字键盘 -->
  <div class="keypad" id="keypad"></div>
</div>

<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ================= 可调参数 ================= */
const MIN_N = 1, MAX_N = 10;      // 出题数字范围（贴合10以内数数教学）

/* ================= 卡通图标库（内联SVG，想换图案改这里） =================
   前5种对应参考原图：小熊、小白花、松树、小黄鸡、蝴蝶 */
const ICONS = {
    bear: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="26" cy="22" r="12" fill="#a9744f"/><circle cx="74" cy="22" r="12" fill="#a9744f"/>
        <circle cx="26" cy="22" r="6" fill="#e8b98d"/><circle cx="74" cy="22" r="6" fill="#e8b98d"/>
        <circle cx="50" cy="50" r="34" fill="#c98d5f"/>
        <ellipse cx="50" cy="60" rx="17" ry="13" fill="#f2d3ae"/>
        <circle cx="38" cy="42" r="4.5" fill="#3b2a1a"/><circle cx="62" cy="42" r="4.5" fill="#3b2a1a"/>
        <circle cx="39.5" cy="40.5" r="1.5" fill="#fff"/><circle cx="63.5" cy="40.5" r="1.5" fill="#fff"/>
        <ellipse cx="50" cy="57" rx="4.5" ry="3.5" fill="#3b2a1a"/>
        <path d="M44 66 Q50 71 56 66" stroke="#3b2a1a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>`,
    flower: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g fill="#fff" stroke="#e8e0c8" stroke-width="2">
            <ellipse cx="50" cy="24" rx="14" ry="17"/><ellipse cx="50" cy="76" rx="14" ry="17"/>
            <ellipse cx="24" cy="50" rx="17" ry="14"/><ellipse cx="76" cy="50" rx="17" ry="14"/>
            <ellipse cx="31" cy="31" rx="12" ry="12"/><ellipse cx="69" cy="31" rx="12" ry="12"/>
            <ellipse cx="31" cy="69" rx="12" ry="12"/><ellipse cx="69" cy="69" rx="12" ry="12"/>
        </g>
        <circle cx="50" cy="50" r="14" fill="#ffd83d"/><circle cx="50" cy="50" r="8" fill="#ffb200"/>
    </svg>`,
    tree: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="43" y="70" width="14" height="24" rx="4" fill="#8d5524"/>
        <path d="M50 6 L74 40 L62 40 L82 66 L18 66 L38 40 L26 40Z" fill="#2e9e5b"/>
        <path d="M50 14 L68 40 L32 40Z" fill="#3dbb6f"/>
    </svg>`,
    chick: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="54" r="34" fill="#ffd83d"/>
        <path d="M30 20 Q40 8 54 14 Q46 18 44 26 Q36 26 30 20Z" fill="#ffb200"/>
        <circle cx="38" cy="48" r="4" fill="#3b2a1a"/><circle cx="62" cy="48" r="4" fill="#3b2a1a"/>
        <circle cx="39.3" cy="46.7" r="1.3" fill="#fff"/><circle cx="63.3" cy="46.7" r="1.3" fill="#fff"/>
        <path d="M44 58 L56 58 L50 66Z" fill="#ff9f43"/>
        <path d="M40 68 Q50 74 60 68" stroke="#e6a817" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M42 88 L42 80 M58 88 L58 80" stroke="#ff9f43" stroke-width="4" stroke-linecap="round"/>
    </svg>`,
    butterfly: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 30 Q36 6 20 14 Q8 22 20 40 Q30 52 46 52Z" fill="#9b7ede"/>
        <path d="M50 30 Q64 6 80 14 Q92 22 80 40 Q70 52 54 52Z" fill="#9b7ede"/>
        <path d="M48 56 Q30 56 22 72 Q16 86 32 88 Q46 88 50 70Z" fill="#b388ff"/>
        <path d="M52 56 Q70 56 78 72 Q84 86 68 88 Q54 88 50 70Z" fill="#b388ff"/>
        <ellipse cx="50" cy="52" rx="6" ry="24" fill="#5e4b8b"/>
        <path d="M46 30 Q40 18 34 16 M54 30 Q60 18 66 16" stroke="#5e4b8b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <circle cx="28" cy="26" r="5" fill="#fff" opacity="0.5"/><circle cx="72" cy="26" r="5" fill="#fff" opacity="0.5"/>
    </svg>`,
    apple: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 26 C30 10 8 26 12 52 C15 74 34 90 50 88 C66 90 85 74 88 52 C92 26 70 10 50 26Z" fill="#ff6b6b"/>
        <path d="M50 26 Q52 12 62 8" stroke="#7a4a21" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M60 14 Q76 8 80 20 Q66 26 60 14Z" fill="#2e9e5b"/>
        <ellipse cx="34" cy="42" rx="8" ry="12" fill="#fff" opacity="0.35" transform="rotate(-18 34 42)"/>
    </svg>`,
    star: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 8 L61 38 L94 40 L68 60 L77 92 L50 73 L23 92 L32 60 L6 40 L39 38Z" fill="#ffd200" stroke="#e6b800" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="42" cy="46" r="5" fill="#fff" opacity="0.6"/>
    </svg>`,
    heart: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 88 C20 66 8 46 14 30 C19 16 38 12 50 26 C62 12 81 16 86 30 C92 46 80 66 50 88Z" fill="#ff6b9d"/>
        <ellipse cx="34" cy="38" rx="8" ry="11" fill="#fff" opacity="0.4" transform="rotate(-20 34 38)"/>
    </svg>`,
    fish: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 50 Q34 22 62 34 Q84 44 86 50 Q84 56 62 66 Q34 78 14 50Z" fill="#4a9eff"/>
        <path d="M86 50 L98 34 L98 66Z" fill="#2f7fd4"/>
        <circle cx="30" cy="46" r="5" fill="#fff"/><circle cx="30" cy="46" r="2.6" fill="#2c3e50"/>
        <path d="M46 40 Q52 50 46 60 M58 42 Q64 50 58 58" stroke="#2f7fd4" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>`,
    balloon: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="42" rx="28" ry="34" fill="#ff9f43"/>
        <ellipse cx="40" cy="30" rx="8" ry="12" fill="#fff" opacity="0.4" transform="rotate(-15 40 30)"/>
        <path d="M46 76 L54 76 L50 84Z" fill="#e6892f"/>
        <path d="M50 84 Q42 92 50 98 Q58 92 50 84" stroke="#e6892f" stroke-width="3" fill="none"/>
    </svg>`,
};
const ICON_KEYS = Object.keys(ICONS);   // 全部图标随机调用

/* ================= 工具与音效 ================= */
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
let audioCtx = null;
function beep(f, d = 0.12, t = 'sine', vol = 0.15) {
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
    } catch (e) {}
}
const sGood = () => { beep(660, 0.1); setTimeout(() => beep(880, 0.16), 90); };
const sWin  = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18), i * 120)); };
const sBad  = () => beep(300, 0.18, 'sine', 0.1);   // 温和轻柔，不打击自信心
const sClick = () => beep(600, 0.05);

/* ================= 游戏状态 ================= */
let Q = null;        // 当前题目 { icon, n }
let solved = false;  // 答对后锁定，等待下一题
let fbTimer = 0;

/* ================= 出题 ================= */
function newQuestion() {
    Q = { icon: ICON_KEYS[randInt(0, ICON_KEYS.length - 1)], n: randInt(MIN_N, MAX_N) };
    solved = false;
    clearTimeout(fbTimer);
    renderPics();
    setFeedback('', '');
    setKeysEnabled(true);
}
/* 渲染图形：每行最多5个、居中、大小统一、间距均匀 */
function renderPics() {
    const box = $('pics');
    box.innerHTML = '';
    const svg = ICONS[Q.icon];
    for (let i = 0; i < Q.n; i++) {
        const el = document.createElement('div');
        el.className = 'pic';
        el.innerHTML = svg;
        box.appendChild(el);
    }
}

/* ================= 数字键盘 ================= */
function buildKeypad() {
    const box = $('keypad');
    box.innerHTML = '';
    for (let v = 1; v <= 10; v++) addKey(box, v);
    addKey(box, 0);
}
function addKey(box, v) {
    const b = document.createElement('button');
    b.className = 'key' + (v === 10 ? ' wide' : '');
    b.textContent = v;
    b.dataset.v = v;
    b.onclick = () => onKey(v);
    box.appendChild(b);
}
function setKeysEnabled(on) {
    document.querySelectorAll('.key').forEach(b => b.disabled = !on);
}
function onKey(v) {
    if (solved) return;                  // 答对后锁定
    sClick();
    if (v === Q.n) {                     // 答对：锁定，等老师/学生点下一题
        solved = true;
        sGood(); setTimeout(sWin, 150);
        setKeysEnabled(false);
        const fb = $('feedback');
        setFeedback(`🎉 答对啦！一共有 ${Q.n} 个！ 👉 点这里下一题`, 'good click');
        fb.onclick = () => { sClick(); newQuestion(); };
    } else {                             // 答错：温和提示，可无限重试
        sBad();
        setFeedback(`❌ 再试一试哦，再仔细数一数`, 'bad');
        clearTimeout(fbTimer);
        fbTimer = setTimeout(hideFeedback, 2000);   // 停留2秒自动消失
    }
}

/* ================= 反馈文字 ================= */
function setFeedback(text, cls) {
    clearTimeout(fbTimer);
    const fb = $('feedback');
    fb.textContent = text;
    fb.className = 'feedback show' + (cls ? ' ' + cls : '');   // show 类控制透明度，必须有
    fb.onclick = cls && cls.includes('click') ? fb.onclick : null;
}
function hideFeedback() {
    $('feedback').className = 'feedback';
}

/* ================= 顶部按钮 ================= */
$('btnNew').onclick = () => { sClick(); newQuestion(); };

/* ================= 初始化 ================= */
buildKeypad();
newQuestion();
</script>
</body>
</html>
