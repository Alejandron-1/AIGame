<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学拔河 - 课堂口算竞技</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(180deg, #fdf6e3 0%, #f2ecd7 100%);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
    }
    .game { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }

    /* ===== 顶栏 ===== */
    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 22px; background: #2f3640; color: #fff;
        flex: 0 0 auto;
    }
    .topbar .title { font-size: clamp(18px, 2vw, 26px); font-weight: bold; letter-spacing: 1px; }
    .topbar .stats { display: flex; gap: clamp(12px, 2vw, 26px); font-size: clamp(13px, 1.4vw, 18px); }
    .topbar .stats b { color: #ffd200; }
    .iconbtn {
        background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 25px;
        padding: 6px 16px; font-size: clamp(13px, 1.3vw, 17px); cursor: pointer; font-family: inherit; font-weight: bold;
    }
    .iconbtn:hover { background: rgba(255,255,255,0.3); transform: translateY(-1px); }

    /* ===== 主区域 ===== */
    .main { flex: 1; display: flex; min-height: 0; }
    .team {
        flex: 0 0 26%; display: flex; flex-direction: column; padding: clamp(6px, 1vw, 14px);
        gap: clamp(4px, 0.6vw, 8px); min-width: 0;
    }
    .arena { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 6px; }

    /* 队伍面板 */
    .team-head {
        display: flex; align-items: center; justify-content: space-between; padding: 6px 12px;
        border-radius: 12px; color: #fff; font-weight: bold;
        font-size: clamp(15px, 1.6vw, 22px);
    }
    .team.blue .team-head { background: #4A90E2; }
    .team.red  .team-head { background: #FF6B6B; }
    .team-head .score { font-size: clamp(13px, 1.3vw, 18px); }
    .board {
        background: #fff; border-radius: 14px; padding: 10px; text-align: center; min-height: 0;
        box-shadow: 0 4px 10px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column;
        justify-content: center; position: relative;
    }
    .board .expr {
        font-size: clamp(26px, 3.2vw, 44px); font-weight: bold; color: #2c3e50;
        line-height: 1.3; word-break: break-all;
    }
    .board .tag {
        position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
        font-size: clamp(11px, 1vw, 14px); color: #999; background: #f0f0f0; border-radius: 8px; padding: 2px 10px;
    }
    .board .downgrade {
        position: absolute; top: 6px; left: 6px; font-size: clamp(11px,1vw,13px); color: #e67e22;
        background: #fef5e7; border-radius: 8px; padding: 2px 8px; display: none;
    }
    /* 答案框 */
    .ans-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 6px; }
    .ansbox {
        min-width: clamp(60px, 7vw, 100px); height: clamp(48px, 5.5vw, 76px);
        border: 3px solid #ddd; border-radius: 12px; font-size: clamp(28px, 3.2vw, 44px);
        font-weight: bold; color: #2c3e50; display: flex; align-items: center; justify-content: center;
        background: #fff; transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .ansbox.active { border-color: #ffd200; box-shadow: 0 0 0 3px rgba(255,210,0,0.3); }
    .ansbox.ok { background: #d5f5e3; border-color: #27ae60; color: #27ae60; }
    .ansbox.bad { background: #fdedec; border-color: #e74c3c; color: #e74c3c; animation: shake 0.35s; }
    .ansbox.sub { min-width: clamp(36px, 4vw, 56px); font-size: clamp(20px, 2.4vw, 32px); }
    .ansbox .sub-label { font-size: clamp(10px, 1vw, 13px); color: #999; position: absolute; margin-top: -34px; }
    .ans-eq { font-size: clamp(22px, 2.6vw, 34px); font-weight: bold; color: #2c3e50; }
    /* 键盘 */
    .keypad {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(4px, 0.5vw, 8px);
        flex: 0 0 auto;
    }
    .key {
        height: clamp(40px, 5vh, 58px); border: none; border-radius: 12px; font-size: clamp(20px, 2.4vw, 32px);
        font-weight: bold; cursor: pointer; background: #ecf0f1; color: #2c3e50; font-family: inherit;
        transition: transform 0.1s, background 0.1s;
    }
    .key:hover { background: #d5dbdb; transform: translateY(-1px); }
    .key:active { transform: scale(0.94); }
    .key.op { background: #ffd200; color: #5d3a00; }
    .key.ok { background: #2ecc71; color: #fff; }
    .team.red .key.ok { background: #e67e22; }
    .team-status {
        display: flex; justify-content: space-between; align-items: center; font-size: clamp(12px, 1.3vw, 17px);
        color: #555; font-weight: bold;
    }
    .timer-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #f39c12, #ffd200); width: 100%; transition: width 0.1s linear; }
    .team.inactive { opacity: 0.45; filter: grayscale(0.3); }
    .waiting {
        display: none; position: absolute; inset: 0; background: rgba(255,255,255,0.75);
        align-items: center; justify-content: center; font-size: clamp(18px, 2vw, 28px); font-weight: bold;
        color: #999; border-radius: 14px;
    }
    .team.inactive .waiting { display: flex; }

    /* ===== 竞技场 ===== */
    .arena-box {
        flex: 1; background: linear-gradient(180deg, #dff0ff 0%, #e8f6e0 60%, #b7e09a 100%);
        border-radius: 16px; position: relative; overflow: hidden;
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.08);
    }
    .arena-box svg { width: 100%; height: 100%; }
    .flag-toast {
        position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.72); color: #ffd200; padding: 8px 20px; border-radius: 30px;
        font-size: clamp(16px, 1.8vw, 26px); font-weight: bold; opacity: 0; pointer-events: none;
        transition: opacity 0.3s; white-space: nowrap;
    }
    .flag-toast.show { opacity: 1; }
    /* 结算 / 设置 弹层 */
    .overlay {
        position: fixed; inset: 0; background: rgba(30,40,60,0.55);
        display: flex; align-items: center; justify-content: center; z-index: 30;
    }
    .panel {
        background: #fff; border-radius: 20px; padding: 26px 34px; max-width: 860px; max-height: 92vh;
        overflow: auto; box-shadow: 0 12px 44px rgba(0,0,0,0.4); width: 92%;
    }
    .panel h2 { color: #2c3e50; margin-bottom: 16px; font-size: clamp(22px, 2.4vw, 30px); }
    .panel h3 { color: #4A90E2; font-size: clamp(15px, 1.5vw, 19px); margin: 16px 0 8px; border-left: 4px solid #4A90E2; padding-left: 8px; }
    .opt-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .opt {
        padding: 10px 18px; border: 3px solid #ccc; border-radius: 12px; cursor: pointer; background: #fff;
        font-size: clamp(14px, 1.5vw, 18px); font-weight: bold; color: #555; font-family: inherit;
        transition: all 0.15s;
    }
    .opt.sel { border-color: #4A90E2; background: #eaf3ff; color: #2c74c7; }
    .opt .desc { display: block; font-size: clamp(11px, 1.1vw, 13px); font-weight: normal; color: #999; margin-top: 3px; }
    .opt-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .field label { font-size: clamp(13px, 1.3vw, 16px); font-weight: bold; color: #555; }
    .field input {
        border: 2px solid #ccc; border-radius: 10px; padding: 8px 12px; font-size: clamp(14px, 1.4vw, 18px);
        font-family: inherit; width: 150px; outline: none; text-align: center;
    }
    .field input:focus { border-color: #4A90E2; }
    .start-btn {
        width: 100%; margin-top: 20px; padding: 16px; border: none; border-radius: 14px;
        background: linear-gradient(135deg, #4A90E2, #5cb0f5); color: #fff; font-size: clamp(18px, 2vw, 24px);
        font-weight: bold; cursor: pointer; font-family: inherit;
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74,144,226,0.4); }
    .err { color: #e74c3c; font-size: 14px; margin-top: 8px; min-height: 20px; }
    /* 结算 */
    .win-banner {
        font-size: clamp(34px, 4vw, 54px); font-weight: bold; text-align: center; margin: 6px 0;
        animation: bounce 0.8s infinite alternate;
    }
    @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.08); } }
    .gold { font-size: clamp(40px, 5vw, 70px); text-align: center; animation: spin 1.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
    .stat-card { border-radius: 12px; padding: 12px 16px; color: #fff; }
    .stat-card.blue { background: #4A90E2; }
    .stat-card.red { background: #FF6B6B; }
    .stat-card .n { font-size: clamp(20px, 2.2vw, 28px); font-weight: bold; }
    .stat-card .l { font-size: clamp(12px, 1.2vw, 14px); opacity: 0.9; }
    .wronglist { max-height: 140px; overflow: auto; text-align: left; margin: 8px 0; }
    .wronglist .row { font-size: clamp(13px, 1.2vw, 15px); padding: 4px 10px; color: #555; }
    .wronglist .row:nth-child(odd) { background: #f4f6f8; }
    .wronglist .row .a { color: #27ae60; font-weight: bold; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .btn {
        padding: 12px 30px; border: none; border-radius: 25px; font-size: clamp(15px, 1.6vw, 20px);
        font-weight: bold; cursor: pointer; font-family: inherit; color: #fff;
    }
    .btn.blue { background: #4A90E2; }
    .btn.green { background: #2ecc71; }
    .btn.gray { background: #95a5a6; }
    /* 庆祝 */
    .confetti { position: fixed; width: 10px; height: 10px; border-radius: 2px; z-index: 40; pointer-events: none; animation: fall 1.2s ease-out forwards; }
    @keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; } }
    /* 竞技场烟花（往哪边拉就往那边炸） */
    .firework { position: absolute; border-radius: 50%; pointer-events: none; z-index: 30; left: var(--x); top: var(--y); animation: burst 0.85s ease-out forwards; }
    @keyframes burst { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; } }
    .shake { animation: shake 0.35s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .hidden { display: none !important; }
</style>
</head>
<body>
<div class="game" id="game">
    <div class="topbar">
        <div class="title">🪢 数学拔河</div>
        <div class="stats">
            <span>🟦 <b id="blueScore">0</b> / <span id="blueNeed">10</span></span>
            <span>🟥 <b id="redScore">0</b> / <span id="redNeed">10</span></span>
        </div>
        <div>
            <button class="iconbtn" id="soundBtn">🔊</button>
            <button class="iconbtn" id="quitBtn">⬅ 结束本局</button>
        </div>
    </div>

    <div class="main">
        <!-- 蓝队 -->
        <div class="team blue" id="teamBlue">
            <div class="team-head"><span id="blueName">蓝队</span><span class="score">🔥 <b id="blueStreak">0</b></span></div>
            <div class="board" id="blueBoard">
                <div class="tag" id="blueTag"></div>
                <div class="downgrade" id="blueDown">⬇ 难度已降低</div>
                <div class="expr" id="blueExpr">准备中…</div>
                <div class="ans-row" id="blueAns"></div>
                <div class="waiting">等待对方…</div>
            </div>
            <div class="keypad" id="blueKeypad"></div>
            <div class="team-status">
                <span>✓ <b id="blueCorr">0</b></span>
                <span>⏱ <b id="blueFastest">-</b>s</span>
                <span>✗ <b id="blueWrong">0</b></span>
            </div>
            <div class="timer-bar"><div class="timer-fill" id="blueTimer"></div></div>
        </div>

        <!-- 竞技场 -->
        <div class="arena">
            <div class="arena-box" id="arenaBox">
                <svg id="arenaSvg" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet"></svg>
                <div class="flag-toast" id="flagToast"></div>
            </div>
        </div>

        <!-- 红队 -->
        <div class="team red" id="teamRed">
            <div class="team-head"><span id="redName">红队</span><span class="score">🔥 <b id="redStreak">0</b></span></div>
            <div class="board" id="redBoard">
                <div class="tag" id="redTag"></div>
                <div class="downgrade" id="redDown">⬇ 难度已降低</div>
                <div class="expr" id="redExpr">准备中…</div>
                <div class="ans-row" id="redAns"></div>
                <div class="waiting">等待对方…</div>
            </div>
            <div class="keypad" id="redKeypad"></div>
            <div class="team-status">
                <span>✓ <b id="redCorr">0</b></span>
                <span>⏱ <b id="redFastest">-</b>s</span>
                <span>✗ <b id="redWrong">0</b></span>
            </div>
            <div class="timer-bar"><div class="timer-fill" id="redTimer"></div></div>
        </div>
    </div>

    <!-- 设置弹层 -->
    <div class="overlay" id="settingsOverlay">
        <div class="panel">
            <h2>🪢 数学拔河 · 赛前设置</h2>
            <h3>① 运算类型（可多选）</h3>
            <div class="opt-group" id="opsGroup">
                <button class="opt" data-op="add">➕ 纯加法<span class="desc">如 3 + 5</span></button>
                <button class="opt" data-op="sub">➖ 纯减法<span class="desc">如 8 - 3</span></button>
                <button class="opt sel" data-op="addsub">🔄 加减混合<span class="desc">两步：如 15+8-6</span></button>
                <button class="opt sel" data-op="mul">✖️ 乘法<span class="desc">纯乘法：如 23×4</span></button>
                <button class="opt sel" data-op="div">➗ 除法<span class="desc">纯除法：如 45÷5</span></button>
            </div>
            <h3>② 数字范围（适用于加法/减法）</h3>
            <div class="opt-group" id="rangeGroup">
                <button class="opt" data-range="10">🔟 10 以内<span class="desc">结果不超 10</span></button>
                <button class="opt sel" data-range="20">2️⃣0️⃣ 20 以内<span class="desc">结果不超 20</span></button>
                <button class="opt" data-range="50">5️⃣0️⃣ 50 以内<span class="desc">结果不超 50</span></button>
                <button class="opt" data-range="100">💯 100 以内<span class="desc">结果不超 100</span></button>
            </div>
            <h3>③ 乘除难度（适用于乘法/除法）</h3>
            <div class="opt-group" id="diffGroup">
                <button class="opt sel" data-diff="easy">🌱 简单<span class="desc">表内乘除 / 两位数乘一位数</span></button>
                <button class="opt" data-diff="medium">🌳 中等<span class="desc">表内乘法(全) / 简单除法</span></button>
                <button class="opt" data-diff="hard">🏔️ 困难<span class="desc">两位数×两位数 / 三位数÷一位数</span></button>
            </div>
            <h3>④ 队伍与规则</h3>
            <div class="opt-row">
                <div class="field"><label>🔵 蓝队：</label><input id="blueNameInput" value="蓝队" maxlength="6"></div>
                <div class="field"><label>🔴 红队：</label><input id="redNameInput" value="红队" maxlength="6"></div>
            </div>
            <div class="opt-row" style="margin-top:10px;">
                <button class="opt sel" data-mode="sync">⚡ 同步抢答<span class="desc">两队同时出题，谁先答对谁进攻（推荐）</span></button>
                <button class="opt" data-mode="turn">🔁 轮流作答<span class="desc">蓝队答完换红队，适合低年级</span></button>
            </div>
            <div class="opt-row" style="margin-top:10px;">
                <div class="field"><label>🏆 获胜需要拉绳：</label><input id="winNeedInput" type="number" min="3" max="20" value="6"> 步</div>
                <div class="field"><label>⏱ 每题限时：</label><input id="timeoutInput" type="number" min="5" max="60" value="15"> 秒</div>
            </div>
            <div class="err" id="settingsErr"></div>
            <button class="start-btn" id="startGameBtn">🎮 开始拔河！</button>
        </div>
    </div>

    <!-- 结算弹层 -->
    <div class="overlay" id="resultOverlay" style="display:none;">
        <div class="panel">
            <div class="win-banner" id="winBanner"></div>
            <div class="gold">🏆</div>
            <div class="stat-grid" id="statGrid"></div>
            <div id="wrongBox" style="display:none;">
                <h3 style="color:#e74c3c;">错题回顾（可全班讲解）</h3>
                <div class="wronglist" id="wrongList"></div>
            </div>
            <div class="btn-row">
                <button class="btn green" id="againBtn">🔁 再来一局</button>
                <button class="btn gray" id="homeBtn">🏠 返回设置</button>
            </div>
        </div>
    </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
let soundOn = true, audioCtx = null;
function beep(f, d = 0.12, t = 'sine', vol = 0.16) {
    if (!soundOn) return;
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
    } catch (e) {}
}
const sClick  = () => beep(600, 0.05);
const sGood   = () => { beep(660, 0.1); setTimeout(() => beep(880, 0.16), 90); };
const sBad    = () => beep(180, 0.3, 'sawtooth');
const sPull   = () => { beep(320, 0.2, 'triangle'); setTimeout(() => beep(220, 0.2, 'triangle'), 90); };
const sItem   = () => { beep(784, 0.12); setTimeout(() => beep(1047, 0.2), 120); };
const sWin    = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.22), i * 140)); };

function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function svgEl(t, a) { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; }
function confetti() {
    const colors = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#e91e63', '#ff9800', '#4A90E2', '#FF6B6B'];
    for (let i = 0; i < 60; i++) {
        const d = document.createElement('div');
        d.className = 'confetti';
        d.style.left = randInt(0, 100) + 'vw';
        d.style.top = randInt(-10, 10) + 'vh';
        d.style.background = pick(colors);
        d.style.width = d.style.height = randInt(6, 12) + 'px';
        d.style.animationDuration = (0.9 + Math.random() * 1.1) + 's';
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 2400);
    }
}

/* 竞技场烟花：绳子往哪边移动就在哪边炸 */
function firework(side) {
    const box = $('arenaBox');
    const r = box.getBoundingClientRect();
    const cx = r.width * (side === 'blue' ? 0.16 : 0.84);
    const cy = r.height * 0.3;
    const colors = side === 'blue'
        ? ['#4A90E2', '#5cb0f5', '#8fd3ff', '#ffd200', '#fff']
        : ['#FF6B6B', '#ff9a8b', '#ffc2c0', '#ffd200', '#fff'];
    for (let i = 0; i < 34; i++) {
        const d = document.createElement('div');
        d.className = 'firework';
        const ang = (Math.PI * 2 * i) / 34 + Math.random() * 0.6;
        const dist = 36 + Math.random() * 80;
        d.style.setProperty('--x', cx + 'px');
        d.style.setProperty('--y', cy + 'px');
        d.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        d.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        d.style.background = pick(colors);
        d.style.width = d.style.height = randInt(5, 11) + 'px';
        box.appendChild(d);
        setTimeout(() => d.remove(), 950);
    }
    beep(900, 0.06, 'square', 0.08);
}

/* ================= 难度与出题 ================= */
const DIFF_ORDER = ['easy', 'medium', 'hard'];
const DIFF = {
    easy:   { name: '简单', mulA: [2,5], divD: [2,5],  qMin: 1,  qMax: 5 },
    medium: { name: '中等', mulA: [2,9], divD: [2,9],  qMin: 2,  qMax: 9 },
    hard:   { name: '困难', mulA: [2,9], divD: [2,9],  qMin: 11, qMax: 99 },
};
const RANGES = [10, 20, 50, 100];

/* 纯加法：A + B，结果不超范围 */
function genAdd(range) {
    const a = randInt(1, range - 1);
    const b = randInt(1, range - a);
    return { expr: `${a} + ${b}`, answer: a + b };
}

/* 纯减法：A - B，中间值结果非负 */
function genSub(range) {
    const a = randInt(1, range);
    const b = randInt(1, a);
    return { expr: `${a} - ${b}`, answer: a - b };
}

/* 加减混合：强制 A+B-C 或 A-B+C 两步混合，中间值/结果 ≥0 且不超范围 */
function genAddSub(range) {
    for (let t = 0; t < 400; t++) {
        if (Math.random() < 0.5) {
            // A + B - C
            const a = randInt(1, range), b = randInt(1, range);
            const ab = a + b;
            if (ab > range) continue;
            const c = randInt(1, Math.max(1, Math.min(range, ab)));
            const ans = ab - c;
            if (ans >= 0) return { expr: `${a} + ${b} - ${c}`, answer: ans };
        } else {
            // A - B + C
            const a = randInt(2, range), b = randInt(1, a - 1);
            const abv = a - b;
            const c = randInt(1, range);
            const ans = abv + c;
            if (ans > range) continue;
            return { expr: `${a} - ${b} + ${c}`, answer: ans };
        }
    }
    return { expr: '5 + 3 - 2', answer: 6 };
}

function genMul(diff) {
    const d = DIFF[diff];
    if (diff === 'easy') { const a = randInt(2, 5), b = randInt(2, 5); return { expr: `${a} × ${b}`, answer: a * b }; }
    if (diff === 'medium') {
        if (Math.random() < 0.5) { const a = randInt(2, 9), b = randInt(2, 9); return { expr: `${a} × ${b}`, answer: a * b }; }
        const a = randInt(11, 99), b = randInt(2, 9); return { expr: `${a} × ${b}`, answer: a * b };
    }
    const a = randInt(11, 99), b = randInt(11, 99); return { expr: `${a} × ${b}`, answer: a * b };
}

function genDiv(diff) {
    const d = DIFF[diff];
    for (let t = 0; t < 200; t++) {
        const divisor = randInt(d.divD[0], d.divD[1]);
        const quotient = randInt(d.qMin, d.qMax);
        let rem = 0;
        if (diff === 'hard' && Math.random() < 0.5) rem = randInt(1, divisor - 1);
        const dividend = divisor * quotient + rem;
        if (diff === 'hard' && dividend < 100) continue;
        if (rem > 0) return { expr: `${dividend} ÷ ${divisor}`, answer: { q: quotient, r: rem }, divR: true };
        return { expr: `${dividend} ÷ ${divisor}`, answer: quotient };
    }
    return { expr: '15 ÷ 3', answer: 5 };
}

/* 连续答错时的降级：加减类降范围，乘除类降难度 */
function downgradeRange(r) { return RANGES[Math.max(0, RANGES.indexOf(r) - 1)]; }
function downgradeDiff(d) { return DIFF_ORDER[Math.max(0, DIFF_ORDER.indexOf(d) - 1)]; }

/* ================= 状态 ================= */
let S = null;   // 一局的状态

function makeTeams() {
    return {
        blue: { key: 'blue', name: '蓝队', color: '#4A90E2', score: 0, streak: 0, consecWrong: 0, fastest: null,
                corr: 0, wrong: 0, q: null, fields: ['', ''], active: 0, divR: false, lock: false, timer: null, qStart: 0 },
        red:  { key: 'red',  name: '红队', color: '#FF6B6B', score: 0, streak: 0, consecWrong: 0, fastest: null,
                corr: 0, wrong: 0, q: null, fields: ['', ''], active: 0, divR: false, lock: false, timer: null, qStart: 0 },
    };
}

/* 近 10 题去重 */
const recent = [];
function dedup(expr) {
    return recent.indexOf(expr) !== -1;
}

/* 给队伍出题（含难度动态降级） */
function genFor(team, downgrade) {
    const ops = S.ops;
    let q = null;
    for (let t = 0; t < 60; t++) {
        const op = pick(ops);
        let cand;
        if (op === 'add' || op === 'sub' || op === 'addsub') {
            const r = downgrade ? downgradeRange(S.range) : S.range;
            cand = op === 'add' ? genAdd(r) : op === 'sub' ? genSub(r) : genAddSub(r);
            cand._diff = `${r} 以内`;
        } else {
            const diff = downgrade ? downgradeDiff(S.mulDiff) : S.mulDiff;
            cand = op === 'mul' ? genMul(diff) : genDiv(diff);
            cand._diff = DIFF[diff].name;
        }
        if (!dedup(cand.expr)) { q = cand; break; }
    }
    if (!q) { q = genAdd(S.range || 20); q._diff = `${S.range || 20} 以内`; }
    recent.push(q.expr);
    if (recent.length > 10) recent.shift();
    q._downgraded = !!downgrade;
    return q;
}

function toast(msg) {

    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 1300);

/* ================= 队伍面板渲染 ================= */
function buildKeypad(teamKey) {
    const pad = $(teamKey + 'Keypad');
    pad.innerHTML = '';
    const keys = ['1','2','3','4','5','6','7','8','9','×','0','√'];
    keys.forEach(k => {
        const b = document.createElement('button');
        b.className = 'key' + (k === '×' || k === '√' ? ' op' : '') + (k === '√' ? ' ok' : '');
        b.textContent = k;
        b.dataset.key = k;
        b.addEventListener('click', () => onKey(teamKey, k));
        pad.appendChild(b);
    });
}

function renderQuestion(teamKey) {
    const team = S.teams[teamKey];
    const t = team;
    const tag = $(teamKey + 'Tag');
    tag.textContent = (t.q && t.q._diff) ? t.q._diff : '';
    const down = $(teamKey + 'Down');
    down.style.display = t.q && t.q._downgraded ? '' : 'none';

    const exprEl = $(teamKey + 'Expr');
    const ansRow = $(teamKey + 'Ans');
    ansRow.innerHTML = '';
    t.fields = ['', ''];
    t.active = 0;
    t.divR = !!(t.q && t.q.divR);

    // 表达式 + 等号
    const eq = document.createElement('span');
    eq.className = 'ans-eq';
    eq.textContent = '=';

    if (t.divR) {
        // 商 + 余数两个框
        exprEl.textContent = t.q.expr + ' =';
        const qBox = makeAnsBox(t, 0, '商');
        const sep = document.createElement('span');
        sep.className = 'ans-eq';
        sep.textContent = '……';
        const rBox = makeAnsBox(t, 1, '余数');
        ansRow.appendChild(qBox); ansRow.appendChild(sep); ansRow.appendChild(rBox);
        // 答案框点击切换
        qBox.addEventListener('click', () => setActive(t, 0));
        rBox.addEventListener('click', () => setActive(t, 1));
    } else {
        exprEl.textContent = t.q.expr;
        const qBox = makeAnsBox(t, 0, null);
        ansRow.appendChild(qBox); ansRow.appendChild(eq);
        qBox.addEventListener('click', () => setActive(t, 0));
    }
    refreshAnsDisplay(teamKey);
    t.qStart = Date.now();
    startTeamTimer(teamKey);
}

function makeAnsBox(team, idx, label) {
    const box = document.createElement('div');
    box.className = 'ansbox' + (idx === 0 ? ' active' : '') + (label ? ' sub' : '');
    if (label) {
        const lab = document.createElement('div');
        lab.className = 'sub-label';
        lab.textContent = label;
        box.appendChild(lab);
    }
    const val = document.createElement('span');
    val.className = 'ans-val';
    box.appendChild(val);
    box.id = team.key + '-ans' + idx;
    return box;
}

function setActive(team, idx) {
    team.active = idx;
    const ansRow = $(team.key + 'Ans');
    ansRow.querySelectorAll('.ansbox').forEach((b, i) => b.classList.toggle('active', i === idx));
    sClick();
}

function refreshAnsDisplay(teamKey) {
    const t = S.teams[teamKey];
    for (let i = 0; i < 2; i++) {
        const box = $(teamKey + '-ans' + i);
        const val = box && box.querySelector('.ans-val');
        if (val) val.textContent = t.fields[i] || '';
    }
}

function onKey(teamKey, k) {
    const t = S.teams[teamKey];
    if (!S.running) return;
    if (S.mode === 'turn' && S.activeTeam !== teamKey) return;
    if (t.lock) return;
    if (k === '×') { t.fields[t.active] = ''; sClick(); }
    else if (k === '√') { submitAnswer(teamKey); return; }
    else {
        const field = t.fields[t.active];
        const maxLen = t.divR && t.active === 1 ? 1 : 4;
        if (field.length >= maxLen) return;
        t.fields[t.active] += k;
        sClick();
    }
    refreshAnsDisplay(teamKey);
}

/* ================= 计时 ================= */
function startTeamTimer(teamKey) {
    clearTeamTimer(teamKey);
    const t = S.teams[teamKey];
    const fill = $(teamKey + 'Timer');
    fill.style.width = '100%';
    const dur = S.timeout * 1000;
    const t0 = performance.now();
    t.timer = setInterval(() => {
        const left = dur - (performance.now() - t0);
        fill.style.width = Math.max(0, left / dur * 100) + '%';
        if (left <= 0) {
            clearTeamTimer(teamKey);
            handleTimeout(teamKey);
        }
    }, 100);
}
function clearTeamTimer(teamKey) {
    const t = S.teams[teamKey];
    if (t.timer) { clearInterval(t.timer); t.timer = null; }
}

/* ================= 判定 ================= */
function submitAnswer(teamKey) {
    const t = S.teams[teamKey];
    if (t.lock) return;
    t.lock = true;
    setTimeout(() => t.lock = false, 300);   // 300ms 防连点
    clearTeamTimer(teamKey);                 // 先停表，避免与下一题计时竞争

    const ok = checkFields(t);
    const react = ((Date.now() - t.qStart) / 1000);
    t.fields[0] = ''; t.fields[1] = '';      // 清空输入

    if (ok) {
        t.streak++;
        t.consecWrong = 0;
        t.corr++;
        t.score++;
        if (t.fastest === null || react < t.fastest) t.fastest = react;
        const isItem = t.streak >= 5;
        goodFlash(teamKey);
        sGood();
        // 拉绳：连对5题触发“大力水手”，拉两步
        const steps = isItem ? 2 : 1;
        pullRope(teamKey, steps);
        if (isItem) { sItem(); toast(`${t.name} 💪 大力水手！连拉两步！`); }
        updateTeamUI(teamKey);
        // 下一个问题
        setTimeout(() => {
            if (!S.running) return;
            if (S.mode === 'turn') {
                switchTurn();
                return;
            }
            t.q = genFor(t, t.consecWrong >= 3);
            renderQuestion(teamKey);
        }, ok ? 400 : 0);
    } else {
        t.streak = 0;
        t.consecWrong++;
        t.wrong++;
        t.score = Math.max(0, t.score - 1);
        badFlash(teamKey);
        sBad();
        // 对方获得进攻机会：绳子向对方移动
        pullRope(teamKey, -1);
        recordWrong(t);
        if (t.consecWrong >= 3) toast(`⬇ ${t.name} 连续答错，下一题已降级`);
        updateTeamUI(teamKey);
        setTimeout(() => refreshAnsDisplay(teamKey), 500);   // 红闪后清空显示
        if (S.mode === 'turn') {
            setTimeout(() => { if (S.running) switchTurn(); }, 900);
        } else {
            // 同步模式：保留原题重做，刷新计时
            startTeamTimer(teamKey);
        }
    }
}

function checkFields(t) {
    if (t.divR) {
        const q = parseInt(t.fields[0], 10), r = parseInt(t.fields[1], 10);
        return q === t.q.answer.q && r === t.q.answer.r;
    }
    return parseInt(t.fields[0], 10) === t.q.answer;
}

function handleTimeout(teamKey) {
    const t = S.teams[teamKey];
    if (!S.running) return;
    t.streak = 0;
    t.consecWrong++;
    t.wrong++;
    t.fields = ['', ''];
    refreshAnsDisplay(teamKey);
    sBad();
    toast(`⏱ ${t.name} 超时！对方进攻`);
    pullRope(teamKey, -1);
    recordWrong(t);
    updateTeamUI(teamKey);
    if (S.mode === 'turn') {
        if (S.activeTeam === teamKey) setTimeout(() => { if (S.running) switchTurn(); }, 800);
    } else {
        t.q = genFor(t, t.consecWrong >= 3);
        renderQuestion(teamKey);
    }
}

function goodFlash(teamKey) {
    const t = S.teams[teamKey];
    t.fields = ['', ''];
    refreshAnsDisplay(teamKey);
    const boxes = $(teamKey + 'Ans').querySelectorAll('.ansbox');
    boxes.forEach(b => { b.classList.add('ok'); setTimeout(() => b.classList.remove('ok'), 600); });
}
function badFlash(teamKey) {
    const boxes = $(teamKey + 'Ans').querySelectorAll('.ansbox');
    boxes.forEach(b => { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 600); });
}

/* 拉绳：teamKey 进攻方向，steps 可为负（惩罚向对方）。
   每次实际移动 100/winNeed 个绳距，让“获胜需要拉绳 N 步”真正生效 */
function pullRope(teamKey, steps) {
    const prev = S.rope;
    const delta = steps * (100 / S.winNeed);
    if (teamKey === 'blue') S.rope -= delta;
    else S.rope += delta;
    sPull();
    updateFlag(S.rope);
    // 绳子往哪边移动，就在哪边放烟花
    firework(S.rope < prev ? 'blue' : 'red');
    updateTopbar();
    if (S.rope <= -100) return endGame('blue');
    if (S.rope >= 100) return endGame('red');
}

function updateTeamUI(teamKey) {
    const t = S.teams[teamKey];
    $(teamKey + 'Streak').textContent = t.streak;
    $(teamKey + 'Corr').textContent = t.corr;
    $(teamKey + 'Wrong').textContent = t.wrong;
    $(teamKey + 'Fastest').textContent = t.fastest !== null ? t.fastest.toFixed(1) : '-';
    $(teamKey + 'Score').textContent = t.score;
}
function updateTopbar() {
    $('blueScore').textContent = S.teams.blue.score;
    $('redScore').textContent = S.teams.red.score;
}

function switchTurn() {
    S.activeTeam = S.activeTeam === 'blue' ? 'red' : 'blue';
    // 更新面板亮/暗
    S.teams.blue.lock = true; S.teams.red.lock = true;
    setTimeout(() => { S.teams.blue.lock = false; S.teams.red.lock = false; }, 400);
    for (const k of ['blue', 'red']) {
        $('team' + k[0].toUpperCase() + k.slice(1)).classList.toggle('inactive', S.activeTeam !== k);
        if (S.activeTeam === k) {
            const t = S.teams[k];
            t.q = genFor(t, t.consecWrong >= 3);
            renderQuestion(k);
        } else {
            clearTeamTimer(k);
            $(k + 'Timer').style.width = '0%';
        }
    }
    toast(`轮到 ${S.teams[S.activeTeam].name} 作答`);
}

function recordWrong(t) {
    const wrongs = S.wrongs;
    if (wrongs.length >= 12) wrongs.shift();
    wrongs.push({ team: t.name, q: t.q.expr, a: t.divR ? `${t.q.answer.q}……${t.q.answer.r}` : String(t.q.answer) });
}

/* ================= 结算 ================= */
function endGame(winner) {
    if (!S.running) return;
    S.running = false;
    for (const k of ['blue', 'red']) clearTeamTimer(k);
    sWin();
    confetti();
    const winTeam = S.teams[winner];
    $('winBanner').innerHTML = `🎉 ${winTeam.name} 队获胜！`;
    $('winBanner').style.color = winner === 'blue' ? '#4A90E2' : '#FF6B6B';
    // 统计
    const mkStat = (k) => {
        const t = S.teams[k];
        return `<div class="stat-card ${k}"><div class="l">${t.name}</div>
            <div class="n">答对 ${t.corr} 题</div>
            <div class="l">最快 ${t.fastest !== null ? t.fastest.toFixed(1) + ' 秒' : '—'} · 答错 ${t.wrong} 题</div></div>`;
    };
    $('statGrid').innerHTML = mkStat('blue') + mkStat('red');
    // 错题回顾
    if (S.wrongs.length) {
        $('wrongBox').style.display = '';
        $('wrongList').innerHTML = S.wrongs.map((w, i) =>
            `<div class="row">${i + 1}. 【${w.team}】${w.q} = <span class="a">${w.a}</span></div>`).join('');
    } else $('wrongBox').style.display = 'none';
    $('resultOverlay').style.display = 'flex';
}

/* ================= 开始 / 结束 ================= */
function startGame() {
    // 收集设置
    const ops = [];
    document.querySelectorAll('#opsGroup .opt.sel').forEach(b => ops.push(b.dataset.op));
    if (!ops.length) { $('settingsErr').textContent = '请至少选择一种运算类型'; return; }
    const rangeBtn = document.querySelector('#rangeGroup .opt.sel');
    const diffBtn = document.querySelector('#diffGroup .opt.sel');
    const modeBtn = document.querySelector('[data-mode].opt.sel');
    const winNeed = Math.max(3, Math.min(20, parseInt($('winNeedInput').value, 10) || 6));
    const timeout = Math.max(5, Math.min(60, parseInt($('timeoutInput').value, 10) || 15));

    S = {
        ops, range: Number(rangeBtn.dataset.range), mulDiff: diffBtn.dataset.diff, mode: modeBtn.dataset.mode,
        winNeed, timeout, rope: 0, running: true,
        activeTeam: 'blue', wrongs: [],
        teams: makeTeams(),
    };
    S.teams.blue.name = $('blueNameInput').value.trim() || '蓝队';
    S.teams.red.name = $('redNameInput').value.trim() || '红队';
    $('blueName').textContent = S.teams.blue.name;
    $('redName').textContent = S.teams.red.name;
    $('blueNeed').textContent = winNeed;
    $('redNeed').textContent = winNeed;

    $('settingsOverlay').style.display = 'none';
    $('resultOverlay').style.display = 'none';
    drawArena();

    if (S.mode === 'sync') {
        // 同步：两队同时出题
        for (const k of ['blue', 'red']) {
            const t = S.teams[k];
            $('team' + k[0].toUpperCase() + k.slice(1)).classList.remove('inactive');
            t.q = genFor(t, false);
            renderQuestion(k);
        }
    } else {
        // 轮流：蓝队先
        for (const k of ['blue', 'red']) {
            $('team' + k[0].toUpperCase() + k.slice(1)).classList.toggle('inactive', k !== 'blue');
        }
        const t = S.teams.blue;
        t.q = genFor(t, false);
        renderQuestion('blue');
    }
}

function quitToSettings() {
    if (S && S.running) {
        for (const k of ['blue', 'red']) clearTeamTimer(k);
        S.running = false;
    }
    $('settingsOverlay').style.display = 'flex';
    $('resultOverlay').style.display = 'none';
}

/* ================= 设置交互 ================= */
document.querySelectorAll('#opsGroup .opt').forEach(b => {
    b.onclick = () => b.classList.toggle('sel');
});
document.querySelectorAll('#rangeGroup .opt').forEach(b => {
    b.onclick = () => {
        document.querySelectorAll('#rangeGroup .opt').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
    };
});
document.querySelectorAll('#diffGroup .opt').forEach(b => {
    b.onclick = () => {
        document.querySelectorAll('#diffGroup .opt').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
    };
});
document.querySelectorAll('.opt[data-mode]').forEach(b => {
    b.onclick = () => {
        document.querySelectorAll('.opt[data-mode]').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
    };
});
$('startGameBtn').onclick = () => { $('settingsErr').textContent = ''; startGame(); };
$('againBtn').onclick = () => startGame();
$('homeBtn').onclick = () => quitToSettings();
$('quitBtn').onclick = () => quitToSettings();
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; };

/* 初始化 */
buildKeypad('blue');
buildKeypad('red');
drawArena();
$('settingsOverlay').style.display = 'flex';
</script>
</body>
</html>
