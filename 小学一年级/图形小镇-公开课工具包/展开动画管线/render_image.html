<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>立体图形图片 · 拍摄页</title>
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#ffffff;}
  #scene{position:absolute;left:0;top:0;width:1920px;height:1080px;}
</style>
</head>
<body>
<div id="scene"></div>
<script src="three.min.js"></script>
<script>
(function(){
'use strict';
/* 四种立体：?shape=cube|cuboid|cylinder|ball
   统一风格：白底 + 半透明彩色面 + 黑色粗边框 + 灰色粗虚线（隐藏棱） */
var E=0.12, TH=0.10, EDGE=0x111111;
var COLORS={cube:0x3fa3ef, cuboid:0xe8463f, cylinder:0x47c167, ball:0xf0923f};
var qm=location.search.match(/shape=(\w+)/);
var SHAPE=qm?qm[1]:'cube';
var COLOR=COLORS[SHAPE];

var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1);
renderer.setClearColor(0xffffff,1);
renderer.setSize(1920,1080);
document.getElementById('scene').appendChild(renderer.domElement);

var scene=new THREE.Scene();
var CAMH = (SHAPE==='cuboid')?3.0 : (SHAPE==='cube')?3.4 : (SHAPE==='cylinder')?4.2 : 3.2;
var camera=new THREE.OrthographicCamera(-9.6, 9.6, 5.4, -5.4, 0.1, 50);
(function(){
  var a=1920/1080;
  camera.left=-CAMH*a/2; camera.right=CAMH*a/2;
  camera.top=CAMH/2; camera.bottom=-CAMH/2;
  camera.updateProjectionMatrix();
})();
scene.add(new THREE.AmbientLight(0xffffff,0.85));
var sun=new THREE.DirectionalLight(0xffffff,0.45); sun.position.set(4,6,5); scene.add(sun);

var rig=new THREE.Group(); scene.add(rig);
var root=new THREE.Group(); rig.add(root);

var shC=document.createElement('canvas'); shC.width=shC.height=256;
var sg=shC.getContext('2d');
var grd=sg.createRadialGradient(128,128,20,128,128,124);
grd.addColorStop(0,'rgba(70,80,105,0.20)');
grd.addColorStop(1,'rgba(70,80,105,0)');
sg.fillStyle=grd; sg.fillRect(0,0,256,256);
var shadow=new THREE.Mesh(new THREE.PlaneGeometry(17,14),
  new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(shC),transparent:true,depthWrite:false}));
shadow.position.z=-2.8; scene.add(shadow);

var edgeMat=new THREE.MeshBasicMaterial({color:EDGE});
var dashMat=new THREE.MeshBasicMaterial({color:0x565b66,depthTest:false,transparent:true});
function EK(a,b){ return a<b ? a+b : b+a; }
var NRM={F:[0,0,1],B:[0,0,-1],R:[1,0,0],L:[-1,0,0],T:[0,1,0],Bo:[0,-1,0]};
var EDGES={};
[['F','R'],['F','L'],['F','T'],['F','Bo'],
 ['B','R'],['B','L'],['B','T'],['B','Bo'],
 ['R','T'],['R','Bo'],['L','T'],['L','Bo']].forEach(function(p){
  EDGES[EK(p[0],p[1])]={n1:NRM[p[0]],n2:NRM[p[1]]};
});
var BORDER_MAP={
  F :{T:'T', Bo:'Bo', L:'L', R:'R'},
  B :{T:'T', Bo:'Bo', L:'R', R:'L'},
  R :{T:'T', Bo:'Bo', L:'F', R:'B'},
  L :{T:'T', Bo:'Bo', L:'B', R:'F'},
  T :{T:'B', Bo:'F', L:'L', R:'R'},
  Bo:{T:'F', Bo:'B', L:'L', R:'R'}
};
var sticksByEdge={}; Object.keys(EDGES).forEach(function(k){sticksByEdge[k]=[];});
function dashedSeg(parent,a,b){
  var A=new THREE.Vector3(a[0],a[1],a[2]), B=new THREE.Vector3(b[0],b[1],b[2]);
  var dir=B.clone().sub(A), len=dir.length(); dir.normalize();
  var dash=0.22, gap=0.13;
  var geo=new THREE.BoxGeometry(dash,E,E);
  var q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0),dir);
  var n=Math.floor((len-dash)/(dash+gap))+1;
  for(var i=0;i<n;i++){
    var m=new THREE.Mesh(geo,dashMat);
    m.position.copy(A).addScaledVector(dir, dash/2 + i*(dash+gap));
    m.quaternion.copy(q);
    m.renderOrder=5;
    parent.add(m);
  }
}

var W,H,D;
if (SHAPE==='cuboid'){ W=2.8; H=1.7; D=1.4; }
else if (SHAPE==='cube'){ W=2; H=2; D=2; }
else if (SHAPE==='cylinder'){ W=0.95*2; H=2.3; D=0.95*2; }
else { W=2.3; H=2.3; D=2.3; }

/* ============ 折叠姿态直接摆放（图中即立体） ============ */
var faceMat=new THREE.MeshLambertMaterial({color:COLOR,transparent:true,opacity:0.72,depthWrite:false});
if (SHAPE==='cube'||SHAPE==='cuboid'){
 var FOLDED=[
  {fk:'F', w:W, h:H, pos:[0,0, D/2],      rot:['y',0]},
  {fk:'B', w:W, h:H, pos:[0,0,-D/2],      rot:['y',Math.PI]},
  {fk:'R', w:D, h:H, pos:[ W/2,0,0],      rot:['y', Math.PI/2]},
  {fk:'L', w:D, h:H, pos:[-W/2,0,0],      rot:['y',-Math.PI/2]},
  {fk:'T', w:W, h:D, pos:[0, H/2,0],      rot:['x',-Math.PI/2]},
  {fk:'Bo',w:W, h:D, pos:[0,-H/2,0],      rot:['x', Math.PI/2]}
 ];
 FOLDED.forEach(function(d){
  var g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(d.w,d.h,TH),faceMat));
  [[0, d.h/2,0, d.w+E, false,'T'],[0,-d.h/2,0, d.w+E, false,'Bo'],
   [-d.w/2,0,0, d.h+E, true,'L'],[ d.w/2,0,0, d.h+E, true,'R']].forEach(function(bd){
    var geo=bd[4]?new THREE.BoxGeometry(E,bd[3],E):new THREE.BoxGeometry(bd[3],E,E);
    var st=new THREE.Mesh(geo,edgeMat);
    st.position.set(bd[0],bd[1],0);
    var ek=EK(d.fk,BORDER_MAP[d.fk][bd[5]]);
    st.userData.edgeKey=ek;
    sticksByEdge[ek].push(st);
    g.add(st);
  });
  g.position.set(d.pos[0],d.pos[1],d.pos[2]);
  if(d.rot[0]==='y') g.rotation.y=d.rot[1]; else g.rotation.x=d.rot[1];
  root.add(g);
 });

/* ============ 内部虚线（折叠态被挡的三条棱） ============ */
  var X=W/2, Y=H/2, ZB=-D/2;
var DG={};
var mkDash=function(ek,a,b){
  var g=new THREE.Group(); g.renderOrder=5;
  dashedSeg(g,a,b);
  g.visible=false; root.add(g); DG[ek]=g;
};
mkDash(EK('F','R'),[ X,-Y,0],[ X, Y,0]);
mkDash(EK('F','L'),[-X,-Y,0],[-X, Y,0]);
mkDash(EK('F','T'),[-X, Y,0],[ X, Y,0]);
mkDash(EK('F','Bo'),[-X,-Y,0],[ X,-Y,0]);
mkDash(EK('B','R'),[ X,-Y,ZB],[ X, Y,ZB]);
mkDash(EK('B','L'),[-X,-Y,ZB],[-X, Y,ZB]);
mkDash(EK('B','T'),[-X, Y,ZB],[ X, Y,ZB]);
mkDash(EK('B','Bo'),[-X,-Y,ZB],[ X,-Y,ZB]);
mkDash(EK('R','T'),[ X, Y,0],[ X, Y,ZB]);
mkDash(EK('R','Bo'),[ X,-Y,0],[ X,-Y,ZB]);
mkDash(EK('L','T'),[-X, Y,0],[-X, Y,ZB]);
mkDash(EK('L','Bo'),[-X,-Y,0],[-X,-Y,ZB]);
}

/* ============ 姿态与可见性 ============ */
rig.rotation.y=-0.52; rig.rotation.x=0.30;
camera.position.set(0,0.2,9.2);
camera.lookAt(0,0,0);

/* 被挡棱判定：两面都背对相机 → 实线隐藏、虚线显示 */
var view=camera.position.clone().normalize();
var n1=new THREE.Vector3(), n2=new THREE.Vector3();
Object.keys(EDGES).forEach(function(ek){
  var ed=EDGES[ek];
  n1.set(ed.n1[0],ed.n1[1],ed.n1[2]).applyQuaternion(rig.quaternion);
  n2.set(ed.n2[0],ed.n2[1],ed.n2[2]).applyQuaternion(rig.quaternion);
  var hidden=(n1.dot(view)<0)&&(n2.dot(view)<0);
  var dl=DG?DG[ek]:null, ss=sticksByEdge[ek];
  if(dl) dl.visible=hidden;
  if(ss) for(var i=0;i<ss.length;i++) ss[i].visible=!hidden;
});

/* ============ 曲面形：圆柱 / 球 ============ */
if (SHAPE==='cylinder'){
  var R=D/2, CH=H;
  var lat=new THREE.Mesh(new THREE.CylinderGeometry(R,R,CH,48,1,true),
    new THREE.MeshLambertMaterial({color:COLOR,transparent:true,opacity:0.72,depthWrite:false,side:THREE.DoubleSide}));
  var capT=new THREE.Mesh(new THREE.CircleGeometry(R,48),
    new THREE.MeshLambertMaterial({color:COLOR,transparent:true,opacity:0.78,depthWrite:false,side:THREE.DoubleSide}));
  capT.rotation.x=-Math.PI/2; capT.position.y=CH/2;
  var capB=capT.clone(); capB.position.y=-CH/2;
  root.add(lat,capT,capB);
  /* 相机方位（rig 局部系） */
  var v=camera.position.clone().applyQuaternion(new THREE.Quaternion().copy(rig.quaternion).invert());
  var phi=Math.atan2(v.z,v.x), tube=E/2;
  /* 顶部整圈实线 */
  var rimT=new THREE.Mesh(new THREE.TorusGeometry(R,tube,10,72),edgeMat);
  rimT.rotation.x=-Math.PI/2; rimT.position.y=CH/2; root.add(rimT);
  /* 底部前半圈实线（弧中心朝相机），两端加圆帽 */
  var rimF=new THREE.Mesh(new THREE.TorusGeometry(R,tube,10,48,Math.PI),edgeMat);
  rimF.rotation.order='ZXY';
  rimF.rotation.x=-Math.PI/2; rimF.rotation.z=-phi-Math.PI/2; rimF.position.y=-CH/2; root.add(rimF);
  var capGeo=new THREE.SphereGeometry(tube*1.4,10,10);
  [phi+Math.PI/2, phi-Math.PI/2].forEach(function(th){
    var cap=new THREE.Mesh(capGeo,edgeMat);
    cap.position.set(R*Math.cos(th),-CH/2-E/2,R*Math.sin(th));
    root.add(cap);
  });
  /* 两侧竖轮廓线 */
  [phi+Math.PI/2, phi-Math.PI/2].forEach(function(th){
    var line=new THREE.Mesh(new THREE.BoxGeometry(E,CH+E,E),edgeMat);
    line.position.set(R*Math.cos(th),0,R*Math.sin(th));
    root.add(line);
  });
  /* 底部后半圈粗虚线（被挡）：沿弧长均匀、切向对齐的扁平虚线段 */
  var dash=0.26, gap=0.16;
  var arcLen=Math.PI*R;
  var n=Math.max(5,Math.round(arcLen/(dash+gap)));
  var step=arcLen/n;
  var start=phi+Math.PI/2;
  var geoD=new THREE.BoxGeometry(dash,0.05,E);
  var dg=new THREE.Group(); dg.renderOrder=5;
  for(var i=0;i<n;i++){
    var th=start+(i*step+dash/2)/R;
    var m=new THREE.Mesh(geoD,dashMat);
    m.position.set(R*Math.cos(th),-CH/2,R*Math.sin(th));
    m.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),
      new THREE.Vector3(-Math.sin(th),0,Math.cos(th)));
    dg.add(m);
  }
  root.add(dg);
}
if (SHAPE==='ball'){
  var R2=W/2;
  var sph=new THREE.Mesh(new THREE.SphereGeometry(R2,48,32),
    new THREE.MeshLambertMaterial({color:COLOR,transparent:true,opacity:0.88,depthWrite:false}));
  root.add(sph);
  /* 正对相机的轮廓圆 */
  var v2=camera.position.clone().applyQuaternion(new THREE.Quaternion().copy(rig.quaternion).invert());
  var dir=v2.clone().normalize();
  var ring=new THREE.Mesh(new THREE.TorusGeometry(R2*0.99,E/2,10,72),edgeMat);
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir);
  root.add(ring);
  /* 中部倾斜虚线大圆：沿圆周均匀的扁平虚线段 */
  var eq=new THREE.Group(); eq.renderOrder=5;
  eq.rotation.x=0.38; eq.rotation.z=-0.14;
  var rr=R2*0.99, dash=0.26, gap=0.16;
  var n=Math.floor((2*Math.PI*rr)/(dash+gap));
  var geoE=new THREE.BoxGeometry(dash,0.04,0.04);
  for(var k=0;k<n;k++){
    var th=k*(dash+gap)/rr;
    var m=new THREE.Mesh(geoE,dashMat);
    m.position.set(rr*Math.cos(th),rr*Math.sin(th),0);
    m.rotation.z=th+Math.PI/2;
    m.renderOrder=5;
    eq.add(m);
  }
  root.add(eq);
}
renderer.render(scene,camera);
})();
</script>
</body>
</html>
