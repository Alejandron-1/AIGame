<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧱 立体图形小镇 · 认识立体图形（一年级公开课课件）</title>
<!-- ============================================================
     立体图形小镇 · 单文件离线课件（Block Town 同款结构 + 自家课本内容）
     翻页课件（16 页）+ 四个互动游戏内嵌，方向键/翻页笔(PgUp/PgDn)/按钮翻页
     素材：老师《认识图形》PPT 实拍图片（已抠图内嵌）
     构建：本模板经 构建单文件.py 把 ASSET:名 替换为 base64 后即成单文件
============================================================ -->
<style>
/* ================= 基础与配色 ================= */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
    --bg:#faf6ee; --ink:#3f3a34; --line:#3f3a34;
    --cuboid:#f5a35c; --cuboid-d:#e08b45; --cuboid-l:#ffc28e;
    --cube:#7fb2e5;   --cube-d:#5f92c9;   --cube-l:#a9cdf0;
    --cyl:#7fc8a8;    --cyl-d:#5fae8c;    --cyl-l:#a8dfc6;
    --ball:#f2a6b8;   --ball-d:#dd8497;   --ball-l:#f9c6d1;
    --gold:#ffce4f;
}
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); }
body { font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif; color:var(--ink); }
button { font-family:inherit; cursor:pointer; }

/* ================= 课件翻页框架 ================= */
#deck { position:fixed; inset:0; }
.slide { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
         padding:56px 40px 84px; overflow:hidden; }
.slide.on { display:flex; animation:slideIn .45s cubic-bezier(.22,1.2,.36,1); }
@keyframes slideIn { from { opacity:0; transform:translateX(60px) scale(.985); } to { opacity:1; transform:none; } }
.slide.on.rev { animation:slideInR .45s cubic-bezier(.22,1.2,.36,1); }
@keyframes slideInR { from { opacity:0; transform:translateX(-60px) scale(.985); } to { opacity:1; transform:none; } }

#chrome { position:fixed; z-index:900; pointer-events:none; }
#lessonChip { position:fixed; top:14px; left:16px; z-index:900; background:#fff; border:2.5px solid var(--line);
    border-radius:999px; padding:5px 16px 5px 10px; font-size:15px; font-weight:700; box-shadow:0 3px 0 rgba(63,58,52,.15);
    pointer-events:none; display:flex; align-items:center; gap:6px; }
#pageno { position:fixed; bottom:16px; left:18px; z-index:900; font-size:15px; font-weight:800; color:#9a938a;
    background:#fff; border:2px solid #e8e1d4; border-radius:10px; padding:3px 12px; pointer-events:none; }
#navbtns { position:fixed; bottom:14px; right:16px; z-index:950; display:flex; gap:10px; }
#navbtns button { width:52px; height:44px; border-radius:14px; border:3px solid var(--line); background:#fff;
    font-size:20px; font-weight:900; box-shadow:0 4px 0 rgba(63,58,52,.2); transition:transform .12s; }
#navbtns button:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(63,58,52,.2); }
#fsBtn { position:fixed; top:14px; right:16px; z-index:950; width:46px; height:38px; border-radius:12px;
    border:2.5px solid var(--line); background:#fff; font-size:17px; box-shadow:0 3px 0 rgba(63,58,52,.2); }
#progress { position:fixed; top:0; left:0; height:5px; background:linear-gradient(90deg,var(--cuboid),var(--cube),var(--cyl),var(--ball));
    z-index:960; transition:width .35s; border-radius:0 4px 4px 0; }

/* ================= 通用组件 ================= */
.htitle { font-size:clamp(30px,4.4vw,52px); font-weight:900; letter-spacing:2px; margin-bottom:6px; text-align:center; }
.htitle em { font-style:normal; color:#f0831f; }
.hsub { font-size:clamp(15px,1.6vw,20px); color:#8b8378; font-weight:700; margin-bottom:22px; text-align:center; }
.card { background:#fff; border:3px solid var(--line); border-radius:22px; box-shadow:0 8px 0 rgba(63,58,52,.10); }
.pill { display:inline-flex; align-items:center; gap:8px; background:#fff; border:3px solid var(--line);
    border-radius:999px; padding:10px 24px; font-weight:800; font-size:clamp(16px,1.7vw,22px); box-shadow:0 5px 0 rgba(63,58,52,.12); }
.bigbtn { background:var(--gold); border:3.5px solid var(--line); border-radius:18px; padding:14px 34px;
    font-size:clamp(18px,2vw,26px); font-weight:900; box-shadow:0 6px 0 #c99a1f; transition:transform .12s, box-shadow .12s; }
.bigbtn:active { transform:translateY(5px); box-shadow:0 1px 0 #c99a1f; }
.bigbtn.pulse { animation:pulse 1.1s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
.minibtn { background:#fff; border:2.5px solid var(--line); border-radius:12px; padding:7px 16px; font-weight:800;
    font-size:15px; box-shadow:0 3px 0 rgba(63,58,52,.15); }
.minibtn:active { transform:translateY(2px); box-shadow:none; }
.tag { font-size:14px; font-weight:800; color:#fff; border-radius:999px; padding:3px 12px; }
.t-cuboid{background:var(--cuboid-d)} .t-cube{background:var(--cube-d)} .t-cyl{background:var(--cyl-d)} .t-ball{background:var(--ball-d)}

.toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(30px); z-index:980;
    background:#fff; border:3px solid var(--line); border-radius:18px; padding:12px 26px; font-size:clamp(16px,1.8vw,22px);
    font-weight:800; box-shadow:0 8px 24px rgba(63,58,52,.25); opacity:0; transition:all .3s; pointer-events:none; max-width:80vw; text-align:center; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* 卡通图形动画 */
.wob { animation:wob 2.6s ease-in-out infinite; transform-origin:50% 90%; }
@keyframes wob { 0%,100%{transform:rotate(-2.2deg)} 50%{transform:rotate(2.2deg)} }
.pop { animation:pop .55s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { 0%{transform:scale(0) rotate(-12deg)} 70%{transform:scale(1.12) rotate(3deg)} 100%{transform:scale(1)} }
.flipout { animation:flipout .38s ease-in forwards; }
@keyframes flipout { to { transform:rotateY(90deg) scale(.4); opacity:0; } }
.bounceIn { animation:bounceIn .6s cubic-bezier(.2,1.4,.4,1); }
@keyframes bounceIn { 0%{transform:translateY(-40px) scale(.3); opacity:0} 60%{transform:translateY(6px) scale(1.06)} 100%{transform:none; opacity:1} }
.jiggle { animation:jiggle .5s; }
@keyframes jiggle { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
.fall { animation:fall 1s cubic-bezier(.3,1.2,.5,1) both; }
@keyframes fall { from{transform:translateY(-70vh) rotate(-14deg); opacity:0} to{transform:none; opacity:1} }
.floaty { animation:floaty 3s ease-in-out infinite; }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }

/* 网格地面（游戏舞台） */
.gridfloor { background:
    linear-gradient(rgba(63,58,52,.07) 1.5px, transparent 1.5px),
    linear-gradient(90deg, rgba(63,58,52,.07) 1.5px, transparent 1.5px);
    background-size:44px 44px, 44px 44px; }

/* ================= 封面 ================= */
#cover .town { margin-top:8px; }
.cover-shapes { display:flex; gap:2vw; align-items:flex-end; justify-content:center; flex-wrap:wrap; }
.cover-shapes svg { width:clamp(56px,12vw,150px); height:auto; }

/* ================= 情境导入（课本P4） ================= */
.shelfrow { display:flex; gap:clamp(10px,1.8vw,26px); justify-content:center; align-items:flex-end; flex-wrap:wrap; }
.shelfitem { display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .15s; }
.shelfitem img { height:clamp(64px,10vh,110px); filter:drop-shadow(0 5px 6px rgba(63,58,52,.18)); }
.shelfitem:hover { transform:translateY(-8px) scale(1.05); }
.shelfitem .nm { font-size:15px; font-weight:800; background:#fff; border:2px solid var(--line); border-radius:999px; padding:2px 12px; opacity:0; transform:translateY(6px); transition:all .25s; }
.shelfitem.picked .nm { opacity:1; transform:none; }
.shelfitem.picked img { animation:hop .5s; }
@keyframes hop { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-16px) rotate(-4deg)} 70%{transform:translateY(0)} 85%{transform:translateY(-6px)} }

/* ================= 分一分引入 ================= */
.idearow { display:flex; gap:22px; justify-content:center; flex-wrap:wrap; }
.ideacard { width:min(300px,26vw); padding:20px; text-align:center; cursor:pointer; transition:transform .15s; }
.ideacard:hover { transform:translateY(-6px); }
.ideacard .ic { font-size:44px; }
.ideacard h3 { font-size:clamp(17px,1.8vw,22px); margin:8px 0; }
.ideacard p { font-size:clamp(13px,1.4vw,16px); color:#7c746a; line-height:1.7; min-height:3.4em; }

/* ================= 图形名片 ================= */
.namegrid { display:flex; gap:clamp(12px,2vw,30px); flex-wrap:wrap; justify-content:center; }
.namecard { width:clamp(150px,17vw,230px); padding:18px 12px 14px; text-align:center; cursor:pointer; transition:transform .18s; }
.namecard:hover { transform:translateY(-8px) rotate(-1.5deg); }
.namecard .nm { font-size:clamp(19px,2vw,26px); font-weight:900; margin-top:8px; }
.namecard .ft { font-size:14px; color:#8b8378; font-weight:700; margin-top:5px; line-height:1.5; min-height:2.8em; }

/* ================= 特征页 ================= */
.featwrap { display:flex; gap:clamp(20px,3.4vw,54px); align-items:flex-start; justify-content:center; width:min(1380px,100%); flex-wrap:wrap; }
.featleft { text-align:center; }
.featshape { cursor:pointer; }
.featright { max-width:560px; flex:1 1 380px; }
.featline { display:flex; gap:10px; align-items:flex-start; background:#fff; border:3px solid var(--line); border-radius:16px;
    padding:12px 16px; margin-bottom:12px; font-size:clamp(16px,1.7vw,21px); font-weight:800; opacity:0; transform:translateX(30px);
    transition:all .4s cubic-bezier(.2,1.2,.4,1); box-shadow:0 4px 0 rgba(63,58,52,.1); }
.featline.show { opacity:1; transform:none; }
.featline .no { flex:0 0 30px; height:30px; border-radius:50%; background:var(--gold); border:2.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; }
.liferow { display:flex; gap:14px; margin-top:16px; flex-wrap:wrap; }
.lifeitem { text-align:center; background:#fff; border:2.5px solid var(--line); border-radius:14px; padding:8px 10px 5px; }
.lifeitem img { height:56px; display:block; margin:0 auto; }
.lifeitem div { font-size:13px; font-weight:800; color:#7c746a; margin-top:2px; }
.fan { display:flex; justify-content:center; gap:6px; margin-top:10px; height:64px; }
.fanface { width:44px; height:52px; border:2.5px solid var(--line); border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-weight:900; font-size:18px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25);
    animation:bounceIn .4s both; }
.revealbtns { display:flex; gap:12px; margin:12px 0; flex-wrap:wrap; }
.revcard { background:#fff; border:3px solid var(--line); border-radius:16px; padding:12px 18px; font-weight:800;
    font-size:clamp(15px,1.6vw,19px); display:none; }
.revcard.show { display:block; animation:bounceIn .45s; }
.judgerow { display:flex; gap:18px; margin-top:10px; justify-content:center; flex-wrap:wrap; }
.judgeitem { text-align:center; cursor:pointer; }
.judgeitem .slot { width:64px; height:64px; margin:6px auto 0; border-radius:14px; border:3px dashed #c9c1b2;
    display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:900; }
.judgeitem.ok .slot { border-style:solid; border-color:#4caf7d; color:#4caf7d; }
.judgeitem.no .slot { border-style:solid; border-color:#e05d5d; color:#e05d5d; }

/* ================= 游戏1 实物变图形 ================= */
.g1stage { position:relative; width:min(1180px,100%); height:min(56vh,470px); margin-top:4px; }
.g1item { position:absolute; transform:translate(-50%,-100%); cursor:pointer; transition:transform .15s; }
.g1item img { width:auto; height:auto; max-height:clamp(56px,9.5vh,92px); max-width:clamp(84px,20vw,160px); display:block; filter:drop-shadow(0 6px 5px rgba(63,58,52,.22)); }
.g1item:hover { transform:translate(-50%,-100%) translateY(-7px) scale(1.05); }
.g1item .ck { position:absolute; right:-14px; top:-14px; width:30px; height:30px; background:#59c98b; border:2.5px solid var(--line);
    border-radius:50%; color:#fff; font-weight:900; display:none; align-items:center; justify-content:center; font-size:16px; }
.g1item.done .ck { display:flex; }
.g1shape { position:absolute; transform:translate(-50%,-88%); pointer-events:none; }
.g1lineup { display:none; gap:clamp(16px,3vw,54px); align-items:flex-end; justify-content:center; margin-top:10px; }
.g1lu { text-align:center; }
.g1lu .nm { margin-top:6px; font-weight:900; font-size:clamp(16px,1.8vw,22px); color:#fff; border-radius:999px; padding:4px 18px; display:inline-block; }

/* ================= 游戏2 我说你猜 ================= */
.g2wrap { display:flex; gap:clamp(14px,2vw,30px); width:min(1340px,100%); align-items:stretch; justify-content:center; flex-wrap:wrap; }
.g2panel { flex:0 1 340px; padding:14px; display:flex; flex-direction:column; gap:10px; max-height:62vh; overflow:auto; }
.riddle { border:2.5px solid var(--line); border-radius:14px; padding:10px 12px; cursor:pointer; background:#fffdf6; font-weight:700; font-size:15px; transition:all .15s; }
.riddle:hover { transform:translateX(4px); }
.riddle.on { background:#fff3d6; border-color:#e0a52e; }
.riddle b { color:#f0831f; }
.g2stage { flex:1 1 460px; min-height:min(56vh,470px); position:relative; border-radius:26px; overflow:hidden;
    border:3.5px solid var(--line); box-shadow:0 10px 0 rgba(63,58,52,.1); }
.g2floor { position:absolute; inset:auto 0 0 0; height:34%; background:linear-gradient(#e9dfc8,#dccfae); }
.g2shapebox { position:absolute; left:50%; bottom:16%; transform:translateX(-50%); }
.g2bubble { position:absolute; left:50%; bottom:calc(16% + 190px); transform:translateX(-50%); background:#fff; border:3px solid var(--line);
    border-radius:16px; padding:8px 18px; font-weight:900; font-size:clamp(15px,1.7vw,20px); opacity:0; transition:all .3s; white-space:nowrap; }
.g2bubble.show { opacity:1; }
.curtain { position:absolute; inset:0; z-index:5; transition:transform 1s cubic-bezier(.6,0,.3,1);
    background:repeating-linear-gradient(90deg,#e56a8c 0 44px,#d95a7e 44px 88px); border-bottom:14px solid var(--gold);
    box-shadow:inset 0 -30px 60px rgba(0,0,0,.15); display:flex; align-items:flex-end; justify-content:center; }
.curtain.up { transform:translateY(-104%); }
.curtain .tassel { position:absolute; bottom:-14px; left:0; right:0; height:14px;
    background:radial-gradient(circle at 22px -4px, var(--gold) 12px, transparent 13px); background-size:44px 14px; }
.g2btns { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-content:start; }
.g2btns button { border:3px solid var(--line); border-radius:18px; padding:12px 8px; font-weight:900; font-size:clamp(15px,1.6vw,19px);
    color:#fff; box-shadow:0 5px 0 rgba(63,58,52,.25); transition:transform .12s; }
.g2btns button:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(63,58,52,.25); }
.hintbox { border:2.5px dashed #c9c1b2; border-radius:12px; padding:8px 12px; min-height:60px; font-weight:800; color:#6d655a; }
.hintbox .hl { display:block; animation:bounceIn .4s both; }
.hintbox input { width:100%; border:none; border-bottom:2px solid #d8d0c0; background:transparent; font-weight:800; font-size:15px; padding:5px 2px; outline:none; font-family:inherit; }

/* ================= 游戏3 分一分 ================= */
.g3top { display:flex; gap:clamp(10px,1.6vw,24px); justify-content:center; width:min(1300px,100%); flex-wrap:wrap; }
.home { flex:0 1 210px; text-align:center; padding:10px 8px 12px; position:relative; transition:transform .15s; }
.home .hz { height:74px; border-radius:12px; border:3px dashed rgba(63,58,52,.35); display:flex; align-items:flex-end;
    justify-content:center; gap:4px; padding:4px; overflow:hidden; flex-wrap:wrap; transition:all .2s; }
.home.hot .hz { border-color:#f0831f; background:#fff8e8; transform:scale(1.04); }
.home .hnm { margin-top:8px; font-weight:900; font-size:clamp(14px,1.5vw,18px); }
.g3mid { position:relative; width:min(1300px,100%); flex:1; min-height:150px; margin-top:14px; }
.g3chip { position:absolute; transform:translate(-50%,-50%); cursor:grab; touch-action:none; transition:filter .15s; z-index:2; }
.g3chip img { width:auto; height:auto; max-height:clamp(48px,8.5vh,84px); max-width:clamp(84px,22vw,150px); display:block; filter:drop-shadow(0 5px 4px rgba(63,58,52,.2)); }
.g3chip.drag { cursor:grabbing; z-index:50; transition:none; }
.g3chip.drag img { transform:scale(1.15); }
.g3chip.shake { animation:jiggle .5s; }
.g3hud { position:fixed; top:64px; right:18px; z-index:800; display:flex; gap:10px; }
.teamsc { background:#fff; border:3px solid var(--line); border-radius:16px; padding:8px 14px; font-weight:900; font-size:clamp(14px,1.5vw,18px);
    display:flex; align-items:center; gap:8px; box-shadow:0 4px 0 rgba(63,58,52,.12); }
.teamsc.turn { outline:3.5px solid var(--gold); transform:scale(1.05); }
.star { color:var(--gold); text-shadow:0 0 2px #c99a1f; }
.g3prog { position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:800; }
.g3fb { position:fixed; left:50%; bottom:120px; transform:translateX(-50%); z-index:850; background:#fff; border:3px solid var(--line);
    border-radius:16px; padding:10px 24px; font-weight:900; font-size:clamp(16px,1.8vw,21px); opacity:0; transition:all .3s; pointer-events:none; }
.g3fb.show { opacity:1; }
.g3done { position:fixed; inset:0; z-index:900; display:none; align-items:center; justify-content:center; flex-direction:column; gap:18px;
    background:rgba(250,246,238,.94); }
.g3done.show { display:flex; }

/* ================= 数一数 ================= */
.countstage { position:relative; width:min(1000px,100%); height:min(44vh,380px); }
.countshape { position:absolute; transform:translate(-50%,-100%); transition:transform .2s; }
.countshape .cno { position:absolute; top:-30px; left:50%; transform:translateX(-50%); width:34px; height:34px; border-radius:50%;
    background:var(--gold); border:3px solid var(--line); font-weight:900; display:none; align-items:center; justify-content:center; z-index:5; }
.countshape.mark .cno { display:flex; animation:bounceIn .4s both; }
.countshape.mark { animation:hop .5s; }
.countqs { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
.cq { border:3px solid var(--line); border-radius:16px; background:#fff; padding:10px 18px; font-weight:900;
    font-size:clamp(16px,1.8vw,21px); cursor:pointer; box-shadow:0 5px 0 rgba(63,58,52,.12); transition:transform .12s; }
.cq:active { transform:translateY(4px); box-shadow:none; }
.cq b { color:#f0831f; font-size:1.2em; }
.cq.done { background:#fff3d6; }

/* ================= 游戏4 小镇 ================= */
.g4wrap { display:flex; gap:clamp(14px,2.4vw,36px); width:min(1360px,100%); align-items:stretch; justify-content:center; flex-wrap:wrap; }
.g4panel { flex:0 1 360px; padding:18px; display:flex; flex-direction:column; gap:14px; }
.blank { display:inline-block; min-width:96px; border-bottom:3px solid #f0831f; text-align:center; color:#f0831f; font-weight:900; padding:0 6px; }
.wordchips { display:flex; gap:8px; flex-wrap:wrap; }
.wordchips button { border:2.5px solid var(--line); border-radius:999px; padding:6px 14px; font-weight:900; font-size:15px; background:#fff; transition:transform .12s; }
.wordchips button:active { transform:scale(.94); }
.g4town { flex:1 1 560px; position:relative; min-height:min(58vh,500px); overflow:hidden; }
.spot { position:absolute; opacity:0; transform:translateX(120%) rotate(6deg); transition:all .9s cubic-bezier(.2,1.1,.4,1); }
.spot.in { opacity:1; transform:none; }
.spot .snm { position:absolute; left:50%; bottom:-4px; transform:translateX(-50%); background:#fff; border:2.5px solid var(--line);
    border-radius:999px; padding:3px 14px; font-weight:900; font-size:14px; white-space:nowrap; }
.g4ops { display:flex; gap:12px; margin-top:4px; flex-wrap:wrap; }
.award { position:fixed; inset:0; z-index:920; display:none; align-items:center; justify-content:center; flex-direction:column;
    gap:20px; background:rgba(63,58,52,.45); }
.award.show { display:flex; }
.award .acard { padding:30px 44px; text-align:center; }
.trophies { display:flex; gap:34px; justify-content:center; margin:12px 0 6px; }
.trophy { text-align:center; font-weight:900; font-size:clamp(17px,2vw,23px); }
.trophy .cup { font-size:clamp(44px,5vw,68px); animation:floaty 2.2s ease-in-out infinite; display:block; }
.songsheet { font-family:"KaiTi","楷体","STKaiti",serif; }

<script>
'use strict';
/* ================= 素材（构建时替换为 base64） ================= */
const A = {
    basketball:'ASSET:basketball', beachball:'ASSET:beachball', bin:'ASSET:bin', block:'ASSET:block',
    board:'ASSET:board', box:'ASSET:box', dice:'ASSET:dice', football:'ASSET:football', gift:'ASSET:gift',
    glue:'ASSET:glue', greyball:'ASSET:greyball', ink:'ASSET:ink', microwave:'ASSET:microwave',
    pingpong:'ASSET:pingpong', rubik:'ASSET:rubik', rubik_s:'ASSET:rubik_s', shoebox:'ASSET:shoebox',
    tea:'ASSET:tea', tissue:'ASSET:tissue', toothpaste:'ASSET:toothpaste', woodcube:'ASSET:woodcube'

/* ================= 小工具 ================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t, ms=1900) {
    const el = $('#toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms);
}
/* ================= 音效（Web Audio 合成，首次点击后出声） ================= */
const SND = {
    ctx: null,
    ac() { if (!this.ctx) { try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } 
           if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
    tone(f, t0, dur, type='sine', vol=.22, slide=0) {
        const c = this.ac(); if (!c) return;
        const o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.setValueAtTime(f, c.currentTime + t0);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide), c.currentTime + t0 + dur);
        g.gain.setValueAtTime(0, c.currentTime + t0);
        g.gain.linearRampToValueAtTime(vol, c.currentTime + t0 + .015);
        g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t0 + dur);
        o.connect(g); g.connect(c.destination);
        o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
    },
    click() { this.tone(660, 0, .07, 'triangle', .18); },
    pop()    { this.tone(440, 0, .16, 'triangle', .25, 520); },
    good()   { [523,659,784].forEach((f,i)=>this.tone(f, i*.09, .16, 'triangle', .22)); },
    bad()    { this.tone(196, 0, .28, 'sawtooth', .12, -60); },
    win()    { [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f, i*.11, .2, 'triangle', .25)); },
    star()   { this.tone(1319, 0, .12, 'triangle', .2); this.tone(1760, .08, .18, 'triangle', .2); },
    fanfare(){ [392,523,659,784,659,784,1047].forEach((f,i)=>this.tone(f, i*.14, .26, 'triangle', .26));
               [392,523,659,784].forEach((f,i)=>this.tone(f/2, i*.14, .3, 'sine', .12)); }
};
window.addEventListener('pointerdown', () => SND.ac(), { once:true });
/* ================= 彩纸 / 烟花 ================= */
const CV = $('#cv'), CX = CV.getContext('2d');
let parts = [], cvRunning = false;
function cvSize() { CV.width = innerWidth; CV.height = innerHeight; }
cvSize(); addEventListener('resize', cvSize);
const PCOLORS = ['#f5a35c','#7fb2e5','#7fc8a8','#f2a6b8','#ffce4f','#8ed081'];
function confetti(x, y, n=26, spread=1) {
    for (let i=0; i<n; i++) parts.push({
        x, y, vx:(Math.random()-.5)*11*spread, vy:(Math.random()*-9)-4, g:.32,
        s:5+Math.random()*6, c:PCOLORS[i%PCOLORS.length], r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life:90+Math.random()*40
    });
    cvRun();
}
function fireworks(n=5) {
    for (let i=0; i<n; i++) setTimeout(() => confetti(
        innerWidth*(.15+Math.random()*.7), innerHeight*(.12+Math.random()*.4), 34, 1.3), i*260);
    cvRun();
}
function cvRun() {
    if (cvRunning) return; cvRunning = true;
    (function loop() {
        CX.clearRect(0,0,CV.width,CV.height);
        parts = parts.filter(p => p.life > 0);
        for (const p of parts) {
            p.x += p.vx; p.y += p.vy; p.vy += p.g; p.r += p.vr; p.life--;
            CX.save(); CX.translate(p.x,p.y); CX.rotate(p.r);
            CX.fillStyle = p.c; CX.globalAlpha = Math.min(1, p.life/28);
            CX.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62); CX.restore();
        }
        if (parts.length) requestAnimationFrame(loop); else { cvRunning = false; CX.clearRect(0,0,CV.width,CV.height); }
    })();
}
/* ================= 卡通图形 SVG 生成器 ================= */
const SHAPES = {
    cuboid: { name:'长方体', color:'var(--cuboid)',  dark:'var(--cuboid-d)', light:'var(--cuboid-l)', tag:'t-cuboid' },
    cube:   { name:'正方体', color:'var(--cube)',    dark:'var(--cube-d)',   light:'var(--cube-l)',   tag:'t-cube' },
    cyl:    { name:'圆柱',   color:'var(--cyl)',     dark:'var(--cyl-d)',    light:'var(--cyl-l)',    tag:'t-cyl' },
    ball:   { name:'球',     color:'var(--ball)',    dark:'var(--ball-d)',   light:'var(--ball-l)',   tag:'t-ball' },
    cylTaper:{ name:'圆台',  color:'var(--cyl)',     dark:'var(--cyl-d)',    light:'var(--cyl-l)',    tag:'t-cyl' },
    cone:   { name:'圆锥',   color:'var(--cyl)',     dark:'var(--cyl-d)',    light:'var(--cyl-l)',    tag:'t-cyl' }
};
function faceSVG(cx, cy, k=1) {  /* 笑脸（cx,cy 为脸中心） */
    const e = 13*k, r = 5.2*k;
    return `<g>
      <circle cx="${cx-e}" cy="${cy}" r="${r}" fill="#3f3a34"/>
      <circle cx="${cx+e}" cy="${cy}" r="${r}" fill="#3f3a34"/>
      <circle cx="${cx-e+1.6}" cy="${cy-1.6}" r="1.7" fill="#fff"/>
      <circle cx="${cx+e+1.6}" cy="${cy-1.6}" r="1.7" fill="#fff"/>
      <path d="M${cx-9*k},${cy+8*k} Q${cx},${cy+(8+9)*k} ${cx+9*k},${cy+8*k}" stroke="#3f3a34" stroke-width="${3*k}" fill="none" stroke-linecap="round"/>
      <ellipse cx="${cx-20*k}" cy="${cy+9*k}" rx="${6*k}" ry="${3.6*k}" fill="#ff8f8f" opacity=".55"/>
      <ellipse cx="${cx+20*k}" cy="${cy+9*k}" rx="${6*k}" ry="${3.6*k}" fill="#ff8f8f" opacity=".55"/>
    </g>`;
}
function shapeSVG(shape, size=150, opt={}) {
    const S = SHAPES[shape], o = opt.face !== false;
    const line = 'stroke="#3f3a34" stroke-width="4" stroke-linejoin="round"';
    let body = '';
    if (shape === 'cuboid') {
        body = `<polygon points="16,78 54,42 212,42 174,78" fill="${S.light}" ${line}/>
                <polygon points="174,78 212,42 212,112 174,148" fill="${S.dark}" ${line}/>
                <rect x="16" y="78" width="158" height="70" rx="6" fill="${S.color}" ${line}/>`
                + (o ? faceSVG(95,113) : '');
    } else if (shape === 'cube') {
        body = `<polygon points="46,80 78,48 186,48 154,80" fill="${S.light}" ${line}/>
                <polygon points="154,80 186,48 186,160 154,192" fill="${S.dark}" ${line}/>
                <rect x="46" y="80" width="108" height="112" rx="6" fill="${S.color}" ${line}/>`
                + (o ? faceSVG(100,132) : '');
    } else if (shape === 'cyl') {
        body = `<path d="M46,62 L46,152 A54,17 0 0 0 154,152 L154,62" fill="${S.color}" ${line}/>
                <ellipse cx="100" cy="62" rx="54" ry="17" fill="${S.light}" ${line}/>`
                + (o ? faceSVG(100,112) : '');
    } else if (shape === 'cylTaper') {           /* 圆台（两头不一样粗） */
        body = `<path d="M52,66 L72,150 A28,10 0 0 0 128,150 L148,66" fill="${S.color}" ${line}/>
                <ellipse cx="100" cy="66" rx="48" ry="15" fill="${S.light}" ${line}/>` + (o ? faceSVG(100,110,.9) : '');
    } else if (shape === 'cone') {               /* 圆锥 */
        body = `<path d="M100,42 L58,156 A42,13 0 0 0 142,156 Z" fill="${S.color}" ${line}/>
                <ellipse cx="100" cy="156" rx="42" ry="13" fill="${S.dark}" ${line}/>` + (o ? faceSVG(100,108,.85) : '');
    } else {  /* ball */
        body = `<defs><radialGradient id="bg_${opt.uid||'x'}" cx="38%" cy="32%" r="75%">
                  <stop offset="0%" stop-color="${S.light}"/><stop offset="62%" stop-color="${S.color}"/><stop offset="100%" stop-color="${S.dark}"/>
                </radialGradient></defs>
                <circle cx="100" cy="102" r="68" fill="url(#bg_${opt.uid||'x'})" ${line}/>
                <ellipse cx="72" cy="66" rx="17" ry="9" fill="#fff" opacity=".55" transform="rotate(-24 72 66)"/>`
                + (o ? faceSVG(100,112,1.02) : '');
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 220 210" style="display:block">${body}</svg>`;
}
const IMG = (k, h) => `<img src="${A[k]}" ${h?`style="height:${h}px"`:''} alt="" draggable="false">`;
/* ================= 翻页框架 ================= */
const SLIDES = [];
let cur = -1;
function regSlide(def) { SLIDES.push(def); }
function renderDeck() {
    $('#deck').innerHTML = SLIDES.map((s,i) =>
        `<section class="slide ${s.cls||''}" id="sl-${s.id}">${s.html()}</section>`).join('');
    SLIDES.forEach(s => { if (s.init) s.init($('#sl-'+s.id)); });
}
function go(i, back) {
    i = Math.max(0, Math.min(SLIDES.length-1, i));
    if (i === cur) return;
    if (cur >= 0) {
        const old = SLIDES[cur]; if (old.leave) old.leave();
        $('#sl-'+old.id).classList.remove('on','rev');
    }
    cur = i;
    const s = SLIDES[i], el = $('#sl-'+s.id);
    el.classList.toggle('rev', !!back);
    el.classList.add('on');
    $('#pageno').textContent = `${i+1} / ${SLIDES.length}`;
    $('#progress').style.width = ((i+1)/SLIDES.length*100) + '%';
    try { history.replaceState(null, '', '#' + s.id); } catch(e) {}
    if (s.enter) s.enter();
}
function goId(id, back) { const i = SLIDES.findIndex(s => s.id === id); if (i >= 0) go(i, back); }
$('#nextB').onclick = () => { SND.click(); go(cur+1); };
$('#prevB').onclick = () => { SND.click(); go(cur-1, true); };
$('#fsBtn').onclick = () => {
    SND.click();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen && document.exitFullscreen();
};
addEventListener('keydown', e => {
    if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { e.preventDefault(); go(cur+1); }
    else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); go(cur-1, true); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(SLIDES.length-1);
    else if (e.key === 'f' || e.key === 'F') $('#fsBtn').click();
});
addEventListener('resize', () => { if (SLIDES[cur] && SLIDES[cur].resize) SLIDES[cur].resize(); });
/* ================= 封面 ================= */
regSlide({
    id:'cover', title:'封面',
    html: () => `
        <div style="font-size:15px;font-weight:800;color:#b3aa9c;letter-spacing:6px;margin-bottom:10px">一年级数学 · 上册 · 公开课</div>
        <div class="htitle" style="font-size:clamp(44px,6.4vw,84px)">认识<em>立体图形</em></div>
        <div class="hsub" style="font-size:clamp(18px,2.2vw,26px)">🧱 立体图形小镇 · 一起玩，一起学</div>
        <div class="cover-shapes town" style="margin:12px 0 26px">
            <div class="wob" style="animation-delay:-.4s">${shapeSVG('cuboid',150)}</div>
            <div class="wob">${shapeSVG('cube',132)}</div>
            <div class="wob" style="animation-delay:-1.2s">${shapeSVG('cyl',150)}</div>
            <div class="wob" style="animation-delay:-.8s">${shapeSVG('ball',128)}</div>
        </div>
        <button class="bigbtn pulse" id="coverGo">开始上课 ➜</button>
        <div style="margin-top:16px;font-size:14px;color:#b3aa9c;font-weight:700">翻页：方向键 / 空格 / 翻页笔 PgDn·PgUp　|　全屏：F</div>`,
    init(el) {
        el.querySelector('#coverGo').onclick = () => { SND.good(); confetti(innerWidth/2, innerHeight*.6, 40); go(1); };
    },
    enter() { fireworks(3); }
});
/* ================= 情境导入（课本 P4） ================= */
const CTX_ITEMS = [
    ['basketball','篮球'],['toothpaste','牙膏盒'],['glue','胶棒'],['rubik_s','魔方'],['ink','墨水盒'],
    ['tea','茶叶筒'],['shoebox','鞋盒'],['block','积木'],['pingpong','乒乓球'],['board','砧板']
];
regSlide({
    id:'context', title:'情境导入',
    html: () => `
        <div class="htitle">超市的小货物 <em>摆乱啦</em>！</div>
        <div class="hsub">说一说图中有哪些物品？你能把它们分分类吗？（点一点，报出它的名字）</div>
        <div class="gridfloor card" style="width:min(1200px,100%);padding:34px 20px 26px">
            <div class="shelfrow" style="margin-bottom:34px">${CTX_ITEMS.slice(0,5).map(i=>`

/* ================= 分一分引入（课本 P5-8） ================= */
regSlide({
    id:'sortintro', title:'分一分',
    html: () => `
        <div class="htitle">怎么分 <em>才好呢</em>？</div>

        <div class="idearow">
            <div class="ideacard card" data-t="我按「能否滚动」分类：钢笔墨水滚不动，牙膏可以滚来滚去。">

                <div class="ic">🧱</div><h3>按 材料 分</h3><p>纸做的、金属做的、塑料做的……</p></div>
            <div class="ideacard card" data-t="我把「方方正正」的放在一起，把「圆圆的、可以滚来滚去」的放在一起。">
                <div class="ic">⭐</div><h3>按 形状 分</h3><p>方方的放一起，圆圆的放一起……</p></div>
        </div>
        <div class="pill" style="margin-top:26px">👉 按形状分一分，就是今天的<strong style="color:#f0831f">新本领</strong>！</div>`,
    init(el) {
        el.querySelectorAll('.ideacard').forEach(c => c.onclick = () => { SND.click(); toast(c.dataset.t, 3200); });
    }
});
/* ================= 游戏1 认识小伙伴（实物变图形） ================= */
const G1_ITEMS = [
    ['box','cuboid',15,30],['toothpaste','cuboid',29,30],['rubik','cube',43,30],['dice','cube',56,30],
    ['tea','cyl',69,30],['glue','cyl',82,30],['basketball','ball',24,68],['football','ball',52,68]
];
regSlide({
    id:'game1', title:'第1关 认识小伙伴',
    html: () => `
        <div class="htitle" style="font-size:clamp(26px,3.6vw,42px)">第 1 关 · 认识小伙伴</div>
        <div class="hsub">点一下实物，它会变成图形小伙伴！（再点已变的图形，看看它是谁）</div>
        <div class="g1stage gridfloor card" id="g1stage"></div>
        <div class="g1lineup" id="g1lineup"></div>

        <button class="minibtn" id="g1reset" style="position:absolute;right:26px;bottom:96px">🔁 重来</button>`,
    init(el) {
        const stage = el.querySelector('#g1stage');
        const reset = () => {
            stage.innerHTML = '';
            el.querySelector('#g1lineup').style.display = 'none';
            el.querySelector('#g1next').style.display = 'none';
            el.querySelectorAll('.g1shape').forEach(x => x.remove());
            G1_ITEMS.forEach(([img, shape, x, y], i) => {
                const d = document.createElement('div');
                d.className = 'g1item'; d.style.left = x+'%'; d.style.top = y+'%';
                d.innerHTML = IMG(img) + '<span class="ck">✓</span>';
                d.onclick = () => {
                    if (d.classList.contains('done')) { SND.click(); toast('这是 ' + SHAPES[shape].name + ' 变的！'); return; }
                    SND.pop(); confetti(innerWidth*x/100, innerHeight*.3, 22);

});
function g1Check(el) {

        }).join('');

}
/* ================= 图形名片 ================= */
const NAMECARDS = [
    ['cuboid','长长方方','6 个平平的面，相对的两个面一样大'],
    ['cube','正正方方','6 个平平的面，6 个面一样大'],
    ['cyl','直直的','上下一样粗，两头圆圆的、平平的'],

];
regSlide({
    id:'namecards', title:'图形名片',

function featSlide(def) {

        id: def.id, title: def.title,

            <div class="htitle" style="font-size:clamp(26px,3.6vw,44px)">${def.title}</div>

                    <div class="fan" id="${def.id}-fan"></div>
                    <button class="minibtn" id="${def.id}-face" style="margin-top:6px">🖐 数一数有几个面</button>
                </div>
                <div class="featright">
                    <div class="pill" style="margin-bottom:14px" id="${def.id}-ans">${def.question}　<b style="color:#f0831f">${def.answer}</b></div>
                    <div id="${def.id}-lines">${def.lines.map((l,i)=>`<div class="featline"><span class="no">${i+1}</span><span>${l}</span></div>`).join('')}</div>
                    <div class="revealbtns">
                        <button class="minibtn" id="${def.id}-rev">✨ 揭晓一条</button>
                        ${def.extra||''}
                    </div>
                    <div class="liferow">${def.life.map(([k,nm])=>`<div class="lifeitem">${IMG(k)}<div>${nm}</div></div>`).join('')}</div>
                    <div style="margin-top:12px;font-size:14px;color:#8b8378;font-weight:700">↑ 生活中这些物体的形状，都是${SHAPES[def.shape].name}！</div>
                </div>
            </div>`,
        init(el) {
            step = 0;
            el.querySelector('#'+def.id+'-rev').onclick = () => {
                const lines = el.querySelectorAll('.featline');
                if (step < lines.length) { SND.pop(); lines[step].classList.add('show'); step++; }
                else toast('特征都出来啦！一起读一读～');
            };
            el.querySelector('#'+def.id+'-face').onclick = () => {
                SND.click();
                const fan = el.querySelector('#'+def.id+'-fan');
                if (fan.dataset.done) { toast(def.fanTip); return; }
                fan.dataset.done = 1;
                fan.innerHTML = def.fanColors.map((c,i) =>
                    `<div class="fanface" style="background:${c};animation-delay:${i*.09}s">${i+1}</div>`).join('');
                SND.good(); toast(def.fanTip, 3000);
            };
            if (def.bind) def.bind(el);
        },
        enter() {  /* 再次进入重置已揭晓条目? 保留状态更好，不重置 */ }
    });
}

                    bub.textContent = '其实是「' + SHAPES[cur.ans].name + '」哦～没关系，再听一遍线索！';
                }, 1300);
            }
        });
        el.querySelector('#g2again').onclick = () => {
            SND.click();
            const s = randShape();
            setPuzzle([G2_ROLL[s][0]], s);
            el.querySelectorAll('.riddle').forEach(x=>x.classList.remove('on'));
            toast('新一轮！幕布后面换了新小伙伴');
        };
        /* 默认先上第一张谜语卡 */
        el.querySelector('.riddle').click();
        this._cleanup = () => {};
    }
});

        <div class="g3top">${['cuboid','cube','cyl','ball'].map(s=>`
            <div class="home card" data-shape="${s}">

                <div class="hnm"><span class="tag ${SHAPES[s].tag}">${SHAPES[s].name}的家</span></div>

        </div>
        <div class="pill g3prog" id="g3prog">0 / 16 已经分好</div>
        <div class="g3fb" id="g3fb"></div>
        <div class="g3done" id="g3done">
            <div class="card" style="padding:30px 50px;text-align:center">
                <div style="font-size:clamp(30px,4vw,50px);font-weight:900">🎉 全部送回家啦！</div>
                <div id="g3finalSc" style="font-size:clamp(20px,2.4vw,28px);font-weight:900;margin:14px 0"></div>
            </div>
            <button class="bigbtn" id="g3re2">🔀 打乱再玩一轮</button>
        </div>
        <button class="minibtn" id="g3reset" style="position:absolute;right:26px;bottom:96px">🔀 打乱重开</button>`,
    init(el) {
        const mid = el.querySelector('#g3mid'), fb = el.querySelector('#g3fb');
        const feedback = (t, ok) => {
            fb.textContent = t; fb.style.borderColor = ok ? '#59c98b' : '#e05d5d';
            fb.classList.add('show'); clearTimeout(g3Timer); g3Timer = setTimeout(()=>fb.classList.remove('show'), 1800);
        };
        const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
        const build = () => {
            G3.red = 0; G3.blue = 0; G3.team = 'red'; G3.placed = 0;
            el.querySelector('#starR').textContent = '☆0'; el.querySelector('#starB').textContent = '☆0';
            el.querySelector('#scR').classList.add('turn'); el.querySelector('#scB').classList.remove('turn');
            el.querySelector('#g3prog').textContent = '0 / 16 已经分好';
            el.querySelector('#g3done').classList.remove('show');
            el.querySelectorAll('.home .hz').forEach(h => h.innerHTML = '');
            mid.innerHTML = '';
            const order = shuffle([...G3_ITEMS.keys()]);
            order.forEach((idx, k) => {
                const [img, shape] = G3_ITEMS[idx];
                const c = document.createElement('div');
                c.className = 'g3chip'; c.dataset.shape = shape;
                /* 网格散布：4 列 4 行抖动 */
                const gx = k % 4, gy = Math.floor(k/4);
                c.style.left = (23 + gx*19 + Math.random()*5) + '%';
                c.style.top  = (16 + gy*27 + Math.random()*9) + '%';
                c.innerHTML = IMG(img);
                c.addEventListener('pointerdown', e => startDrag(e, c));
                mid.appendChild(c);
            });
        };
        const startDrag = (e, chip) => {
            e.preventDefault();
            const r = mid.getBoundingClientRect(), cr = chip.getBoundingClientRect();
            chip.classList.add('drag');
            try { chip.setPointerCapture && chip.setPointerCapture(e.pointerId); } catch(err) {}
            const ox = e.clientX - cr.left, oy = e.clientY - cr.top;
            const move = ev => {
                chip.style.left = (ev.clientX - r.left - ox + cr.width/2) / r.width * 100 + '%';
                chip.style.top  = (ev.clientY - r.top  - oy + cr.height/2) / r.height * 100 + '%';
                const hot = document.elementFromPoint(ev.clientX, ev.clientY);
                el.querySelectorAll('.home').forEach(h => h.classList.toggle('hot', !!(hot && h.contains(hot))));
            };
            const up = ev => {
                chip.classList.remove('drag');
                chip.removeEventListener('pointermove', move);
                chip.removeEventListener('pointerup', up);
                const hit = document.elementFromPoint(ev.clientX, ev.clientY);
                const home = hit && hit.closest ? hit.closest('.home') : null;
                el.querySelectorAll('.home').forEach(h => h.classList.remove('hot'));
                drop(chip, home);
            };
            chip.addEventListener('pointermove', move);
            chip.addEventListener('pointerup', up);
        };
        const drop = (chip, home) => {
            if (!home) return;   /* 放空白处：留在原地 */
            const ok = home.dataset.shape === chip.dataset.shape;
            if (ok) {
                SND.good(); SND.star();
                const hr = home.getBoundingClientRect();
                confetti(hr.left+hr.width/2, hr.top+hr.height/2, 18);
                const sm = document.createElement('img');
                sm.src = chip.querySelector('img').src; sm.style.height = '30px';
                home.querySelector('.hz').appendChild(sm);
                chip.remove();
                G3.placed++;
                G3[G3.team]++;
                el.querySelector(G3.team==='red'?'#starR':'#starB').textContent = '★' + G3[G3.team];
                el.querySelector('#g3prog').textContent = G3.placed + ' / 16 已经分好';
                feedback(G3_PRAISE[chip.dataset.shape] + '（' + (G3.team==='red'?'红':'蓝') + '队 +1★）', true);
                G3.team = G3.team === 'red' ? 'blue' : 'red';
                el.querySelector('#scR').classList.toggle('turn', G3.team==='red');
                el.querySelector('#scB').classList.toggle('turn', G3.team==='blue');
                if (G3.placed >= 16) {
                    setTimeout(() => {
                        SND.win(); fireworks(6);
                        el.querySelector('#g3finalSc').innerHTML =
                            `🔴 红队 <span class="star">★${G3.red}</span>　VS　🔵 蓝队 <span class="star">★${G3.blue}</span><br>` +
                            (G3.red === G3.blue ? '平分秋色，都是冠军！' : (G3.red > G3.blue ? '红队获胜！🏆' : '蓝队获胜！🏆'));
                        el.querySelector('#g3done').classList.add('show');
                    }, 700);
                }
            } else {
                SND.bad();
                chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake');
                feedback('再摸一摸它的面，想一想它是谁的家？', false);
            }
        };
        el.querySelector('#g3reset').onclick = () => { SND.click(); build(); };
        el.querySelector('#g3re2').onclick = () => { SND.click(); build(); };
        build();
    },
    leave() { clearTimeout(g3Timer); }
});
