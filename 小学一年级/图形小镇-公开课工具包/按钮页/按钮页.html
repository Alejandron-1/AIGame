<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>按钮页渲染器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; overflow:hidden; background:#faf6ee; }
body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#3f3a34; display:flex; flex-direction:column;
       align-items:center; justify-content:center; position:relative; }
.frame { position:absolute; inset:36px; border:6px solid #3f3a34; border-radius:44px; pointer-events:none; }
.chip { position:absolute; top:74px; left:90px; background:#fff; border:4px solid #3f3a34; border-radius:999px;
        padding:10px 34px; font-size:30px; font-weight:800; }
htitle, .tt { }
.tt { font-size:110px; font-weight:900; letter-spacing:8px; margin-top:-40px; }
.tt em { font-style:normal; color:#f0831f; }
.sub { font-size:38px; color:#8b8378; font-weight:700; margin-top:26px; }
.shapes { display:flex; gap:70px; align-items:flex-end; margin:60px 0 40px; }
.shapew { animation:wob 2.6s ease-in-out infinite; transform-origin:50% 90%; }
@keyframes wob { 0%,100%{transform:rotate(-2.2deg)} 50%{transform:rotate(2.2deg)} }
.cta { margin-top:30px; background:#ffce4f; border:6px solid #3f3a34; border-radius:26px; padding:26px 70px;
       font-size:44px; font-weight:900; box-shadow:0 10px 0 #c99a1f; }
.hint { position:absolute; bottom:70px; font-size:26px; color:#b3aa9c; font-weight:700; }
.badge { position:absolute; top:74px; right:90px; font-size:30px; font-weight:900; color:#fff;
         border-radius:999px; padding:10px 34px; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="chip">🧱 立体图形小镇 · 一年级数学公开课</div>
<div class="badge" id="badge"></div>
<div class="tt" id="tt"></div>
<div class="sub" id="sub"></div>
<div class="shapes" id="shapes"></div>
<div class="cta" id="cta"></div>
<div class="hint">在 PowerPoint 放映模式下点击本页，即可打开游戏 · Alt+Tab 返回 PPT</div>
<script>
const S = {
    cuboid:{c:'#f5a35c',d:'#e08b45',l:'#ffc28e',nm:'长方体'},
    cube:  {c:'#7fb2e5',d:'#5f92c9',l:'#a9cdf0',nm:'正方体'},
    cyl:   {c:'#7fc8a8',d:'#5fae8c',l:'#a8dfc6',nm:'圆柱'},
    ball:  {c:'#f2a6b8',d:'#dd8497',l:'#f9c6d1',nm:'球'}
};
function face(cx,cy,k){const e=13*k,r=5.2*k;return `<circle cx="${cx-e}" cy="${cy}" r="${r}" fill="#3f3a34"/><circle cx="${cx+e}" cy="${cy}" r="${r}" fill="#3f3a34"/><circle cx="${cx-e+1.6}" cy="${cy-1.6}" r="1.7" fill="#fff"/><circle cx="${cx+e+1.6}" cy="${cy-1.6}" r="1.7" fill="#fff"/><path d="M${cx-9*k},${cy+8*k} Q${cx},${cy+17*k} ${cx+9*k},${cy+8*k}" stroke="#3f3a34" stroke-width="${3*k}" fill="none" stroke-linecap="round"/><ellipse cx="${cx-20*k}" cy="${cy+9*k}" rx="${6*k}" ry="${3.6*k}" fill="#ff8f8f" opacity=".55"/><ellipse cx="${cx+20*k}" cy="${cy+9*k}" rx="${6*k}" ry="${3.6*k}" fill="#ff8f8f" opacity=".55"/>`;}
function svg(shape,size){const o=S[shape];const L='stroke="#3f3a34" stroke-width="4" stroke-linejoin="round"';let b='';
if(shape==='cuboid')b=`<polygon points="38,84 82,42 190,42 146,84" fill="${o.l}" ${L}/><polygon points="146,84 190,42 190,128 146,170" fill="${o.d}" ${L}/><rect x="38" y="84" width="108" height="86" rx="6" fill="${o.c}" ${L}/>${face(92,122,1)}`;
else if(shape==='cube')b=`<polygon points="46,80 78,48 186,48 154,80" fill="${o.l}" ${L}/><polygon points="154,80 186,48 186,160 154,192" fill="${o.d}" ${L}/><rect x="46" y="80" width="108" height="112" rx="6" fill="${o.c}" ${L}/>${face(100,132,1)}`;
else if(shape==='cyl')b=`<path d="M46,62 L46,152 A54,17 0 0 0 154,152 L154,62" fill="${o.c}" ${L}/><ellipse cx="100" cy="62" rx="54" ry="17" fill="${o.l}" ${L}/>${face(100,112,1)}`;
else b=`<circle cx="100" cy="102" r="68" fill="${o.c}" ${L}/><ellipse cx="72" cy="66" rx="17" ry="9" fill="#fff" opacity=".55" transform="rotate(-24 72 66)"/>${face(100,112,1.02)}`;
return `<svg width="${size}" height="${size*0.95}" viewBox="0 0 220 210">${b}</svg>`;}
const P = {
    cover:{tt:'立体图形小镇 <em>公开课课件</em>', sub:'16 页课件 + 4 个互动游戏 · 双击即用 · 完全离线', cta:'▶ 进入完整课件', shapes:['cuboid','cube','cyl','ball'], badge:'完整版', hash:''},
    game1:{tt:'第 1 关 · <em>认识小伙伴</em>', sub:'点一下实物，看它变成图形小伙伴！（实物变图形）', cta:'▶ 进入第 1 关', shapes:['cuboid','cube'], badge:'游戏 1', hash:'#game1'},
    game2:{tt:'高光时刻 · <em>我说你猜</em>', sub:'幕布后面藏着谁？听线索，全班一起喊答案！', cta:'▶ 进入我说你猜', shapes:['cyl','ball'], badge:'游戏 2', hash:'#game2'},
    game3:{tt:'例1 · <em>按形状分一分</em>', sub:'红蓝两队轮流上台，把 16 件物品送回小伙伴的家！', cta:'▶ 进入分一分比赛', shapes:['cube','cuboid','cyl','ball'], badge:'游戏 3', hash:'#game3'},
    game4:{tt:'<em>小镇落成啦</em> · 全班颁奖', sub:'图形积木搭成小镇，成长档案 + 颁奖典礼 + 儿歌齐读', cta:'▶ 进入小镇颁奖', shapes:['ball','cyl','cube'], badge:'游戏 4', hash:'#game4'}
};
const k = new URLSearchParams(location.search).get('btn') || 'cover';
const p = P[k];
document.getElementById('tt').innerHTML = p.tt;
document.getElementById('sub').textContent = p.sub;
document.getElementById('cta').textContent = p.cta;
document.getElementById('badge').textContent = p.badge;
document.getElementById('badge').style.background = {cover:'#7fb2e5',game1:'#f5a35c',game2:'#e56a8c',game3:'#59c98b',game4:'#f2a6b8'}[k];
document.getElementById('shapes').innerHTML = p.shapes.map((s,i)=>`<div class="shapew" style="animation-delay:${-i*0.6}s">${svg(s,240)}</div>`).join('');
</script>
</body>
</html>
