<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>比大小 · 数一数 比一比</title>
<style>
  /* ============ 基础：全屏自适应，无滚动条 ============ */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#FFF7E8;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif; user-select:none; }
  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:center center; background:linear-gradient(180deg,#FFFDF6 0%,#FFF3DC 100%); }

  /* ============ 顶栏：只有标题和题号 ============ */
  #topbar { position:absolute; left:0; top:36px; width:100%; display:flex;
    align-items:center; justify-content:center; gap:36px; }
  #title { font-size:64px; font-weight:bold; color:#5A4632; letter-spacing:6px; }
  #roundTag { font-size:34px; color:#A08B6C; background:#FFFFFF; border-radius:30px;
    padding:10px 32px; border:3px solid #F2DFB9; }

  /* ============ 主区：左右两组图案 + 中间符号 ============ */
  #main { position:absolute; left:120px; top:170px; width:1680px; height:560px;
    display:flex; align-items:stretch; justify-content:space-between; }
  .side { width:660px; border-radius:48px; padding:30px 20px 26px;
    display:flex; flex-direction:column; align-items:center; }
  #sideL { background:#FFEFE3; border:6px solid #FFB877; }
  #sideR { background:#E3F4FF; border:6px solid #7EC8F0; }
  .sideTag { font-size:40px; font-weight:bold; margin-bottom:14px; }
  #sideL .sideTag { color:#D97B29; }
  #sideR .sideTag { color:#2E7FB5; }
  .grid { flex:1; width:100%; display:flex; flex-wrap:wrap; align-content:center;
    justify-content:center; gap:18px 26px; padding:10px 16px; }
  .obj { line-height:1; animation:pop .35s backwards; }
  @keyframes pop { from{transform:scale(0);} to{transform:scale(1);} }

  .sideNum { height:76px; font-size:60px; font-weight:bold; visibility:hidden; }
  #sideL .sideNum { color:#D97B29; }
  #sideR .sideNum { color:#2E7FB5; }
  .sideNum.show { visibility:visible; animation:pop .35s; }

  /* 中间符号圆 */
  #center { align-self:center; width:280px; height:280px; border-radius:50%;
    background:#FFFFFF; border:8px solid #F2C94C; display:flex; flex-direction:column;
    align-items:center; justify-content:center; box-shadow:0 10px 0 #EAD9A8; flex:none; }
  #centerQ { font-size:96px; font-weight:bold; color:#E0CFA8; line-height:1; }
  #centerSym { font-size:120px; font-weight:bold; color:#4CAF50; line-height:1;
    display:none; animation:pop .4s; }
  #centerWord { font-size:34px; font-weight:bold; color:#4CAF50; display:none; }
  #center.ok { border-color:#4CAF50; box-shadow:0 10px 0 #3D8B40; }
  #center.ok #centerQ { display:none; }
  #center.ok #centerSym, #center.ok #centerWord { display:block; }

  /* ============ 底部：三个大按钮 ============ */
  #btnRow { position:absolute; left:0; top:800px; width:100%; display:flex;
    justify-content:center; gap:90px; }
  .ansBtn { width:400px; height:160px; border-radius:40px; cursor:pointer;
    border:none; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:6px; color:#fff; font-weight:bold;
    transition:transform .1s; }
  .ansBtn .sym { font-size:72px; line-height:1; }
  .ansBtn .word { font-size:42px; line-height:1; }
  #btnGt { background:#FF9F43; box-shadow:0 10px 0 #D97F2B; }
  #btnEq { background:#5CB85C; box-shadow:0 10px 0 #449944; }
  #btnLt { background:#5AB0E2; box-shadow:0 10px 0 #3E8CBF; }
  .ansBtn:active { transform:translateY(6px); box-shadow:0 4px 0 rgba(0,0,0,.25); }
  .ansBtn.good { background:#4CAF50; box-shadow:0 10px 0 #3D8B40; animation:pop .35s; }
  .ansBtn.dim { opacity:.55; }
  .ansBtn.shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-14px);}
    50%{transform:translateX(14px);} 75%{transform:translateX(-8px);} }

  /* ============ 轻提示 ============ */
  #toast { position:absolute; left:50%; top:1000px; transform:translateX(-50%);
    background:#A08B6C; color:#fff; font-size:36px; font-weight:bold;
    padding:16px 48px; border-radius:32px; visibility:hidden; }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <div id="title">比 大 小</div>
    <div id="roundTag">第 1 题</div>
  </div>

  <div id="main">
    <div class="side" id="sideL">
      <div class="sideTag">左 边</div>
      <div class="grid" id="gridL"></div>
      <div class="sideNum" id="numL">5 个</div>
    </div>
    <div id="center">
      <div id="centerQ">?</div>
      <div id="centerSym">＞</div>
      <div id="centerWord">大于</div>
    </div>
    <div class="side" id="sideR">
      <div class="sideTag">右 边</div>
      <div class="grid" id="gridR"></div>
      <div class="sideNum" id="numR">3 个</div>
    </div>
  </div>

  <div id="btnRow">
    <button class="ansBtn" id="btnGt"><span class="sym">＞</span><span class="word">大于</span></button>
    <button class="ansBtn" id="btnEq"><span class="sym">＝</span><span class="word">等于</span></button>
    <button class="ansBtn" id="btnLt"><span class="sym">＜</span><span class="word">小于</span></button>
  </div>

  <div id="toast">再想一想，数一数两边各有几个～</div>
</div>

<script>
'use strict';
/* ================================================================
 * 比大小 · 数一数 比一比（V2.0 极简版）
 * 玩法：左右两组图案（数量 1~10）→ 数一数 → 大于 / 等于 / 小于 三选一
 *       → 答对显示数字和符号，2 秒后自动出下一题
 * 教师快捷键（隐藏）：空格=下一题  R=换一题  A=显示答案  Esc=返回目录
 * ================================================================ */

/* ---------------- CONFIG：改这里调难度 ---------------- */
var CONFIG = {
  MIN: 1,        // 每侧数量下限
  MAX: 10,       // 每侧数量上限
  NEXT_MS: 2000, // 答对后自动下一题的等待毫秒
  TTS_RATE: 0.85,
  // 图案池：左右各随机取一种（保证不同），可自由增删
  OBJECTS: ['apple','banana','strawberry','orange','grape','watermelon','star','balloon','flower','ladybug','fish','gift']
};

/* 图案库：全部为内嵌 SVG 手绘（不依赖系统 emoji 字体，教室精简系统也不会显示方框） */
var SVGOBJ = {
  apple:
    '<path d="M50 28 C30 28 20 46 22 63 C24 80 35 92 50 92 C65 92 76 80 78 63 C80 46 70 28 50 28 Z" fill="#E84545" stroke="#2b3850" stroke-width="4"/>'+
    '<path d="M50 28 C50 19 54 13 62 9" fill="none" stroke="#7A4A21" stroke-width="5" stroke-linecap="round"/>'+
    '<path d="M53 18 C58 9 69 7 75 10 C73 18 64 24 54 22 Z" fill="#58A85C" stroke="#2b3850" stroke-width="3"/>'+
    '<ellipse cx="38" cy="48" rx="6" ry="10" fill="#fff" opacity=".35"/>',
  banana:
    '<path d="M22 20 C17 52 38 82 72 85 C81 86 86 78 80 74 C56 68 40 50 35 24 C34 16 24 13 22 20 Z" fill="#F5C842" stroke="#2b3850" stroke-width="4" stroke-linejoin="round"/>'+
    '<path d="M23 19 L28 26" stroke="#7A4A21" stroke-width="5" stroke-linecap="round"/>'+
    '<path d="M76 82 L72 76" stroke="#7A4A21" stroke-width="5" stroke-linecap="round"/>',
  strawberry:
    '<path d="M50 32 C63 32 76 41 76 55 C76 73 62 88 50 93 C38 88 24 73 24 55 C24 41 37 32 50 32 Z" fill="#E84545" stroke="#2b3850" stroke-width="4"/>'+
    '<path d="M31 29 C37 21 46 19 50 25 C54 19 63 21 69 29 C63 36 54 38 50 33 C46 38 37 36 31 29 Z" fill="#58A85C" stroke="#2b3850" stroke-width="3"/>'+
    '<g fill="#FFE9A8"><ellipse cx="40" cy="52" rx="2.5" ry="4"/><ellipse cx="60" cy="52" rx="2.5" ry="4"/><ellipse cx="50" cy="63" rx="2.5" ry="4"/><ellipse cx="38" cy="72" rx="2.5" ry="4"/><ellipse cx="62" cy="72" rx="2.5" ry="4"/></g>',
  orange:
    '<circle cx="50" cy="57" r="32" fill="#F2A93B" stroke="#2b3850" stroke-width="4"/>'+
    '<path d="M50 25 C50 17 55 12 62 9" fill="none" stroke="#7A4A21" stroke-width="5" stroke-linecap="round"/>'+
    '<path d="M52 15 C58 7 68 6 73 10 C70 17 60 20 52 15 Z" fill="#58A85C" stroke="#2b3850" stroke-width="3"/>'+
    '<circle cx="40" cy="46" r="4" fill="#fff" opacity=".4"/>',
  grape:
    '<path d="M50 26 C50 18 54 13 60 10" fill="none" stroke="#7A4A21" stroke-width="5" stroke-linecap="round"/>'+
    '<g fill="#8f8fe8" stroke="#2b3850" stroke-width="3.5"><circle cx="33" cy="38" r="13"/><circle cx="67" cy="38" r="13"/><circle cx="50" cy="42" r="13"/><circle cx="40" cy="60" r="13"/><circle cx="60" cy="60" r="13"/><circle cx="50" cy="77" r="13"/></g>',
  watermelon:
    '<path d="M9 38 A41 41 0 0 0 91 38 L9 38 Z" fill="#58A85C" stroke="#2b3850" stroke-width="4" stroke-linejoin="round"/>'+
    '<path d="M17 38 A33 33 0 0 0 83 38 L17 38 Z" fill="#F26D6D"/>'+
    '<g fill="#2b3850"><ellipse cx="38" cy="50" rx="2.5" ry="4"/><ellipse cx="62" cy="50" rx="2.5" ry="4"/><ellipse cx="50" cy="62" rx="2.5" ry="4"/></g>',
  star:
    '<path d="M50 6 L61 38 L95 38 L67 58 L78 92 L50 71 L22 92 L33 58 L5 38 L39 38 Z" fill="#F2C94C" stroke="#2b3850" stroke-width="4" stroke-linejoin="round"/>',
  balloon:
    '<path d="M50 80 C45 88 55 92 50 98" fill="none" stroke="#2b3850" stroke-width="3"/>'+
    '<ellipse cx="50" cy="40" rx="27" ry="33" fill="#5AB0E2" stroke="#2b3850" stroke-width="4"/>'+
    '<path d="M44 72 L56 72 L50 82 Z" fill="#3E8CBF" stroke="#2b3850" stroke-width="3" stroke-linejoin="round"/>'+
    '<path d="M38 28 C41 21 46 17 50 16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/>',
  flower:
    '<g fill="#F28CA8" stroke="#2b3850" stroke-width="3"><circle cx="50" cy="20" r="14"/><circle cx="73" cy="37" r="14"/><circle cx="64" cy="63" r="14"/><circle cx="36" cy="63" r="14"/><circle cx="27" cy="37" r="14"/></g>'+
    '<circle cx="50" cy="44" r="12" fill="#F2C94C" stroke="#2b3850" stroke-width="3"/>',
  ladybug:
    '<circle cx="50" cy="56" r="30" fill="#E84545" stroke="#2b3850" stroke-width="4"/>'+
    '<line x1="50" y1="30" x2="50" y2="85" stroke="#2b3850" stroke-width="3"/>'+
    '<circle cx="50" cy="24" r="13" fill="#2b3850"/>'+
    '<g fill="#2b3850"><circle cx="36" cy="50" r="4.5"/><circle cx="64" cy="50" r="4.5"/><circle cx="40" cy="68" r="4.5"/><circle cx="60" cy="68" r="4.5"/></g>'+
    '<g fill="none" stroke="#2b3850" stroke-width="3" stroke-linecap="round"><path d="M44 13 C42 8 38 6 34 6"/><path d="M56 13 C58 8 62 6 66 6"/></g>',
  fish:
    '<path d="M14 50 C26 33 48 29 64 41 L80 28 L76 50 L80 72 L64 59 C48 71 26 67 14 50 Z" fill="#F2A93B" stroke="#2b3850" stroke-width="4" stroke-linejoin="round"/>'+
    '<circle cx="30" cy="45" r="4" fill="#2b3850"/>'+
    '<path d="M44 38 C52 42 52 56 44 60" fill="none" stroke="#2b3850" stroke-width="3"/>',
  gift:
    '<rect x="18" y="40" width="64" height="48" rx="6" fill="#F28CA8" stroke="#2b3850" stroke-width="4"/>'+
    '<rect x="13" y="29" width="74" height="15" rx="5" fill="#F2A93B" stroke="#2b3850" stroke-width="4"/>'+
    '<rect x="43" y="29" width="14" height="59" fill="#FFE082" stroke="#2b3850" stroke-width="3"/>'+
    '<circle cx="40" cy="21" r="10" fill="#FFE082" stroke="#2b3850" stroke-width="3"/>'+
    '<circle cx="60" cy="21" r="10" fill="#FFE082" stroke="#2b3850" stroke-width="3"/>'
};

/* ---------------- 状态 ---------------- */
var S = {
  left: 0, right: 0,     // 左右数量
  eL: '', eR: '',        // 左右图案
  round: 0,              // 第几题
  locked: false,         // 答对后的过渡锁
  gen: 0                 // 代数戳：换题后作废旧的自动下一题定时器
};

/* ---------------- 工具 ---------------- */
function $(id) { return document.getElementById(id); }
function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

/* ---------------- 音效（Web Audio 合成，静默降级） ---------------- */
var AC = null;
function tone(freq, dur, delay, vol, type) {
  try {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (!AC) return;
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.18, AC.currentTime + (delay || 0));
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + (delay || 0) + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(AC.currentTime + (delay || 0));
    o.stop(AC.currentTime + (delay || 0) + dur + 0.05);
  } catch (e) {}
}
function sndGood() { tone(523,0.14,0,0.2,'triangle'); tone(659,0.14,0.12,0.2,'triangle'); tone(784,0.24,0.24,0.2,'triangle'); }
function sndBad()  { tone(196, 0.22, 0, 0.16, 'square'); }

/* ---------------- 语音（zh-CN，静默降级） ---------------- */
function speak(txt) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = 'zh-CN'; u.rate = CONFIG.TTS_RATE;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------------- 出题 ---------------- */
function newQuestion() {
  S.gen++;
  S.round++;
  S.locked = false;

  // 左右图案：随机两种、保证不同
  var i = ri(0, CONFIG.OBJECTS.length - 1);
  var j = ri(0, CONFIG.OBJECTS.length - 2);
  if (j >= i) j++;
  S.eL = CONFIG.OBJECTS[i]; S.eR = CONFIG.OBJECTS[j];
  S.left = ri(CONFIG.MIN, CONFIG.MAX);
  S.right = ri(CONFIG.MIN, CONFIG.MAX);

  renderGrid('gridL', S.eL, S.left);
  renderGrid('gridR', S.eR, S.right);
  $('roundTag').textContent = '第 ' + S.round + ' 题';

  // 复位：隐藏数字、中央问号、按钮状态
  $('numL').className = 'sideNum'; $('numR').className = 'sideNum';
  $('numL').textContent = S.left + ' 个'; $('numR').textContent = S.right + ' 个';
  $('center').className = '';
  $('btnGt').className = 'ansBtn'; $('btnEq').className = 'ansBtn'; $('btnLt').className = 'ansBtn';
  hideToast();
}

function renderGrid(gridId, key, n) {
  var g = $(gridId);
  g.innerHTML = '';
  // 数量不同大小不同：少则大、多则小，保证 10 个也放得下
  var size = n <= 3 ? 110 : (n <= 5 ? 96 : (n <= 7 ? 82 : 72));
  for (var k = 0; k < n; k++) {
    var d = document.createElement('div');
    d.className = 'obj';
    d.style.animationDelay = (k * 0.06) + 's';
    d.innerHTML = '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '" style="display:block">' + SVGOBJ[key] + '</svg>';
    g.appendChild(d);
  }
}

/* ---------------- 判定 ---------------- */
function answerOf() {
  if (S.left > S.right) return 'gt';
  if (S.left < S.right) return 'lt';
  return 'eq';
}

function onPick(kind) { // kind: 'gt' | 'eq' | 'lt'
  if (S.locked) return;
  var btn = kind === 'gt' ? $('btnGt') : (kind === 'lt' ? $('btnLt') : $('btnEq'));
  if (kind === answerOf()) {
    S.locked = true;
    // 答对：按钮变绿、其他按钮变淡、亮出数字和符号
    btn.className = 'ansBtn good';
    (kind === 'gt' ? $('btnEq') : $('btnGt')).className = 'ansBtn dim';
    (kind === 'lt' ? $('btnEq') : $('btnLt')).className = 'ansBtn dim';
    $('numL').className = 'sideNum show'; $('numR').className = 'sideNum show';
    var sym = kind === 'gt' ? '＞' : (kind === 'lt' ? '＜' : '＝');
    var word = kind === 'gt' ? '大于' : (kind === 'lt' ? '小于' : '等于');
    $('centerSym').textContent = sym;
    $('centerWord').textContent = word;
    $('center').className = 'ok';
    sndGood();
    speak(S.left + ' ' + word + ' ' + S.right);
    hideToast();
    // 2 秒后自动下一题（代数戳防连点串题）
    var g = S.gen;
    setTimeout(function () { if (g === S.gen) newQuestion(); }, CONFIG.NEXT_MS);
  } else {
    btn.className = 'ansBtn'; void btn.offsetWidth; btn.classList.add('shake');
    sndBad();
    showToast('再想一想，数一数两边各有几个～');
  }
}

/* ---------------- 轻提示 ---------------- */
var toastTimer = null;
function showToast(txt) {
  var t = $('toast');
  t.textContent = txt; t.style.visibility = 'visible';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.visibility = 'hidden'; }, 1800);
}
function hideToast() { $('toast').style.visibility = 'hidden'; clearTimeout(toastTimer); }

/* ---------------- 1920×1080 自适应缩放 ---------------- */
function fit() {
  try {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    $('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  } catch (e) {}
}

/* ---------------- 初始化 ---------------- */
function init() {
  $('btnGt').addEventListener('click', function () { onPick('gt'); });
  $('btnEq').addEventListener('click', function () { onPick('eq'); });
  $('btnLt').addEventListener('click', function () { onPick('lt'); });

  // 教师快捷键（隐藏功能，不影响学生）
  document.addEventListener('keydown', function (ev) {
    try {
      if (ev.key === ' ') { ev.preventDefault(); newQuestion(); }
      else if (ev.key === 'r' || ev.key === 'R') newQuestion();
      else if (ev.key === 'a' || ev.key === 'A') { if (!S.locked) onPick(answerOf()); }
      else if (ev.key === 'Escape') { try { window.location.href = '../index.html'; } catch (e) {} }
    } catch (e) {}
  });

  fit();
  if (window.addEventListener) window.addEventListener('resize', fit);
  newQuestion();
}

if (typeof window !== 'undefined' && window.document) init();
</script>
</body>
</html>
