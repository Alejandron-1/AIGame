<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>🍭 转盘组数大比拼 · 可爱数学游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #fde8c8 0%, #ffe0b5 100%);
      font-family: 'Fredoka', 'Comic Sans MS', '幼圆', 'YouYuan', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
      position: relative;
    }
    .game-container {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 250, 240, 0.9);
      backdrop-filter: blur(25px);
      border-radius: 80px 80px 60px 60px;
      box-shadow: 0 35px 55px rgba(0, 0, 0, 0.15), inset 0 2px 15px rgba(255,255,240,0.8);
      padding: 25px 25px 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #ffa94d;
      position: relative;
      z-index: 10;
    }
    h1 {
      font-size: 2.5rem;
      color: #c44f1c;
      text-shadow: 3px 3px 0 #ffd966;
      margin-bottom: 8px;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff3cd;
      padding: 5px 30px;
      border-radius: 60px;
      box-shadow: 0 6px 0 #f0b27a;
    }
    h1 span {
      font-size: 2rem;
      background: #ff7f3f;
      color: white;
      padding: 5px 22px;
      border-radius: 40px;
      box-shadow: 0 4px 0 #b4450c;
    }
    .spin-area {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 8px 0;
    }
    .wheel-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 2.2s cubic-bezier(0.2, 0.85, 0.25, 1);
      box-shadow: 0 0 0 14px #ffb26b, 0 12px 28px rgba(0,0,0,0.25);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }
    .pointer {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 26px solid transparent;
      border-right: 26px solid transparent;
      border-top: 42px solid #e85d26;
      filter: drop-shadow(0 8px 5px rgba(0,0,0,0.35));
      z-index: 10;
      animation: none;
    }
    .pointer.wobble {
      animation: pointerWobble 0.15s infinite alternate ease-in-out;
    }
    @keyframes pointerWobble {
      from { transform: translateX(-50%) rotate(-2deg); }
      to { transform: translateX(-50%) rotate(2deg); }
    }
    .pointer::after {
      content: "";
      position: absolute;
      top: -48px;
      left: -14px;
      width: 28px;
      height: 28px;
      background: radial-gradient(circle, #fff 5%, #ffaa00 80%);
      border-radius: 50%;
      box-shadow: 0 0 12px gold;
    }
    .current-number-box {
      background: #fff5e6;
      border-radius: 50px;
      padding: 10px 28px;
      margin: 8px 0 6px;
      font-size: 2.5rem;
      font-weight: bold;
      color: #b64516;
      border: 4px dashed #ff9f4b;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fffaf0;
    }
    .turn-indicator {
      background: #ffe1b3;
      border-radius: 50px;
      padding: 8px 24px;
      font-size: 1.4rem;
      font-weight: bold;
      color: #5c3714;
      display: inline-block;
      margin-bottom: 6px;
      box-shadow: 0 4px 0 #d4903a;
      border: 2px solid #ffb676;
    }
    .players-row {
      display: flex;
      width: 100%;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 12px 0 8px;
    }
    .player-card {
      background: #ffecce;
      border-radius: 45px;
      padding: 16px 18px;
      flex: 1 1 200px;
      min-width: 180px;
      box-shadow: 0 12px 18px rgba(0,0,0,0.08);
      border: 3px solid #ff9f6b;
      transition: all 0.2s;
      position: relative;
    }
    /* 玩家1回合：醒目的橙色边框 */
    .player-card.player1-turn {
      border: 5px solid #ff8c00;
      box-shadow: 0 0 28px #ff8c00, 0 12px 20px rgba(0,0,0,0.15);
      background: #fff5e7;
    }
    /* 玩家2回合：明亮的青色边框 */
    .player-card.player2-turn {
      border: 5px solid #00bcd4;
      box-shadow: 0 0 28px #00bcd4, 0 12px 20px rgba(0,0,0,0.15);
      background: #f0fcff;
    }
    .player-name {
      font-size: 1.7rem;
      font-weight: bold;
      color: #4a2c1a;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff0d4;
      border-radius: 30px;
      padding: 4px 12px;
    }
    .slots {
      display: flex;
      gap: 14px;
      margin: 14px 0 8px;
      justify-content: center;
    }
    .digit-slot {
      width: 70px;
      height: 85px;
      background: #fffef7;
      border-radius: 25px;
      border: 4px solid #ffb573;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      color: #c45500;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
      user-select: none;
      position: relative;
    }
    .digit-slot.filled {
      background: #ffedd6;
      border-color: #ff8c42;
      cursor: default;
      color: #5d3a1a;
    }
    .digit-slot.clickable {
      border: 5px solid #ff6d2e;
      background: #fff4e5;
      animation: pulse-giggle 0.7s infinite;
      cursor: pointer;
    }
    @keyframes pulse-giggle {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,110,40,0.5); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 14px rgba(255,110,40,0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,110,40,0); }
    }
    .slot-label {
      position: absolute;
      bottom: -24px;
      font-size: 0.9rem;
      color: #7b4d2c;
      font-weight: bold;
    }
    .score-badge {
      display: flex;
      gap: 18px;
      font-weight: bold;
      color: #5a3825;
      font-size: 1.2rem;
      background: #fff2df;
      padding: 5px 12px;
      border-radius: 20px;
    }
    .btn {
      background: #ff984f;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      padding: 12px 32px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 7px 0 #c1541a, 0 8px 16px rgba(0,0,0,0.18);
      transition: 0.08s linear;
      margin: 6px;
      letter-spacing: 2px;
      border: 2px solid #ffc489;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #c1541a, 0 5px 10px rgba(0,0,0,0.15);
    }
    .btn:disabled {
      opacity: 0.5;
      transform: translateY(3px);
      box-shadow: 0 4px 0 #c1541a;
      cursor: not-allowed;
    }
    .new-round-btn {
      background: #8b6b4d;
      box-shadow: 0 7px 0 #5e4632;
      border-color: #dbbd9f;
      font-size: 1.3rem;
      padding: 10px 28px;
    }
    .footer-note {
      margin-top: 8px;
      font-size: 1rem;
      color: #6b4b30;
      background: #fff3e1;
      padding: 5px 25px;
      border-radius: 30px;
      font-weight: bold;
    }

    /* 可爱弹窗 */
    .cute-popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }
    .cute-popup {
      background: #fffef5;
      border-radius: 80px 80px 60px 60px;
      padding: 35px 35px 30px;
      max-width: 380px;
      width: 85%;
      text-align: center;
      box-shadow: 0 30px 45px rgba(0,0,0,0.25), 0 0 0 8px #ffb87a;
      transform: scale(0) rotate(-5deg);
      animation: jumpPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      border: 4px dashed #ffaa5e;
      position: relative;
      z-index: 1100;
    }
    @keyframes jumpPop {
      0% { transform: scale(0) rotate(-8deg); opacity: 0; }
      50% { transform: scale(1.15) rotate(3deg); opacity: 1; }
      70% { transform: scale(0.9) rotate(-1deg); }
      85% { transform: scale(1.05) rotate(0.5deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .popup-emoji {
      font-size: 5.5rem;
      margin-bottom: 10px;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
    }
    .popup-text {
      font-size: 2rem;
      font-weight: bold;
      color: #b1511b;
      margin: 8px 0 15px;
      line-height: 1.4;
    }
    .popup-detail {
      font-size: 1.4rem;
      color: #634830;
      background: #ffe8d4;
      border-radius: 40px;
      padding: 12px 18px;
      margin: 15px 0;
      font-weight: bold;
    }
    .popup-btn {
      background: #ff8c5a;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      padding: 14px 30px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #bd4f20;
      margin-top: 8px;
      transition: 0.1s;
      border: 2px solid #ffc29c;
    }
    .popup-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #bd4f20;
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    /* 烟花层 */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1050;
    }

    @media (max-width: 500px) {
      .digit-slot {
        width: 55px;
        height: 70px;
        font-size: 2.4rem;
      }
      .btn {
        font-size: 1.2rem;
        padding: 10px 22px;
      }
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>
    🎡 转盘组数
    <span>大比拼</span>
  </h1>

  <div class="spin-area">
    <div class="wheel-wrapper" id="wheelWrapper">
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>
    <div class="pointer" id="pointerElement"></div>
  </div>

  <div class="current-number-box" id="currentNumberDisplay">
    <span>🍬</span> <span id="currentDigitText">?</span>
  </div>

  <div class="turn-indicator" id="turnIndicator">🐻 玩家1 转动转盘</div>

  <button class="btn" id="spinButton">🎯 转动转盘</button>

  <div class="players-row">
    <div class="player-card" id="player1Card">
      <div class="player-name">🐼 玩家1</div>
      <div class="slots" id="player1Slots">
        <div class="digit-slot" data-player="0" data-index="0"><span class="slot-label">百位</span></div>
        <div class="digit-slot" data-player="0" data-index="1"><span class="slot-label">十位</span></div>
        <div class="digit-slot" data-player="0" data-index="2"><span class="slot-label">个位</span></div>
      </div>
      <div class="score-badge">🏆 胜: <span id="player1Wins">0</span></div>
    </div>
    <div class="player-card" id="player2Card">
      <div class="player-name">🐨 玩家2</div>
      <div class="slots" id="player2Slots">
        <div class="digit-slot" data-player="1" data-index="0"><span class="slot-label">百位</span></div>
        <div class="digit-slot" data-player="1" data-index="1"><span class="slot-label">十位</span></div>
        <div class="digit-slot" data-player="1" data-index="2"><span class="slot-label">个位</span></div>
      </div>
      <div class="score-badge">🏆 胜: <span id="player2Wins">0</span></div>
    </div>
  </div>

  <button class="btn new-round-btn" id="newRoundButton">🔄 新的一局</button>
  <div class="footer-note">⭐ 大数(7,8,9)放高位，赢面更大！</div>
</div>

<script>
  (function() {
    // ---------- 游戏状态 ----------
    const players = [
      { slots: [null, null, null], filledCount: 0, completed: false, wins: 0 },
      { slots: [null, null, null], filledCount: 0, completed: false, wins: 0 }
    ];
    let currentPlayer = 0;
    let currentDigit = null;
    let gameOver = false;
    let spinInProgress = false;
    let rotationAngle = 0;

    const digitCenters = [-90, -50, -10, 30, 70, 110, 150, 190, 230];

    const wheelWrapper = document.getElementById('wheelWrapper');
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinButton = document.getElementById('spinButton');
    const currentDigitText = document.getElementById('currentDigitText');
    const turnIndicator = document.getElementById('turnIndicator');
    const pointerEl = document.getElementById('pointerElement');
    const player1Card = document.getElementById('player1Card');
    const player2Card = document.getElementById('player2Card');
    const player1WinsSpan = document.getElementById('player1Wins');
    const player2WinsSpan = document.getElementById('player2Wins');
    const newRoundButton = document.getElementById('newRoundButton');
    const allSlots = document.querySelectorAll('.digit-slot');

    function drawWheel() {
      const width = canvas.width, height = canvas.height;
      const cx = width/2, cy = height/2, r = 140;
      const colors = ['#FF7777','#FFB347','#FFD93D','#6BCB77','#4D96FF','#9B59B6','#FF8C42','#45B7D1','#F7DC6F'];
      ctx.clearRect(0,0,width,height);
      for(let i=0;i<9;i++){
        let start = (digitCenters[i]-20)*Math.PI/180;
        let end = (digitCenters[i]+20)*Math.PI/180;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,start,end);
        ctx.closePath();
        ctx.fillStyle=colors[i];
        ctx.fill();
        ctx.strokeStyle='#FFF5E1';
        ctx.lineWidth=3;
        ctx.stroke();
        let angle = digitCenters[i]*Math.PI/180;
        let tx = cx+Math.cos(angle)*r*0.7;
        let ty = cy+Math.sin(angle)*r*0.7;
        ctx.save();
        ctx.translate(tx,ty);
        ctx.rotate(angle+Math.PI/2);
        ctx.font='bold 26px "Fredoka","Comic Sans MS"';
        ctx.fillStyle='#2E1A0F';
        ctx.shadowColor='#fff';
        ctx.shadowBlur=5;
        ctx.fillText((i+1).toString(),-14,10);
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(cx,cy,28,0,2*Math.PI);
      ctx.fillStyle='#FFF3E0';
      ctx.fill();
      ctx.strokeStyle='#FF8F00';
      ctx.lineWidth=5;
      ctx.stroke();
      ctx.font='bold 20px "Fredoka"';
      ctx.fillStyle='#BF360C';
      ctx.shadowBlur=0;
      ctx.fillText('GO',cx-20,cy+8);
    }
    drawWheel();

    function updateUI() {
      allSlots.forEach(slot => {
        let p = parseInt(slot.dataset.player);
        let idx = parseInt(slot.dataset.index);
        let val = players[p].slots[idx];
        slot.textContent = val !== null ? val : '';
        if(val !== null) {
          slot.classList.add('filled');
          slot.classList.remove('clickable');
        } else {
          slot.classList.remove('filled','clickable');
        }
        if(!slot.querySelector('.slot-label')){
          let lbl = document.createElement('span');
          lbl.className='slot-label';
          lbl.textContent = ['百位','十位','个位'][idx];
          slot.appendChild(lbl);
        } else {
          slot.querySelector('.slot-label').textContent = ['百位','十位','个位'][idx];
        }
      });
      currentDigitText.textContent = currentDigit !== null ? currentDigit : '?';

      // 回合高亮：移除所有回合类，再根据当前玩家添加对应颜色
      player1Card.classList.remove('player1-turn', 'player2-turn');
      player2Card.classList.remove('player1-turn', 'player2-turn');
      if (!gameOver) {
        if (currentPlayer === 0) {
          player1Card.classList.add('player1-turn');
        } else {
          player2Card.classList.add('player2-turn');
        }
      }

      if(!gameOver) {
        turnIndicator.textContent = (currentPlayer===0?'🐻 玩家1':'🐨 玩家2') + ' 转动转盘';
      } else {
        turnIndicator.textContent = '🎉 本局结束';
      }
      spinButton.disabled = (gameOver || spinInProgress || currentDigit !== null || players[currentPlayer].completed);
      if(currentDigit !== null && !gameOver && !players[currentPlayer].completed) {
        players[currentPlayer].slots.forEach((v,i)=>{
          if(v===null){
            let slot = document.querySelector(`.digit-slot[data-player="${currentPlayer}"][data-index="${i}"]`);
            if(slot) slot.classList.add('clickable');
          }
        });
      }
      player1WinsSpan.textContent = players[0].wins;
      player2WinsSpan.textContent = players[1].wins;
    }

    function getDigitFromAngle(deg) {
      let mod = ((deg%360)+360)%360;
      for(let i=0;i<9;i++){
        let actual = (digitCenters[i]+mod)%360;
        if(actual<0) actual+=360;
        let diff = Math.abs(actual-270);
        if(diff>180) diff=360-diff;
        if(diff<=20) return i+1;
      }
      let best=1, min=Infinity;
      for(let i=0;i<9;i++){
        let actual = (digitCenters[i]+mod)%360;
        if(actual<0) actual+=360;
        let diff = Math.abs(actual-270);
        if(diff>180) diff=360-diff;
        if(diff<min){ min=diff; best=i+1; }
      }
      return best;
    }

    function spinWheel() {
      if(spinInProgress||gameOver||currentDigit!==null||players[currentPlayer].completed) return;
      let target = Math.floor(Math.random()*9)+1;
      let targetCenter = digitCenters[target-1];
      let desired = (270 - targetCenter)%360;
      if(desired<0) desired+=360;
      let offset = (Math.random()-0.5)*18;
      let delta = 7*360 + desired + offset;
      let targetTotal = rotationAngle + delta;

      spinInProgress = true;
      pointerEl.classList.add('wobble');
      updateUI();

      wheelWrapper.style.transition = 'transform 2.2s cubic-bezier(0.2, 0.85, 0.25, 1)';
      wheelWrapper.style.transform = `rotate(${targetTotal}deg)`;
      rotationAngle = targetTotal;

      const onEnd = (e) => {
        if(e.propertyName === 'transform'){
          wheelWrapper.removeEventListener('transitionend', onEnd);
          spinInProgress = false;
          pointerEl.classList.remove('wobble');
          let digit = getDigitFromAngle(rotationAngle);
          currentDigit = digit;
          if(players[currentPlayer].completed) {
            currentDigit = null;
            switchPlayer();
          }
          updateUI();
        }
      };
      wheelWrapper.addEventListener('transitionend', onEnd);
    }

    function switchPlayer() {
      if(players[0].completed && players[1].completed) return;
      if(!players[0].completed && !players[1].completed) currentPlayer = 1-currentPlayer;
      else if(players[0].completed) currentPlayer = 1;
      else currentPlayer = 0;
    }

    function placeDigit(pIdx, sIdx) {
      if(gameOver||currentDigit===null||pIdx!==currentPlayer||players[pIdx].completed||players[pIdx].slots[sIdx]!==null) return false;
      players[pIdx].slots[sIdx] = currentDigit;
      players[pIdx].filledCount++;
      if(players[pIdx].filledCount===3) players[pIdx].completed = true;
      currentDigit = null;
      if(players[0].completed && players[1].completed) {
        gameOver = true;
        showResultPopup();
      } else {
        switchPlayer();
      }
      updateUI();
      return true;
    }

    // ---------- 烟花效果 ----------
    let fireworksCanvas = null;
    let fireworksCtx = null;
    let fireworksAnimationId = null;
    let particles = [];

    function initFireworksCanvas() {
      if (fireworksCanvas) return;
      fireworksCanvas = document.createElement('canvas');
      fireworksCanvas.id = 'fireworksCanvas';
      document.body.appendChild(fireworksCanvas);
      fireworksCanvas.width = window.innerWidth;
      fireworksCanvas.height = window.innerHeight;
      fireworksCtx = fireworksCanvas.getContext('2d');
      window.addEventListener('resize', () => {
        if (fireworksCanvas) {
          fireworksCanvas.width = window.innerWidth;
          fireworksCanvas.height = window.innerHeight;
        }
      });
    }

    function createFireworkBurst(x, y) {
      const count = 40 + Math.floor(Math.random() * 30);
      const colors = ['#FFD700', '#FF6B6B', '#4D96FF', '#FF8C42', '#9B59B6', '#6BCB77', '#FFB347'];
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const speed = 2 + Math.random() * 6;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        particles.push({
          x, y,
          vx, vy,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 2 + Math.random() * 4,
          decay: 0.015 + Math.random() * 0.02,
        });
      }
    }

    function launchFireworks() {
      initFireworksCanvas();
      const scheduleBurst = (delay, x, y) => {
        setTimeout(() => {
          if (!fireworksCanvas) return;
          createFireworkBurst(x, y);
        }, delay);
      };
      const w = window.innerWidth;
      const h = window.innerHeight;
      scheduleBurst(100, w * 0.3, h * 0.3);
      scheduleBurst(350, w * 0.7, h * 0.4);
      scheduleBurst(600, w * 0.5, h * 0.2);
      scheduleBurst(850, w * 0.2, h * 0.6);
      scheduleBurst(1100, w * 0.8, h * 0.7);
      scheduleBurst(1400, w * 0.4, h * 0.5);

      function animate() {
        if (!fireworksCanvas || !fireworksCtx) return;
        fireworksCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.06;
          p.alpha -= p.decay;
          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }
          fireworksCtx.globalAlpha = p.alpha;
          fireworksCtx.fillStyle = p.color;
          fireworksCtx.beginPath();
          fireworksCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          fireworksCtx.fill();
        }
        fireworksAnimationId = requestAnimationFrame(animate);
      }
      animate();
    }

    function removeFireworks() {
      if (fireworksAnimationId) {
        cancelAnimationFrame(fireworksAnimationId);
        fireworksAnimationId = null;
      }
      if (fireworksCanvas) {
        document.body.removeChild(fireworksCanvas);
        fireworksCanvas = null;
        fireworksCtx = null;
      }
      particles = [];
    }

    // ---------- 结果弹窗 ----------
    function showResultPopup() {
      const n1 = parseInt(players[0].slots.join(''),10);
      const n2 = parseInt(players[1].slots.join(''),10);
      let winnerEmoji = '', titleText = '', detail = '';
      if(n1 > n2) {
        players[0].wins++;
        winnerEmoji = '🐼🎉';
        titleText = '玩家1 获胜！';
        detail = `🐼 ${n1}  >  ${n2} 🐨`;
      } else if(n2 > n1) {
        players[1].wins++;
        winnerEmoji = '🐨🎉';
        titleText = '玩家2 获胜！';
        detail = `🐨 ${n2}  >  ${n1} 🐼`;
      } else {
        winnerEmoji = '🤝✨';
        titleText = '平局！';
        detail = `都是 ${n1}  不分上下`;
      }
      updateUI();

      launchFireworks();

      const overlay = document.createElement('div');
      overlay.className = 'cute-popup-overlay';
      overlay.innerHTML = `
        <div class="cute-popup">
          <div class="popup-emoji">${winnerEmoji}</div>
          <div class="popup-text">${titleText}</div>
          <div class="popup-detail">${detail}</div>
          <button class="popup-btn" id="closePopupBtn">🎈 继续玩</button>
        </div>
      `;
      document.body.appendChild(overlay);

      document.getElementById('closePopupBtn').addEventListener('click', ()=>{
        document.body.removeChild(overlay);
        removeFireworks();
      });
    }

    function newRound() {
      players.forEach(p=>{ p.slots=[null,null,null]; p.filledCount=0; p.completed=false; });
      currentPlayer = 0;
      currentDigit = null;
      gameOver = false;
      spinInProgress = false;
      pointerEl.classList.remove('wobble');
      wheelWrapper.style.transition = 'none';
      wheelWrapper.style.transform = `rotate(${rotationAngle}deg)`;
      removeFireworks();
      updateUI();
    }

    spinButton.addEventListener('click', spinWheel);
    allSlots.forEach(slot => {
      slot.addEventListener('click', function(){
        placeDigit(parseInt(this.dataset.player), parseInt(this.dataset.index));
      });
    });
    newRoundButton.addEventListener('click', newRound);

    wheelWrapper.style.transform = 'rotate(0deg)';
    updateUI();
  })();
</script>
</body>
</html>
